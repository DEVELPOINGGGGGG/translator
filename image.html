<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Suite - Image Translator</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="topbar">
  <div class="menuBtn" onclick="toggleSidebar()">☰</div>
  <div class="appTitle">AI Pro Suite</div>
</div>
<div class="apiTracker">
    <div>⏱️ <span id="apiTimer" class="api-val timer">60s</span></div>
    <div>🖼️ <span id="apiVision" class="api-val vision">0</span>/20</div>
    <div>📝 <span id="apiText" class="api-val text">0</span>/20</div>
</div>

<div class="sidebar" id="sidebar">
  <button onclick="window.location.href='index.html'">🏠 Dashboard</button>
  <button onclick="window.location.href='maths.html'">🧮 Math Solver</button>
  <button onclick="window.location.href='search.html'">🔎 Deep Search</button>
  <button onclick="window.location.href='translator.html'">🎙️ Text Translator</button>
  <button onclick="window.location.href='image.html'" style="border-left: 4px solid #a855f7; color: #d8b4fe; background: #111827;">🖼️ Image Translator</button>
  <button onclick="window.location.href='qa.html'">📚 Document Q&A</button>
  <button onclick="window.location.href='history.html'">🕒 History & Downloads</button>
</div>

<div class="page active chat-page-layout" id="imagePage">
  <div class="chat-scroll-area" id="imageScrollArea">
    <div class="card" style="background:linear-gradient(135deg,#a855f7,#7e22ce); border:none; text-align:center; margin-bottom: 20px; flex-shrink: 0;">
        <h1 style="font-size: 24px;">🖼️ Image Translator</h1>
        <p style="font-size: 14px; opacity: 0.9;">Translate up to 3 pages at once.</p>
    </div>
    
    <div id="imageChatHistory">
        <div class="chat-msg chat-ai">
            <div class="bubble">Please click the <b>➕</b> icon to share a photo of translation text. Click the <b>➕</b> icon again to share more photos at once (Max: 3).</div>
        </div>
    </div>
  </div>

  <div class="chat-input-area" style="flex-direction: column;">
    <div id="imagePreviewContainer" style="display: none; gap: 10px; margin-bottom: 10px; overflow-x: auto; width: 100%; padding-bottom: 5px;"></div>
    
    <div class="chat-input-wrapper" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 5px;">
        <button class="chat-action-btn" id="openImageCameraBtn" title="Take Photo" onclick="openCamera('image_trans')" style="flex-shrink: 0;">➕</button>
        
        <select id="chatTargetLang" style="flex: 1; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.2); outline: none; font-family: 'Poppins', sans-serif;">
            <option value="Hindi">Target: Hindi</option>
            <option value="English">Target: English</option>
            <option value="French">Target: French</option>
            <option value="Spanish">Target: Spanish</option>
            <option value="German">Target: German</option>
            <option value="Japanese">Target: Japanese</option>
        </select>
        
        <button class="btn blue" id="sendImageTransBtn" onclick="executeImageTransFlow()" style="margin:0; padding: 12px 20px; border-radius: 12px; white-space: nowrap; flex-shrink: 0;">Convert</button>
    </div>
  </div>
</div>

<div class="cameraModal" id="cameraModal">
  <div class="cameraHeader"><button id="closeCameraBtn">✕</button><div>Camera</div><div></div></div>
  <video id="cameraVideo" class="cameraVideo" autoplay playsinline></video>
  <div class="cameraControls">
    <button class="flashBtn" id="toggleFlashBtn">🔦</button>
    <button class="cameraCircle" id="capturePhotoBtn"></button>
    <button class="switchBtn" id="switchCameraBtn">🔄</button>
  </div>
</div>

<div class="photoViewer" id="photoViewer">
  <div style="position: absolute; top: 20px; right: 20px; z-index: 6001;">
      <button class="closeBtn" id="closePreviewBtn">✕</button>
  </div>
  <img id="previewImage" src="" alt="Preview">
</div>

<canvas id="captureCanvas" style="display:none;"></canvas>
<script src="main.js" defer></script>
</body>
</html>
