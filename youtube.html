<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Finder</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
    }
    #searchBox {
      margin: 20px;
      padding: 10px;
      width: 60%;
      font-size: 18px;
    }
    #searchBtn {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 5px;
    }
    #videoContainer {
      margin-top: 20px;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 80vh;
      border: none;
    }
    #youtubeBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #ff0000;
      color: #fff;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🎬 YouTube Finder (India)</h1>
  <input id="searchBox" type="text" placeholder="Enter topic...">
  <button id="searchBtn">Search</button>

  <div id="videoContainer" style="display:none;">
    <button id="youtubeBtn">Open in YouTube</button>
    <iframe id="videoFrame" allowfullscreen></iframe>
  </div>

  <script>
    async function searchVideo() {
      const topic = document.getElementById("searchBox").value.trim();
      if (!topic) return alert("Enter a topic!");

      // Call your backend search endpoint
      const res = await fetch("/api/groq-search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userPrompt: `Find the best YouTube video in India about ${topic}` })
      });
      const data = await res.json();

      // Extract YouTube link from AI response
      const text = data.text;
      const match = text.match(/https:\/\/www\.youtube\.com\/watch\?v=[\w-]+/);
      if (!match) return alert("No YouTube link found!");

      const videoUrl = match[0];
      const videoId = new URL(videoUrl).searchParams.get("v");

      // Show video player
      document.getElementById("videoContainer").style.display = "block";
      document.getElementById("videoFrame").src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      document.getElementById("youtubeBtn").onclick = () => window.open(videoUrl, "_blank");
    }

    document.getElementById("searchBtn").addEventListener("click", searchVideo);
  </script>
</body>
</html>
