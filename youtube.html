<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YouTube Finder — India</title>
  <style>
    :root{
      --bg:#0b0f14;
      --card:#0f1720;
      --accent:#ff0000;
      --muted:#9aa6b2;
      --glass: rgba(255,255,255,0.03);
      --radius:12px;
      --shadow: 0 8px 30px rgba(2,6,23,0.6);
    }
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;color:#e6eef6;background:linear-gradient(180deg,#07101a 0%, #071827 60%);}
    .wrap{max-width:1100px;margin:28px auto;padding:22px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:16px;box-shadow:var(--shadow);backdrop-filter: blur(6px);}
    header{display:flex;align-items:center;gap:16px}
    h1{margin:0;font-size:20px;letter-spacing:0.2px}
    .sub{color:var(--muted);font-size:13px;margin-top:6px}
    .controls{display:flex;gap:12px;margin-top:18px;align-items:center}
    input[type="search"]{flex:1;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.04);background:var(--glass);color:#fff;font-size:16px;outline:none}
    button.primary{background:var(--accent);color:#fff;padding:12px 18px;border-radius:12px;border:none;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(255,0,0,0.12)}
    button.ghost{background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.03);cursor:pointer}
    .status{margin-left:8px;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
    .spinner{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,0.08);border-top-color:var(--accent);animation:spin 1s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* results list */
    .results{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:20px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease}
    .card:hover{transform:translateY(-6px);box-shadow:0 12px 30px rgba(2,6,23,0.6)}
    .thumb{width:160px;height:90px;border-radius:8px;background-size:cover;background-position:center;flex-shrink:0}
    .meta{flex:1;display:flex;flex-direction:column;gap:6px}
    .title{font-weight:700;font-size:15px;color:#fff;line-height:1.2}
    .channel{color:var(--muted);font-size:13px}
    .duration{color:var(--muted);font-size:12px}
    .playBtn{background:var(--accent);color:#fff;padding:8px 10px;border-radius:10px;border:none;font-weight:700;cursor:pointer}

    /* player overlay */
    .overlay{position:fixed;inset:0;background:rgba(2,6,23,0.7);display:none;align-items:center;justify-content:center;z-index:9999}
    .playerCard{width:100%;max-width:1200px;height:calc(100vh - 60px);background:#000;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;align-items:stretch}
    .playerTop{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:linear-gradient(180deg, rgba(0,0,0,0.6), rgba(0,0,0,0.2));color:#fff}
    .playerTitle{font-weight:700}
    .playerActions{display:flex;gap:8px;align-items:center}
    .btnClose{background:transparent;border:1px solid rgba(255,255,255,0.06);color:#fff;padding:8px 10px;border-radius:8px;cursor:pointer}
    .btnYouTube{background:var(--accent);color:#fff;padding:8px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:700}
    .playerFrame{flex:1;background:#000;display:flex;align-items:center;justify-content:center}
    .playerFrame iframe{width:100%;height:100%;border:0}

    /* small helpers */
    .muted{color:var(--muted)}
    footer{margin-top:18px;color:var(--muted);font-size:13px;text-align:center}
    @media (max-width:640px){
      .thumb{width:120px;height:72px}
      .playerCard{height:100vh;border-radius:0}
    }
  </style>
</head>
<body>
  <div class="wrap" role="main">
    <header>
      <div>
        <h1>YouTube Finder — India</h1>
        <div class="sub">Type a topic, let Gemini refine the query, then yt-search returns the best India-focused videos.</div>
      </div>
    </header>

    <div class="controls" style="margin-top:18px">
      <input id="topicInput" type="search" placeholder="e.g. Best Rohit Sharma innings highlights India 2025" aria-label="Search topic" />
      <button id="searchBtn" class="primary">Search</button>
      <button id="clearBtn" class="ghost">Clear</button>
      <div class="status" id="status" aria-live="polite"><span class="muted">Idle</span></div>
    </div>

    <div id="results" class="results" aria-live="polite"></div>

    <footer>
      <div class="muted">Powered by Gemini (refine) + yt-search (fetch). Click a result to open the fullscreen player.</div>
    </footer>
  </div>

  <!-- player overlay -->
  <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="playerCard" role="document">
      <div class="playerTop">
        <div class="playerTitle" id="playerTitle">Playing</div>
        <div class="playerActions">
          <button id="openYoutube" class="btnYouTube">Open in YouTube</button>
          <button id="closePlayer" class="btnClose">Close</button>
        </div>
      </div>
      <div class="playerFrame" id="playerFrame">
        <!-- iframe inserted dynamically -->
      </div>
    </div>
  </div>

  <script>
    // ---------- helpers ----------
    const $ = id => document.getElementById(id);
    const statusEl = $('status');
    const resultsEl = $('results');
    const overlay = $('overlay');
    const playerTitle = $('playerTitle');
    const playerFrame = $('playerFrame');
    const openYoutube = $('openYoutube');
    const closePlayer = $('closePlayer');

    function setStatus(text, busy=false){
      statusEl.innerHTML = busy ? '<span class="spinner" aria-hidden="true"></span><span style="margin-left:8px">'+text+'</span>' : '<span class="muted">'+text+'</span>';
    }

    function clearResults(){ resultsEl.innerHTML = ''; }

    function createCard(video){
      const card = document.createElement('div');
      card.className = 'card';
      card.tabIndex = 0;
      card.setAttribute('role','button');

      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.style.backgroundImage = `url(${video.thumbnail})`;

      const meta = document.createElement('div');
      meta.className = 'meta';

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = video.title;

      const channel = document.createElement('div');
      channel.className = 'channel';
      channel.textContent = video.author.name + ' • ' + (video.timestamp || '');

      const actions = document.createElement('div');
      actions.style.marginTop = '8px';
      const playBtn = document.createElement('button');
      playBtn.className = 'playBtn';
      playBtn.textContent = 'Play';
      playBtn.onclick = (e) => { e.stopPropagation(); openPlayer(video); };

      actions.appendChild(playBtn);
      meta.appendChild(title);
      meta.appendChild(channel);
      meta.appendChild(actions);

      card.appendChild(thumb);
      card.appendChild(meta);

      card.onclick = () => openPlayer(video);
      card.onkeypress = (e) => { if(e.key === 'Enter') openPlayer(video); };

      return card;
    }

    function openPlayer(video){
      playerTitle.textContent = video.title;
      playerFrame.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.src = `https://www.youtube.com/embed/${video.videoId}?autoplay=1&rel=0&modestbranding=1`;
      iframe.allow = 'autoplay; fullscreen; picture-in-picture';
      iframe.setAttribute('allowfullscreen','');
      playerFrame.appendChild(iframe);
      openYoutube.onclick = () => window.open(video.url, '_blank', 'noopener');
      overlay.style.display = 'flex';
      overlay.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
    }

    function closeOverlay(){
      overlay.style.display = 'none';
      overlay.setAttribute('aria-hidden','true');
      playerFrame.innerHTML = '';
      document.body.style.overflow = '';
    }

    closePlayer.addEventListener('click', closeOverlay);
    overlay.addEventListener('click', (e) => { if(e.target === overlay) closeOverlay(); });

    // ---------- main search flow ----------
    async function doSearch(){
      const topic = document.getElementById('topicInput').value.trim();
      if(!topic) return alert('Enter a topic to search for.');

      clearResults();
      setStatus('Searching with Gemini...', true);

      try {
        // call backend endpoint that runs Gemini -> yt-search
        const resp = await fetch('/api/youtube-search', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ topic })
        });

        const data = await resp.json();
        if(!resp.ok) throw new Error(data.error || 'Search failed');

        // data.results expected to be an array of video objects
        const videos = data.results || (data.videoId ? [data] : []);
        if(videos.length === 0) {
          setStatus('No videos found', false);
          resultsEl.innerHTML = '<div class="muted" style="padding:18px">No results. Try a different topic.</div>';
          return;
        }

        setStatus(`Found ${videos.length} result${videos.length>1?'s':''}`, false);

        // render cards
        videos.forEach(v => {
          const card = createCard(v);
          resultsEl.appendChild(card);
        });

        // subtle entrance animation
        resultsEl.style.opacity = 0;
        requestAnimationFrame(()=> resultsEl.style.transition = 'opacity .25s ease-in', requestAnimationFrame(()=> resultsEl.style.opacity = 1));

      } catch (err) {
        console.error(err);
        setStatus('Error: ' + (err.message || 'unknown'), false);
        resultsEl.innerHTML = `<div class="muted" style="padding:18px">Error: ${err.message}</div>`;
      }
    }

    // UI wiring
    document.getElementById('searchBtn').addEventListener('click', () => { setStatus('Preparing search...', true); setTimeout(doSearch, 250); });
    document.getElementById('clearBtn').addEventListener('click', () => { $('topicInput').value=''; clearResults(); setStatus('Idle', false); });
    document.getElementById('topicInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') document.getElementById('searchBtn').click(); });

    // initial state
    setStatus('Idle', false);
  </script>
</body>
</html>
