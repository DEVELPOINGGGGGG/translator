<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Suite - YouTube Learning</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
        /* Mic Recording Animation */
        @keyframes pulse-mic {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording {
            animation: pulse-mic 1.5s infinite;
            background: rgba(239, 68, 68, 0.9) !important;
            border-color: #ef4444 !important;
        }
        /* Grid Fix to ensure videos look good */
        .yt-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="topbar">
  <div class="menuBtn" onclick="toggleSidebar()">☰</div>
  <div class="appTitle">AI Pro Suite</div>
</div>

<div class="sidebar" id="sidebar">
  <button onclick="window.location.href='index.html'">🏠 Dashboard</button>
  <button onclick="window.location.href='maths.html'">🧮 Math Solver</button>
  <button onclick="window.location.href='search.html'">🔎 Deep Search</button>
  <button style="border-left: 4px solid #ef4444; color: #ffb4b4; background: rgba(239,68,68,0.1);">🎬 YouTube Learning</button>
  <button onclick="window.location.href='translator.html'">🎙️ Text Translator</button>
  <button onclick="window.location.href='image.html'">🖼️ Image Translator</button>
  <button onclick="window.location.href='qa.html'">📄 Document Q&A</button>
  <button onclick="window.location.href='create.html'">✨ Image Creator</button>
  <button onclick="window.location.href='history.html'">🕒 History</button>
</div>

<div class="page active" style="top: 70px; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; padding-bottom: 150px;">
    
    <div class="card" style="width: 100%; max-width: 800px; text-align: center; padding: 25px; position: sticky; top: 0; z-index: 50; box-shadow: 0 15px 40px rgba(0,0,0,0.8);">
        
        <div style="display: flex; gap: 10px; margin-top: 15px; align-items: center; flex-wrap: wrap;">
            <select id="micLang" style="width: auto; padding: 12px; border-radius: 12px; margin-bottom: 0; flex-shrink: 0; font-size: 14px;">
                <option value="en-US">English</option>
                <option value="hi-IN">Hindi</option>
            </select>

            <button id="voiceBtn" class="cam-icon-btn" style="border-radius: 12px; width: 50px; height: 50px; flex-shrink: 0; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.4);" title="Voice Search">
                <span style="font-size: 20px;">🎤</span>
            </button>

            <button class="cam-icon-btn" style="border-radius: 12px; width: 50px; height: 50px; flex-shrink: 0; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.4);" onclick="openCamera()" title="Scan Problem">
                <span style="font-size: 20px;">📷</span>
            </button>
            
            <input type="text" id="ytSearchInput" class="standard" placeholder="Topic or voice..." style="margin-bottom: 0; font-size: 15px; border-radius: 12px; flex: 1; min-width: 200px;">
        </div>
        
        <button id="ytSearchBtn" class="btn red" style="margin-top: 15px; border-radius: 30px; font-size: 15px;">🔍 AI Search & Rank</button>
        <div id="ytStatus" style="margin-top: 10px; font-size: 14px; font-weight: 600; color: #94a3b8; min-height: 20px;">Ready.</div>
    </div>

    <div id="ytResults" class="yt-grid">
        </div>

    <button id="loadMoreBtn" class="btn blue" style="width: 100%; max-width: 400px; padding: 15px; border-radius: 30px; margin-top: 40px; display: none; font-size: 16px; font-weight: 800; box-shadow: 0 10px 30px rgba(56,189,248,0.4);">
        ⬇️ Load 15 More Videos
    </button>
</div>

<div id="cameraModal" class="cameraModal">
    <video id="cameraVideo" autoplay playsinline></video>
    <div class="camera-top-bar"><button id="closeCameraBtn" class="cam-icon-btn">❌</button></div>
    <div class="cameraControls">
        <button id="toggleFlashBtn" class="cam-icon-btn">🔦</button>
        <div id="capturePhotoBtn" class="cameraCircle"></div>
        <button id="switchCameraBtn" class="cam-icon-btn">🔄</button>
    </div>
    <canvas id="captureCanvas" style="display:none;"></canvas>
</div>

<div id="ytPlayerOverlay" style="position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px); z-index: 99999; display: none; flex-direction: column;">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #000; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <button id="ytRedirectBtn" class="btn red" style="width: auto; margin: 0; padding: 10px 20px; border-radius: 30px;">🚀 Open App</button>
        <button id="ytCloseBtn" class="closeBtn" style="position: static; margin: 0;">✕</button>
    </div>
    <div style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px;">
        <iframe id="ytIframe" style="width: 100%; max-width: 1200px; height: 100%; max-height: 700px; border-radius: 12px; border: none; box-shadow: 0 20px 50px rgba(0,0,0,0.8);" allow="autoplay; fullscreen; encrypted-media"></iframe>
    </div>
</div>

<script>
    // --- Sidebar ---
    function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const active = !sidebar.classList.contains("active");
        sidebar.classList.toggle("active", active);
        overlay.classList.toggle("active", active);
    }
    document.getElementById("overlay").onclick = toggleSidebar;

    // --- Elements & State ---
    const searchInput = document.getElementById('ytSearchInput');
    const searchBtn = document.getElementById('ytSearchBtn');
    const statusText = document.getElementById('ytStatus');
    const resultsContainer = document.getElementById('ytResults');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    
    let allRankedVideos = [];
    let currentRenderIndex = 0;

    searchInput.addEventListener("keypress", (e) => { if(e.key === "Enter") searchBtn.click(); });

    // --- Voice Recognition Engine ---
    const voiceBtn = document.getElementById('voiceBtn');
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = SpeechRec ? new SpeechRec() : null;

    if(recognition) {
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.onstart = () => { voiceBtn.classList.add('recording'); searchInput.placeholder = "Listening..."; };
        recognition.onresult = (e) => { searchInput.value = e.results[0][0].transcript; };
        recognition.onend = () => { 
            voiceBtn.classList.remove('recording'); searchInput.placeholder = "Topic or voice..."; 
            if(searchInput.value.trim() !== "") searchBtn.click(); 
        };
    }

    voiceBtn.addEventListener('click', () => {
        if(!recognition) return alert("Microphone not supported on this browser.");
        recognition.lang = document.getElementById('micLang').value;
        recognition.start();
    });

    // --- BULLETPROOF Render Engine ---
    function renderVideos(count) {
        if (allRankedVideos.length === 0) return;

        const batch = allRankedVideos.slice(currentRenderIndex, currentRenderIndex + count);
        
        const html = batch.map((vid, index) => {
            // First 3 videos get the Top Pick badge
            const isTopPick = (currentRenderIndex + index) < 3;
            const badgeHtml = isTopPick ? `<div style="position:absolute; top:-10px; left:-10px; background:linear-gradient(135deg, #f59e0b, #ef4444); color:white; padding:4px 10px; border-radius:10px; font-size:11px; font-weight:900; box-shadow:0 5px 15px rgba(245,158,11,0.5); z-index:10; transform:rotate(-5deg);">⭐ TOP PICK</div>` : '';

            return `
            <div class="card" style="padding: 15px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; position:relative; overflow: visible;" onclick="openVideoPlayer('${vid.videoId}', '${vid.url}')">
                ${badgeHtml}
                <div style="position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);">
                    <img src="${vid.thumbnail}" style="width: 100%; height: 100%; object-fit: cover; transition: 0.3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                    <div style="position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: white; padding: 2px 6px; font-size: 11px; font-weight: bold; border-radius: 4px;">
                        ${vid.timestamp || 'Video'}
                    </div>
                </div>
                <div style="font-weight: 800; font-size: 14px; line-height: 1.4; color: #f8fafc; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                    ${vid.title}
                </div>
                <div style="font-size: 12px; color: var(--muted); font-weight: 600;">👤 ${vid.author?.name || 'Creator'}</div>
            </div>`;
        }).join('');

        if(currentRenderIndex === 0) resultsContainer.innerHTML = html;
        else resultsContainer.insertAdjacentHTML('beforeend', html);

        currentRenderIndex += batch.length;

        // FORCE BUTTON TO SHOW OR HIDE BASED ON REMAINING VIDEOS
        if (currentRenderIndex >= allRankedVideos.length) {
            loadMoreBtn.style.display = 'none';
        } else {
            loadMoreBtn.style.display = 'block';
            loadMoreBtn.innerText = `⬇️ Load 15 More Videos (${allRankedVideos.length - currentRenderIndex} left)`;
        }
    }

    loadMoreBtn.addEventListener('click', () => renderVideos(15));

    // --- Core Search & Gemini Rank Logic ---
    searchBtn.addEventListener('click', async () => {
        const rawTopic = searchInput.value.trim();
        if (!rawTopic) return;

        searchBtn.disabled = true; searchBtn.style.opacity = '0.6';
        searchBtn.innerHTML = '<div class="spinner"></div> Processing...';
        loadMoreBtn.style.display = 'none';
        
        resultsContainer.innerHTML = "";
        statusText.innerHTML = "Fetching videos from server...";

        try {
            // 1. Fetch videos
            const ytResponse = await fetch('/api/youtube-search', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ topic: rawTopic })
            });
            const ytData = await ytResponse.json();
            if (!ytResponse.ok) throw new Error("YouTube search failed.");
            
            const rawVideos = ytData.results || [];
            if (rawVideos.length === 0) throw new Error(`No videos found for "${rawTopic}"`);

            statusText.innerHTML = `🧠 Server found <b>${rawVideos.length}</b> videos. Gemini is ranking them...`;

            // 2. Format list for Gemini
            const titleList = rawVideos.map((v, i) => `${i} - ${v.title}`).join('\n');
            const rankingPrompt = `Analyze these YouTube video titles for: "${rawTopic}". Determine the highest quality educational videos. Return STRICTLY a JSON array of the indices ranked from best to worst. Example: [5, 1, 0, 12].`;

            // 3. Ask Gemini to re-rank
            let rankedIndices = [];
            try {
                const aiResponse = await fetch('/api/gemini-text', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ systemPrompt: "You return strictly a valid JSON array of numbers.", userPrompt: rankingPrompt })
                });
                const aiData = await aiResponse.json();
                const match = aiData.text.match(/\[(.*?)\]/);
                if(match) rankedIndices = JSON.parse(`[${match[1]}]`);
                else throw new Error("Format failed");
            } catch (aiErr) {
                // FALLBACK: If Gemini fails, just use the normal YouTube order
                rankedIndices = rawVideos.map((_, i) => i); 
            }

            // 4. Sort the video array perfectly
            allRankedVideos = [];
            let addedIndices = new Set();
            
            rankedIndices.forEach(idx => {
                if(rawVideos[idx] && !addedIndices.has(idx)) {
                    allRankedVideos.push(rawVideos[idx]);
                    addedIndices.add(idx);
                }
            });
            
            // Catch any videos Gemini missed
            rawVideos.forEach((v, idx) => {
                if(!addedIndices.has(idx)) allRankedVideos.push(v);
            });

            // 5. Render
            currentRenderIndex = 0;
            renderVideos(15);
            statusText.innerHTML = `✅ Successfully loaded and ranked <b>${allRankedVideos.length}</b> videos!`;

        } catch (error) {
            statusText.innerHTML = `❌ Error: ${error.message}`;
        } finally {
            searchBtn.disabled = false; searchBtn.style.opacity = '1';
            searchBtn.innerHTML = '🔍 AI Search & Rank';
        }
    });

    // --- Camera & AI Extraction Logic ---
    let currentStream = null; let currentFacing = "environment";
    async function openCamera() {
        document.getElementById('cameraModal').classList.add('active');
        try {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacing, width: {ideal: 1920}, height: {ideal: 1080} } });
            document.getElementById("cameraVideo").srcObject = currentStream;
        } catch(e) { alert("Camera Error."); }
    }
    function closeCamera() {
        document.getElementById('cameraModal').classList.remove('active');
        if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
    }
    
    document.getElementById('closeCameraBtn').onclick = closeCamera;
    document.getElementById('switchCameraBtn').onclick = async () => { currentFacing = currentFacing === "environment" ? "user" : "environment"; await openCamera(); };

    document.getElementById('capturePhotoBtn').onclick = async () => {
        const v = document.getElementById("cameraVideo"); const c = document.getElementById("captureCanvas");
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
        const b64 = c.toDataURL("image/jpeg", 0.8);
        closeCamera();

        searchInput.value = "Scanning image...";
        searchBtn.disabled = true; searchBtn.style.opacity = '0.6'; searchBtn.innerHTML = '<div class="spinner"></div> Extracting...';

        try {
            const res = await fetch("/api/gemini-vision", {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ imageBase64: b64, userPrompt: "Extract the core educational topic or question from this image to use as a YouTube search query. Be highly concise. Only output the search terms, nothing else. DO NOT use formatting." })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);
            
            searchInput.value = data.text.replace(/[\*\"]/g, '').trim();
            searchBtn.disabled = false; searchBtn.style.opacity = '1'; searchBtn.click(); 
        } catch (e) {
            searchInput.value = ""; statusText.innerHTML = "❌ Failed: " + e.message;
            searchBtn.disabled = false; searchBtn.style.opacity = '1'; searchBtn.innerHTML = '🔍 AI Search & Rank';
        }
    };

    // --- Video Player Logic ---
    let currentVideoUrl = "";
    const playerOverlay = document.getElementById('ytPlayerOverlay');
    const ytIframe = document.getElementById('ytIframe');

    window.openVideoPlayer = function(videoId, url) {
        currentVideoUrl = url;
        ytIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
        playerOverlay.style.display = 'flex';
        document.body.style.overflow = 'hidden'; 
    };

    document.getElementById('ytCloseBtn').addEventListener('click', () => {
        ytIframe.src = ""; playerOverlay.style.display = 'none'; document.body.style.overflow = ''; 
    });

    document.getElementById('ytRedirectBtn').addEventListener('click', () => {
        if(currentVideoUrl) window.open(currentVideoUrl, '_blank');
        document.getElementById('ytCloseBtn').click(); 
    });
</script>
</body>
</html>
