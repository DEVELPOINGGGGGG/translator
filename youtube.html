<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Suite - YouTube Learning</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
   <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script> 
    <link rel="stylesheet" href="style.css">

    <style>
        /* Mic Recording Animation */
        @keyframes pulse-mic {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording {
            animation: pulse-mic 1.5s infinite;
            background: rgba(239, 68, 68, 0.9) !important;
            border-color: #ef4444 !important;
        }
        /* Grid Fix */
        .yt-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            margin-top: 30px;
        }
        .yt-player-top {
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 20px; background: #000; border-bottom: 1px solid rgba(255,255,255,0.1); 
            gap: 10px; flex-wrap: wrap;
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="topbar">
  <div class="menuBtn" onclick="toggleSidebar()">☰</div>
  <div class="appTitle">AI Pro Suite</div>
</div>
<div class="sidebar" id="sidebar">
  <button class="sidebar-close-btn" onclick="toggleSidebar()">✖ Close Menu</button>
  <button onclick="window.location.href='index.html'">🏠 Dashboard</button>
  <button onclick="window.location.href='maths.html'">🧮 Math Solver (Gemini)</button>
  <button onclick="window.location.href='search.html'">🔎 Deep Search (Groq)</button>
  <button onclick="window.location.href='youtube.html'">▶️ YouTube Search</button>
  <button onclick="window.location.href='quiz.html'">📝 Take a Quiz!</button>
  <button onclick="window.location.href='chess.html'">♟️ Chess AI</button>
  <button onclick="window.location.href='translator.html'">🎙️ Text Translator</button>
  <button onclick="window.location.href='image.html'">🖼️ Image Translator</button>
  <button onclick="window.location.href='create.html'">🎨 Image Creator</button>
  <button onclick="window.location.href='qa.html'">📚 Document Q&A</button>
  <button onclick="window.location.href='history.html'">🕒 History & Downloads</button>

</div>

<div class="page active" style="top: 70px; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; padding-bottom: 150px;">
    
    <div class="card" style="width: 100%; max-width: 800px; text-align: center; padding: 25px;">
        <h2 class="cardTitle" style="color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.4); font-size: 24px; margin-bottom: 5px;">YouTube AI Engine</h2>
        
        <div style="display: flex; gap: 10px; margin-top: 15px; align-items: center; flex-wrap: wrap;">
            <button id="openVoiceGuiBtn" class="cam-icon-btn" style="border-radius: 12px; width: 50px; height: 50px; flex-shrink: 0; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.4);" title="Voice Search">
                <span style="font-size: 20px;">🎤</span>
            </button>

            <button class="cam-icon-btn" style="border-radius: 12px; width: 50px; height: 50px; flex-shrink: 0; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.4);" onclick="openCamera()" title="Scan Problem">
                <span style="font-size: 20px;">📷</span>
            </button>
            
            <input type="text" id="ytSearchInput" class="standard" placeholder="Enter topic to search..." style="margin-bottom: 0; font-size: 15px; border-radius: 12px; flex: 1; min-width: 200px;">
        </div>
        
        <button id="ytSearchBtn" class="btn red" style="margin-top: 15px; border-radius: 30px; font-size: 15px;">🔍 AI Search & Rank</button>
        <div id="ytStatus" style="margin-top: 10px; font-size: 14px; font-weight: 600; color: #94a3b8; min-height: 20px;">Ready.</div>
    </div>

    <div id="ytResults" class="yt-grid">
        </div>

    <button id="loadMoreBtn" class="btn blue" style="width: 100%; max-width: 400px; padding: 15px; border-radius: 30px; margin-top: 40px; display: none; font-size: 16px; font-weight: 800; box-shadow: 0 10px 30px rgba(56,189,248,0.4);">
        ⬇️ Load 15 More Videos
    </button>
</div>

<div id="voiceModal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 100000; display: none; align-items: center; justify-content: center; padding: 20px;">
    <div class="card" style="width: 100%; max-width: 400px; text-align: center; padding: 30px; border-radius: 25px;">
        <h3 class="cardTitle" style="font-size: 22px; color: #38bdf8;">🎙️ Voice Input</h3>
        
        <select id="voiceModalLang" class="standard" style="margin-top: 15px; border-radius: 15px;">
            <option value="en-US">English</option>
            <option value="hi-IN">Hindi</option>
        </select>

        <div style="margin: 25px 0;">
            <button id="voiceRecordBtn" class="cam-icon-btn" style="width: 80px; height: 80px; border-radius: 50%; background: rgba(239, 68, 68, 0.2); border: 2px solid #ef4444; font-size: 30px; margin: 0 auto;">🎤</button>
        </div>
        
        <textarea id="voiceModalText" class="standard" placeholder="Tap the mic and speak. Your text will appear here..." style="min-height: 100px; border-radius: 15px; font-size: 16px;"></textarea>
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button id="voiceCancelBtn" class="btn" style="flex: 1; background: #475569; color: white;">Cancel</button>
            <button id="voiceApplyBtn" class="btn blue" style="flex: 1;">✔️ Use Text</button>
        </div>
    </div>
</div>

<div id="cameraModal" class="cameraModal">
    <video id="cameraVideo" autoplay playsinline></video>
    <div class="camera-top-bar"><button id="closeCameraBtn" class="cam-icon-btn">❌</button></div>
    <div class="cameraControls">
        <button id="toggleFlashBtn" class="cam-icon-btn">🔦</button>
        <div id="capturePhotoBtn" class="cameraCircle"></div>
        <button id="switchCameraBtn" class="cam-icon-btn">🔄</button>
    </div>
    <canvas id="captureCanvas" style="display:none;"></canvas>
</div>

<div id="ytPlayerOverlay" style="position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 99999; display: none; flex-direction: column; overflow: hidden;">
    
    <div class="yt-player-top">
        <div style="display: flex; gap: 10px; align-items: center;">
            <button id="ytRedirectBtn" class="btn red" style="width: auto; margin: 0; padding: 8px 15px; border-radius: 30px; font-size: 13px;">🚀 Open App</button>
            <button id="ytOrientationBtn" class="btn blue" style="width: auto; margin: 0; padding: 8px 15px; border-radius: 30px; font-size: 13px; box-shadow: 0 0 15px rgba(56,189,248,0.4);">📱 Portrait Mode</button>
        </div>
        <button id="ytCloseBtn" class="closeBtn" style="position: static; margin: 0; width: 45px; height: 45px; font-size: 18px;">✕</button>
    </div>
    
    <div style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 10px; width: 100%;">
        
        <iframe id="ytIframe" style="width: 100%; max-width: 1200px; height: 100%; border-radius: 12px; border: none; box-shadow: 0 20px 50px rgba(0,0,0,0.8);" allow="autoplay; fullscreen; encrypted-media" sandbox="allow-same-origin allow-scripts allow-popups allow-presentation"></iframe>

    </div>
</div>

<script>
    // --- Sidebar ---
    function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const active = !sidebar.classList.contains("active");
        sidebar.classList.toggle("active", active);
        overlay.classList.toggle("active", active);
    }
    document.getElementById("overlay").onclick = toggleSidebar;

    // --- Elements & State ---
    const searchInput = document.getElementById('ytSearchInput');
    const searchBtn = document.getElementById('ytSearchBtn');
    const statusText = document.getElementById('ytStatus');
    const resultsContainer = document.getElementById('ytResults');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    
    let allRankedVideos = [];
    let currentRenderIndex = 0;

    searchInput.addEventListener("keypress", (e) => { if(e.key === "Enter") searchBtn.click(); });

    // --- HISTORY SAVING ENGINE ---
    function saveYoutubeHistory(topic, videoCount) {
        try {
            let history = JSON.parse(localStorage.getItem('aiHistory') || '[]');
            let sessionId = Date.now();
            let histItem = {
                id: sessionId,
                type: 'youtube',
                title: topic.substring(0, 30) + '...',
                interactions: [{
                    question: "YouTube Search: " + topic,
                    answer: "Successfully found and ranked " + videoCount + " educational videos.",
                    provider: "Gemini + YouTube"
                }],
                provider: "Gemini + YouTube",
                question: "YouTube Search: " + topic,
                answer: "Successfully found and ranked " + videoCount + " educational videos."
            };
            history.unshift(histItem);
            localStorage.setItem('aiHistory', JSON.stringify(history));
        } catch(e) { console.error("Failed to save history", e); }
    }

    // --- VOICE GUI LOGIC ---
    const voiceModal = document.getElementById('voiceModal');
    const voiceRecordBtn = document.getElementById('voiceRecordBtn');
    const voiceModalText = document.getElementById('voiceModalText');
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = SpeechRec ? new SpeechRec() : null;
    let isRecording = false;

    document.getElementById('openVoiceGuiBtn').addEventListener('click', () => {
        voiceModalText.value = ""; voiceModal.style.display = 'flex';
    });
    document.getElementById('voiceCancelBtn').addEventListener('click', () => {
        if(isRecording && recognition) recognition.stop();
        voiceModal.style.display = 'none';
    });
    document.getElementById('voiceApplyBtn').addEventListener('click', () => {
        if(isRecording && recognition) recognition.stop();
        if(voiceModalText.value.trim() !== "") { searchInput.value = voiceModalText.value.trim(); }
        voiceModal.style.display = 'none';
    });

    if(recognition) {
        recognition.continuous = false; recognition.interimResults = false;
        recognition.onstart = () => { isRecording = true; voiceRecordBtn.classList.add('recording'); voiceModalText.placeholder = "Listening..."; };
        recognition.onresult = (e) => { voiceModalText.value = e.results[0][0].transcript; };
        recognition.onend = () => { isRecording = false; voiceRecordBtn.classList.remove('recording'); voiceModalText.placeholder = "Tap the mic and speak. Your text will appear here..."; };
    }

    voiceRecordBtn.addEventListener('click', () => {
        if(!recognition) return alert("Microphone not supported on this browser.");
        if(isRecording) { recognition.stop(); } else { recognition.lang = document.getElementById('voiceModalLang').value; recognition.start(); }
    });

    // --- BULLETPROOF Render Engine ---
    function renderVideos(count) {
        if (allRankedVideos.length === 0) return;

        const batch = allRankedVideos.slice(currentRenderIndex, currentRenderIndex + count);
        
        const html = batch.map((vid, index) => {
            const isTopPick = (currentRenderIndex + index) < 3;
            const badgeHtml = isTopPick ? `<div style="position:absolute; top:-10px; left:-10px; background:linear-gradient(135deg, #f59e0b, #ef4444); color:white; padding:4px 10px; border-radius:10px; font-size:11px; font-weight:900; box-shadow:0 5px 15px rgba(245,158,11,0.5); z-index:10; transform:rotate(-5deg);">⭐ TOP PICK</div>` : '';

            return `
            <div class="card" style="padding: 15px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; position:relative; overflow: visible;" onclick="openVideoPlayer('${vid.videoId}', '${vid.url}')">
                ${badgeHtml}
                <div style="position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);">
                    <img src="${vid.thumbnail}" style="width: 100%; height: 100%; object-fit: cover; transition: 0.3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                    <div style="position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: white; padding: 2px 6px; font-size: 11px; font-weight: bold; border-radius: 4px;">
                        ${vid.timestamp || 'Video'}
                    </div>
                </div>
                <div style="font-weight: 800; font-size: 14px; line-height: 1.4; color: #f8fafc; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                    ${vid.title}
                </div>
                <div style="font-size: 12px; color: var(--muted); font-weight: 600;">👤 ${vid.author?.name || 'Creator'}</div>
            </div>`;
        }).join('');

        if(currentRenderIndex === 0) resultsContainer.innerHTML = html;
        else resultsContainer.insertAdjacentHTML('beforeend', html);

        currentRenderIndex += batch.length;

        if (currentRenderIndex >= allRankedVideos.length) {
            loadMoreBtn.style.display = 'none';
        } else {
            loadMoreBtn.style.display = 'block';
            loadMoreBtn.innerText = `⬇️ Load 15 More Videos (${allRankedVideos.length - currentRenderIndex} left)`;
        }
    }

    loadMoreBtn.addEventListener('click', () => renderVideos(15));

    // --- Core Search & Gemini Rank Logic ---
    searchBtn.addEventListener('click', async () => {
        const rawTopic = searchInput.value.trim();
        if (!rawTopic) return;

        searchBtn.disabled = true; searchBtn.style.opacity = '0.6';
        searchBtn.innerHTML = '<div class="spinner"></div> Processing...';
        loadMoreBtn.style.display = 'none';
        
        resultsContainer.innerHTML = "";
        statusText.innerHTML = "Fetching videos from server...";

        try {
            const ytResponse = await fetch('/api/youtube-search', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ topic: rawTopic })
            });
            const ytData = await ytResponse.json();
            if (!ytResponse.ok) throw new Error("YouTube search failed.");
            
            const rawVideos = ytData.results || [];
            if (rawVideos.length === 0) throw new Error(`No videos found for "${rawTopic}"`);

            statusText.innerHTML = `🧠 Server found <b>${rawVideos.length}</b> videos. Gemini is ranking them...`;

            const titleList = rawVideos.map((v, i) => `${i} - ${v.title}`).join('\n');
            const rankingPrompt = `Analyze these YouTube video titles for: "${rawTopic}". Determine the highest quality educational videos. Return STRICTLY a JSON array of the indices ranked from best to worst. Example: [5, 1, 0, 12].`;

            let rankedIndices = [];
            try {
                const aiResponse = await fetch('/api/gemini-text', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ systemPrompt: "You return strictly a valid JSON array of numbers.", userPrompt: rankingPrompt })
                });
                const aiData = await aiResponse.json();
                const match = aiData.text.match(/\[(.*?)\]/);
                if(match) rankedIndices = JSON.parse(`[${match[1]}]`);
                else throw new Error("Format failed");
            } catch (aiErr) {
                rankedIndices = rawVideos.map((_, i) => i); 
            }

            allRankedVideos = [];
            let addedIndices = new Set();
            
            rankedIndices.forEach(idx => {
                if(rawVideos[idx] && !addedIndices.has(idx)) {
                    allRankedVideos.push(rawVideos[idx]); addedIndices.add(idx);
                }
            });
            
            rawVideos.forEach((v, idx) => {
                if(!addedIndices.has(idx)) allRankedVideos.push(v);
            });

            currentRenderIndex = 0;
            renderVideos(15);
            statusText.innerHTML = `✅ Successfully loaded and ranked <b>${allRankedVideos.length}</b> videos!`;
            
            saveYoutubeHistory(rawTopic, allRankedVideos.length);

        } catch (error) {
            statusText.innerHTML = `❌ Error: ${error.message}`;
        } finally {
            searchBtn.disabled = false; searchBtn.style.opacity = '1';
            searchBtn.innerHTML = '🔍 AI Search & Rank';
        }
    });

    // --- Camera & AI Extraction Logic ---
    let currentStream = null; let currentFacing = "environment";
    async function openCamera() {
        document.getElementById('cameraModal').classList.add('active');
        try {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacing, width: {ideal: 1920}, height: {ideal: 1080} } });
            document.getElementById("cameraVideo").srcObject = currentStream;
        } catch(e) { alert("Camera Error."); }
    }
    function closeCamera() {
        document.getElementById('cameraModal').classList.remove('active');
        if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
    }
    
    document.getElementById('closeCameraBtn').onclick = closeCamera;
    document.getElementById('switchCameraBtn').onclick = async () => { currentFacing = currentFacing === "environment" ? "user" : "environment"; await openCamera(); };

    document.getElementById('capturePhotoBtn').onclick = async () => {
        const v = document.getElementById("cameraVideo"); const c = document.getElementById("captureCanvas");
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
        const b64 = c.toDataURL("image/jpeg", 0.8);
        closeCamera();

        searchInput.value = "Scanning image...";
        searchBtn.disabled = true; searchBtn.style.opacity = '0.6'; searchBtn.innerHTML = '<div class="spinner"></div> Extracting...';

        try {
            const res = await fetch("/api/gemini-vision", {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ imageBase64: b64, userPrompt: "Extract the core educational topic or question from this image to use as a YouTube search query. Be highly concise. Only output the search terms, nothing else. DO NOT use formatting." })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);
            
            searchInput.value = data.text.replace(/[\*\"]/g, '').trim();
            searchBtn.disabled = false; searchBtn.style.opacity = '1'; searchBtn.innerHTML = '🔍 AI Search & Rank';
        } catch (e) {
            searchInput.value = ""; statusText.innerHTML = "❌ Failed: " + e.message;
            searchBtn.disabled = false; searchBtn.style.opacity = '1'; searchBtn.innerHTML = '🔍 AI Search & Rank';
        }
    };

    // --- VIDEO PLAYER LOGIC (NATIVE 'MORE VIDEOS' ENABLED) ---
    let currentVideoUrl = "";
    let isLandscape = true;
    const playerOverlay = document.getElementById('ytPlayerOverlay');
    const ytIframe = document.getElementById('ytIframe');
    const orientationBtn = document.getElementById('ytOrientationBtn');

    window.openVideoPlayer = async function(videoId, url) {
        currentVideoUrl = url;
        
        // Removed rel=0 so YouTube's native 'More Videos' grid is fully populated.
        ytIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&playsinline=1`;
        
        playerOverlay.style.display = 'flex';
        document.body.style.overflow = 'hidden'; 
        
        try {
            if (playerOverlay.requestFullscreen) { await playerOverlay.requestFullscreen(); } 
            else if (playerOverlay.webkitRequestFullscreen) { await playerOverlay.webkitRequestFullscreen(); }
            
            if (screen.orientation && screen.orientation.lock) {
                await screen.orientation.lock('landscape');
                isLandscape = true; orientationBtn.innerText = '📱 Portrait Mode';
            }
        } catch (err) { console.log("Auto-landscape ignored by device: ", err); }
    };

    orientationBtn.addEventListener('click', async () => {
        try {
            if (isLandscape) {
                await screen.orientation.lock('portrait');
                orientationBtn.innerText = '🔲 Landscape Mode';
                isLandscape = false;
            } else {
                await screen.orientation.lock('landscape');
                orientationBtn.innerText = '📱 Portrait Mode';
                isLandscape = true;
            }
        } catch (err) { alert("Ensure auto-rotate is enabled and you are in full screen."); }
    });

    document.getElementById('ytCloseBtn').addEventListener('click', async () => {
        ytIframe.src = ""; playerOverlay.style.display = 'none'; document.body.style.overflow = ''; 
        try {
            if (screen.orientation && screen.orientation.unlock) { screen.orientation.unlock(); }
            if (document.fullscreenElement) { await document.exitFullscreen(); }
        } catch (e) { console.log("Cleanup error: ", e); }
    });

    document.getElementById('ytRedirectBtn').addEventListener('click', () => {
        if(currentVideoUrl) window.open(currentVideoUrl, '_blank');
        document.getElementById('ytCloseBtn').click(); 
    });
</script>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const restoreId = urlParams.get('restore');
        if (!restoreId) return;

        // Wait 800ms to guarantee the page, CSS, and animations are 100% finished loading
        setTimeout(() => {
            // Automatically hunt down the chat box or text area on the page
            let container = document.querySelector('.chat-scroll-area') || 
                            document.getElementById('chatHistory') || 
                            document.getElementById('searchChatHistory') ||
                            document.getElementById('qaAnswerBox') ||
                            document.getElementById('translatedText');
                            
            if (!container) return;

            const forceInjectData = (historyData) => {
                let item = historyData.find(i => i.id == restoreId);
                if (!item) return;

                // 🛑 SCENARIO 1: It's a Chat Interface (Search, Image)
                if (item.interactions && item.interactions.length > 0 && container.classList.contains('chat-scroll-area')) {
                    container.innerHTML = ''; // Wipe the empty screen
                    
                    item.interactions.forEach((inter, index) => {
                        let imgHtml = inter.image ? `<img src="${inter.image}" class="bubble-img" style="max-width:100%; border-radius:16px; margin-bottom:15px; border: 2px solid var(--border-light); box-shadow: var(--glass-shadow);">` : '';
                        let textId = `restored_text_${index}`;
                        
                        container.insertAdjacentHTML('beforeend', `
                            <div class="chat-msg chat-user" style="animation: slideInUp 0.5s ease-out;">
                                <div class="bubble" style="background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border-bottom-right-radius: 6px; box-shadow: 0 8px 25px var(--primary-glow);">
                                    ${imgHtml}
                                    <div>${inter.question.replace(/\n/g, '<br>')}</div>
                                </div>
                            </div>
                            <div class="chat-msg chat-ai" style="animation: bounceInBubble 0.6s ease-out;">
                                <div class="bubble" style="background: var(--bg-surface); border: 1px solid var(--border-light); border-bottom-left-radius: 6px; box-shadow: var(--glass-shadow); display: flex; flex-direction: column;">
                                    <div class="api-badge" style="display: inline-block; align-self: flex-start; background: var(--input-bg); border: 1px solid var(--primary); color: var(--primary); padding: 8px 16px; border-radius: 14px; font-size: 11px; font-weight: 900; margin-bottom: 20px; box-shadow: 0 4px 10px var(--primary-glow);">✨ BY ${inter.provider || "AI"}</div>
                                    <div id="${textId}" style="margin-top:0; width:100%; overflow-x:auto;">${inter.answer.replace(/\n/g, '<br>')}</div>
                                    
                                    <div class="action-buttons-container" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:25px; padding-top:15px; border-top:1px solid var(--border-light); width:100%;">
                                        <button class="btn green" style="background: linear-gradient(145deg, var(--bg-surface), var(--input-bg)); color: var(--primary); border: 1px solid var(--primary); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer; flex: 1; box-shadow: 0 4px 10px rgba(0,0,0,0.05);" onclick="speakAndHighlight('${textId}')">🔊 Listen</button>
                                        <button class="btn" style="background: linear-gradient(145deg, var(--bg-surface), var(--input-bg)); color: var(--primary); border: 1px solid var(--primary); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer; flex: 1; box-shadow: 0 4px 10px rgba(0,0,0,0.05);" onclick="copyToClipboard('${textId}')">📋 Copy</button>
                                    </div>
                                </div>
                            </div>
                        `);
                    });
                    
                    // Force the window to scroll to the newly injected text
                    setTimeout(() => { container.scrollTop = container.scrollHeight; }, 100);
                    if (typeof showToast === 'function') showToast("🔄 Search Restored Successfully!");
                } 
                
                // 🛑 SCENARIO 2: It's a Text Box Interface (Translator, Q&A)
                else {
                    let textId = `restored_text_box`;
                    let ansText = item.interactions ? item.interactions[0].answer : item.answer;
                    
                    container.innerHTML = `
                        <div class="api-badge" style="display: inline-block; background: var(--input-bg); border: 1px solid var(--primary); color: var(--primary); padding: 8px 16px; border-radius: 14px; font-size: 11px; font-weight: 900; margin-bottom: 20px;">✨ BY ${item.provider || "AI"}</div>
                        <div id="${textId}" style="margin-top:0;">${ansText.replace(/\n/g, '<br>')}</div>
                        <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:25px; padding-top:15px; border-top:1px solid var(--border-light);">
                            <button class="btn green" style="background: linear-gradient(145deg, var(--bg-surface), var(--input-bg)); color: var(--primary); border: 1px solid var(--primary); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 800; flex: 1;" onclick="speakAndHighlight('${textId}')">🔊 Listen</button>
                            <button class="btn" style="background: linear-gradient(145deg, var(--bg-surface), var(--input-bg)); color: var(--primary); border: 1px solid var(--primary); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 800; flex: 1;" onclick="copyToClipboard('${textId}')">📋 Copy</button>
                        </div>
                    `;
                    // Refill the input text box too
                    if (document.getElementById('inputText')) document.getElementById('inputText').value = item.question || "";
                    if (typeof showToast === 'function') showToast("🔄 Document Restored Successfully!");
                }

                // Safely render any Math/Physics equations (LaTeX)
                if (window.MathJax) {
                    MathJax.typesetPromise([container]).catch(e => console.log(e));
                }
            };

            // Safely fetch from your LocalForage database, fallback to LocalStorage
            if (typeof localforage !== 'undefined') {
                localforage.getItem('aiHistory').then(data => {
                    if (data && data.length > 0) forceInjectData(data);
                    else forceInjectData(JSON.parse(localStorage.getItem('aiHistory') || '[]'));
                }).catch(() => forceInjectData(JSON.parse(localStorage.getItem('aiHistory') || '[]')));
            } else {
                forceInjectData(JSON.parse(localStorage.getItem('aiHistory') || '[]'));
            }
            
        }, 800); // 👈 THIS 800ms DELAY IS THE MAGIC FIX. IT WAITS FOR EVERYTHING TO BE READY.
    });
</script>
</body>
</html>
