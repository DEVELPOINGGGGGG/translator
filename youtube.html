<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Suite - YouTube Learning</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Minimal specific styles to ensure the player overlay looks perfect */
        #ytPlayerOverlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px);
            z-index: 99999; display: none; flex-direction: column;
        }
        .yt-top-controls {
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px; background: #000; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .video-container {
            flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .video-container iframe {
            width: 100%; max-width: 1200px; height: 100%; max-height: 700px; border-radius: 12px; border: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="topbar">
  <div class="menuBtn" onclick="toggleSidebar()">☰</div>
  <div class="appTitle">AI Pro Suite</div>
</div>

<div class="sidebar" id="sidebar">
  <button onclick="window.location.href='index.html'">🏠 Dashboard</button>
  <button onclick="window.location.href='maths.html'">🧮 Math Solver</button>
  <button onclick="window.location.href='search.html'">🔎 Deep Search</button>
  <button style="border-left: 4px solid #ef4444; color: #ffb4b4; background: rgba(239,68,68,0.1);">🎬 YouTube Learning</button>
  <button onclick="window.location.href='translator.html'">🎙️ Text Translator</button>
  <button onclick="window.location.href='image.html'">🖼️ Image Translator</button>
  <button onclick="window.location.href='qa.html'">📄 Document Q&A</button>
  <button onclick="window.location.href='create.html'">✨ Image Creator</button>
  <button onclick="window.location.href='history.html'">🕒 History</button>
</div>

<div class="page active" style="top: 85px; display: block; position: relative;">
    <div class="card" style="max-width: 700px; margin: 0 auto; text-align: center;">
        <h2 class="cardTitle" style="color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.4);">YouTube Learning Engine</h2>
        <p class="cardSub">Type a topic. The AI will optimize your request and fetch the best educational videos.</p>
        
        <input type="text" id="ytSearchInput" class="standard" placeholder="Enter a topic (e.g., Quantum Physics, Calculus...)">
        <button id="ytSearchBtn" class="btn red" style="margin-top: 10px;">🔍 Find Videos</button>
        
        <div id="ytStatus" style="margin-top: 15px; font-size: 14px; font-weight: 600; color: #94a3b8;"></div>
    </div>

    <div id="ytResults" class="dashboard-grid" style="margin-top: 30px;">
        </div>
</div>

<div id="ytPlayerOverlay">
    <div class="yt-top-controls">
        <button id="ytRedirectBtn" class="btn red" style="width: auto; margin: 0; padding: 12px 25px; border-radius: 30px;">🚀 Open in YouTube App</button>
        <button id="ytCloseBtn" class="closeBtn" style="position: static; margin: 0;">✕</button>
    </div>
    <div class="video-container">
        <iframe id="ytIframe" allow="autoplay; fullscreen; encrypted-media"></iframe>
    </div>
</div>

<script>
    // Sidebar logic
    function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const active = !sidebar.classList.contains("active");
        sidebar.classList.toggle("active", active);
        overlay.classList.toggle("active", active);
    }
    document.getElementById("overlay").onclick = toggleSidebar;

    // Elements
    const searchInput = document.getElementById('ytSearchInput');
    const searchBtn = document.getElementById('ytSearchBtn');
    const statusText = document.getElementById('ytStatus');
    const resultsContainer = document.getElementById('ytResults');
    
    // Player Elements
    const playerOverlay = document.getElementById('ytPlayerOverlay');
    const ytIframe = document.getElementById('ytIframe');
    const closeBtn = document.getElementById('ytCloseBtn');
    const redirectBtn = document.getElementById('ytRedirectBtn');
    let currentVideoUrl = "";

    // Allow Enter key to trigger search
    searchInput.addEventListener("keypress", (e) => {
        if(e.key === "Enter") searchBtn.click();
    });

    // Main Search Logic
    searchBtn.addEventListener('click', async () => {
        const rawTopic = searchInput.value.trim();
        if (!rawTopic) return;

        resultsContainer.innerHTML = "";
        statusText.innerHTML = `<span class="spinner" style="border-top-color: #ef4444;"></span> AI is optimizing your request...`;

        try {
            // STEP 1: Send to AI to finalize/optimize the query
            const aiResponse = await fetch('/api/gemini-text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    systemPrompt: "You are an expert at creating YouTube search queries. Take the user's input and convert it into a highly optimized, concise search string specifically for finding the best educational and tutorial videos. Return STRICTLY ONLY the optimized search string. No quotes, no explanations.",
                    userPrompt: rawTopic
                })
            });
            
            const aiData = await aiResponse.json();
            if (!aiResponse.ok) throw new Error(aiData.error || "AI failed to optimize the query");
            
            const optimizedQuery = aiData.text.replace(/["*]/g, '').trim();
            statusText.innerHTML = `<span class="spinner" style="border-top-color: #ef4444;"></span> Searching YouTube for: <span style="color: #fff;">"${optimizedQuery}"</span>`;

            // STEP 2: Send optimized query to yt-search endpoint
            const ytResponse = await fetch('/api/youtube-search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic: optimizedQuery })
            });

            const ytData = await ytResponse.json();
            if (!ytResponse.ok) throw new Error(ytData.error || "YouTube search failed");

            const videos = ytData.results || [];
            
            if (videos.length === 0) {
                statusText.innerHTML = `⚠️ No videos found for "${optimizedQuery}"`;
                return;
            }

            statusText.innerHTML = `✅ Displaying top results for: <span style="color: #fff;">"${optimizedQuery}"</span>`;

            // STEP 3: Render Thumbnails
            resultsContainer.innerHTML = videos.map(vid => `
                <div class="card" style="padding: 15px; display: flex; flex-direction: column; gap: 12px;" onclick="openVideoPlayer('${vid.videoId}', '${vid.url}')">
                    <div style="position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);">
                        <img src="${vid.thumbnail}" style="width: 100%; height: 100%; object-fit: cover;">
                        <div style="position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: white; padding: 2px 6px; font-size: 11px; font-weight: bold; border-radius: 4px;">
                            ${vid.timestamp || 'Video'}
                        </div>
                    </div>
                    <div style="font-weight: 800; font-size: 14px; line-height: 1.4; color: #f8fafc; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                        ${vid.title}
                    </div>
                    <div style="font-size: 12px; color: var(--muted); font-weight: 600;">
                        👤 ${vid.author?.name || 'YouTube Creator'}
                    </div>
                </div>
            `).join('');

        } catch (error) {
            statusText.innerHTML = `❌ Error: ${error.message}`;
        }
    });

    // Player Logic
    window.openVideoPlayer = function(videoId, url) {
        currentVideoUrl = url;
        ytIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
        playerOverlay.style.display = 'flex';
        document.body.style.overflow = 'hidden'; // Stop background scrolling
    };

    closeBtn.addEventListener('click', () => {
        ytIframe.src = ""; // Instantly cuts off the audio/video
        playerOverlay.style.display = 'none';
        document.body.style.overflow = ''; // Restore background scrolling
    });

    redirectBtn.addEventListener('click', () => {
        if(currentVideoUrl) window.open(currentVideoUrl, '_blank');
        closeBtn.click(); // Close the overlay while they redirect
    });
</script>
</body>
</html>
