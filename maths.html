<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Suite - Math Solver</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
      MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
    </script>
    <script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <link rel="stylesheet" href="style.css">
    
    <style>
        mjx-container { padding: 5px 0 !important; margin: 0 !important; }
        
        /* Specific Math Styles for Generated Images */
        .math-diagram-img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 15px;
            border: 2px solid #4f46e5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: block;
        }
        
        .loading-diagram {
            font-size: 13px;
            color: #94a3b8;
            font-style: italic;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .loader-spinner {
            width: 18px; height: 18px;
            border: 2px solid #4f46e5;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Base overrides to ensure perfect layout */
        body, html { height: 100%; margin: 0; display: flex; flex-direction: column; background-color: var(--bg-base, #0f172a); }
        
        .math-header {
            padding: 15px 20px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            display: flex; align-items: center; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }
        .math-header h1 { font-size: 1.2rem; margin: 0; font-weight: 600; color: #fff; }
        .back-btn { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; padding: 5px; }

        .chat-scroll-area { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        .msg-bubble { padding: 15px; border-radius: 14px; max-width: 85%; line-height: 1.6; font-size: 15px; }
        .msg-user { background: var(--accent, #4f46e5); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-ai { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        .input-area {
            padding: 15px 20px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 10px; align-items: center;
        }
        
        .input-area input { flex-grow: 1; padding: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: #fff; font-size: 15px; outline: none; }
        .input-area input:focus { border-color: #4f46e5; }
        
        .btn-send { padding: 0 25px; border-radius: 10px; background: #4f46e5; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-send:hover { background: #4338ca; }
        
        .camera-btn { background: rgba(255,255,255,0.1); border: none; border-radius: 10px; padding: 0 15px; font-size: 1.2rem; cursor: pointer; color: white; transition: 0.2s; }
        
        /* Camera Modal Styles */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal video { max-width: 90%; max-height: 70vh; background: #000; border-radius: 12px; }
        .modal-controls { display: flex; gap: 15px; margin-top: 20px; }
        .modal-controls button { padding: 12px 25px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .btn-capture { background: #22c55e; } .btn-switch { background: #3b82f6; } .btn-close { background: #ef4444; }
    </style>
</head>
<body>

    <header class="math-header">
        <button class="back-btn" onclick="window.history.back()">⬅</button>
        <h1>📐 AI Math & Visual Solver</h1>
    </header>

    <div class="chat-scroll-area" id="mathChatHistory">
        <div class="msg-bubble msg-ai">
            Welcome! Ask any math or geometry question. If you ask about an <strong>Area, Shape, or Graph</strong>, I will automatically solve it and generate an image diagram for you!
        </div>
    </div>

    <div class="input-area">
        <button class="camera-btn" onclick="document.getElementById('cameraModal').classList.add('active'); startVideoStream();">📷</button>
        
        <div id="mathPreviewChip" style="display:none; width: 45px; height: 45px; border-radius: 8px; background-size: cover; background-position: center; border: 2px solid #4f46e5; cursor: pointer;" onclick="clearMathImage()" title="Click to remove"></div>
        
        <input type="text" id="mathInput" placeholder="e.g. Find the area of a circle with radius 5..." onkeypress="if(event.key === 'Enter') executeSmartMathFlow()">
        <button class="btn-send" onclick="executeSmartMathFlow()">Solve</button>
    </div>

    <!-- Camera Modal -->
    <div id="cameraModal" class="modal">
        <video id="cameraVideo" autoplay playsinline></video>
        <canvas id="captureCanvas" style="display:none;"></canvas>
        <div class="modal-controls">
            <button class="btn-close" onclick="closeCamera()">Close</button>
            <button class="btn-switch" onclick="switchCamera()">Switch</button>
            <button class="btn-capture" onclick="captureImage()">Capture</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CAMERA LOGIC (Kept from your original snippet)
        // ==========================================
        let videoStream = null;
        let usingFrontCamera = false;
        let currentMathImage = null;

        function closeCamera() { 
            document.getElementById("cameraModal").classList.remove("active"); 
            if (videoStream) videoStream.getTracks().forEach(t => t.stop()); 
        }
        
        async function startVideoStream() {
            if (videoStream) videoStream.getTracks().forEach(t => t.stop());
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: usingFrontCamera ? "user" : "environment" } });
                document.getElementById("cameraVideo").srcObject = videoStream;
            } catch (err) { alert("Camera Error: " + err.message); closeCamera(); }
        }

        function switchCamera() { usingFrontCamera = !usingFrontCamera; startVideoStream(); }

        function captureImage() {
            const video = document.getElementById("cameraVideo");
            const canvas = document.getElementById("captureCanvas");
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
            currentMathImage = canvas.toDataURL("image/jpeg", 0.6);
            
            const chip = document.getElementById("mathPreviewChip");
            chip.style.backgroundImage = `url(${currentMathImage})`;
            chip.style.display = "block";
            closeCamera();
        }

        function clearMathImage() { 
            currentMathImage = null; 
            document.getElementById("mathPreviewChip").style.display = "none"; 
        }


        // ==========================================
        // 2. 🚀 SMART MATH FLOW WITH IMAGE GENERATOR 🚀
        // ==========================================
        async function executeSmartMathFlow() {
            const inputEl = document.getElementById("mathInput");
            const text = inputEl.value.trim();
            const imagePayload = currentMathImage;
            
            if (!text && !imagePayload) return;

            // Step A: Add user message to UI
            addMsgToUI(text || "[Attached Image]", "msg-user", imagePayload);
            inputEl.value = "";
            clearMathImage();

            // Step B: Show Loading
            const loadingId = "loader-" + Date.now();
            addMsgToUI("Solving problem...", "msg-ai", null, loadingId);

            // Step C: The Magic System Prompt
            // This forces Gemini to write a tag telling the frontend to generate a picture.
            const sysPrompt = `
                You are an advanced AI Math Tutor. Provide step-by-step mathematical solutions.
                Format math formulas using standard MathJax: inline with $...$ and blocks with $$...$$.
                
                🔥 CRITICAL INSTRUCTION FOR IMAGES 🔥
                If the user's question involves AREA, PERIMETER, GEOMETRY, SHAPES, or GRAPHS, you MUST generate a prompt for an AI image generator to draw it.
                Append a tag at the very end of your response exactly like this:
                [DRAW: <detailed description of the shape/concept on a clean white background>]
                
                Example: [DRAW: A clean minimalist math diagram of a right angled triangle with height 4 and base 3 on a white background, textbook style]
                If no visual is needed, do NOT include the [DRAW] tag.
            `;

            try {
                // Step D: Send request to server.js (Gemini Text or Vision)
                let endpoint = imagePayload ? "/api/gemini-vision" : "/api/gemini-text";
                let bodyData = imagePayload 
                    ? { userPrompt: text, imageBase64: imagePayload, providerOverride: 'gemini' }
                    : { userPrompt: text, systemPrompt: sysPrompt, providerOverride: 'gemini' };

                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(bodyData)
                });

                const data = await response.json();
                document.getElementById(loadingId)?.remove(); // remove loader

                if (data.error) throw new Error(data.error);

                let aiText = data.text;
                let drawPrompt = null;

                // Step E: Detect if Gemini requested an image generation
                const drawMatch = aiText.match(/\[DRAW:\s*(.*?)\]/i);
                if (drawMatch) {
                    drawPrompt = drawMatch[1].trim(); 
                    aiText = aiText.replace(drawMatch[0], ""); // Remove the tag from the text the user sees
                }

                // Step F: Render the text & MathJax
                const msgBoxId = "msg-" + Date.now();
                addMsgToUI(aiText, "msg-ai", null, msgBoxId);

                if (window.MathJax) {
                    MathJax.typesetPromise([document.getElementById(msgBoxId)]).catch(err => console.log("MathJax Error:", err));
                }

                // Step G: If geometry was detected, trigger Cloudflare Image API
                if (drawPrompt) {
                    await fetchAndRenderImage(drawPrompt, msgBoxId);
                }

            } catch (err) {
                document.getElementById(loadingId)?.remove();
                addMsgToUI("Error: " + err.message, "msg-ai");
            }
        }

        // ==========================================
        // 3. IMAGE GENERATOR FETCHER
        // ==========================================
        async function fetchAndRenderImage(prompt, parentId) {
            const parentEl = document.getElementById(parentId);
            if (!parentEl) return;

            // Add an inner loader just for the image
            const imgLoader = document.createElement("div");
            imgLoader.className = "loading-diagram";
            imgLoader.innerHTML = `<div class="loader-spinner"></div> Drawing geometrical diagram...`;
            parentEl.appendChild(imgLoader);
            scrollToBottom();

            try {
                // Hits your existing Cloudflare Flux-1 Image endpoint from server.js!
                const res = await fetch("/api/cloudflare-image", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt + ", math textbook diagram style, sharp lines" })
                });

                const data = await res.json();
                imgLoader.remove();

                if (data.error) {
                    console.error("Image Gen Error:", data.error);
                    return; 
                }

                // Append the generated image to the chat bubble!
                if (data.image) {
                    const img = document.createElement("img");
                    img.src = data.image;
                    img.className = "math-diagram-img";
                    parentEl.appendChild(img);
                    scrollToBottom();
                }

            } catch (err) {
                imgLoader.remove();
                console.error("Failed to generate image", err);
            }
        }

        // ==========================================
        // 4. UI HELPERS
        // ==========================================
        function addMsgToUI(text, className, imgUrl = null, id = null) {
            const container = document.getElementById("mathChatHistory");
            const div = document.createElement("div");
            div.className = "msg-bubble " + className;
            if (id) div.id = id;

            let content = "";
            if (imgUrl) content += `<img src="${imgUrl}" style="max-width:200px; border-radius:8px; display:block; margin-bottom:10px;">`;
            
            // Basic markdown/newline formatting
            let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, "<br>");
            content += formattedText;

            div.innerHTML = content;
            container.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById("mathChatHistory");
            container.scrollTop = container.scrollHeight;
        }

    </script>
    
    <!-- Load your global suite scripts silently in the background -->
    <script src="ui-controls.js" defer></script>
    <script src="main.js" defer></script>
</body>
</html>
