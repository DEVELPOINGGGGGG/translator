<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Suite - Math Solver</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
      MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
    </script>
    <script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <link rel="stylesheet" href="style.css">
    
    <style>
        mjx-container { padding: 5px 0 !important; margin: 0 !important; }
        .typing-indicator { display: flex; gap: 5px; padding: 10px; }
        .typing-indicator span { width: 8px; height: 8px; background: #c084fc; border-radius: 50%; animation: pulse 1s infinite alternate; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { from { opacity: 0.3; transform: scale(0.8); } to { opacity: 1; transform: scale(1.2); } }
        
        .handwritten-img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-top: 10px;
            border: 2px solid rgba(255,255,255,0.1);
        }

        /* HARD VISUAL INDICATORS FOR IMAGE STATUS */
        .img-status-msg {
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            align-self: center;
            width: 90%;
            text-align: center;
        }
        .img-status-msg.loading {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .img-status-msg.error {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="topbar">
  <div class="menuBtn" onclick="toggleSidebar()">☰</div>
  <div class="appTitle">AI Pro Suite</div>
</div>
<div class="apiTracker">
    <div>⏱️ Reset: <span id="apiTimer" class="api-val timer">60s</span></div>
    <div>🖼️ Vis: <span id="apiVision" class="api-val vision">0</span>/20</div>
    <div>📝 Txt: <span id="apiText" class="api-val text">0</span>/20</div>
</div>

<div class="sidebar" id="sidebar">
  <button onclick="window.location.href='index.html'">🏠 Dashboard</button>
  <button onclick="window.location.href='maths.html'" style="border-left: 4px solid #3b82f6; color: #60a5fa; background: #111827;">🧮 Math Solver</button>
  <button onclick="window.location.href='search.html'">🔎 Deep Search</button>
  <button onclick="window.location.href='translator.html'">🎙️ Text Translator</button>
  <button onclick="window.location.href='image.html'">🖼️ Image Translator</button>
  <button onclick="window.location.href='create.html'">🎨 Image Creator</button>
  <button onclick="window.location.href='qa.html'">📚 Document Q&A</button>
  <button onclick="window.location.href='history.html'">🕒 History & Downloads</button>
</div>

<div class="page active chat-page-layout" id="mathsPage">
  <div class="chat-scroll-area" id="mathScrollArea">
    <div class="card" style="background:linear-gradient(135deg,#3b82f6,#2563eb); border:none; text-align:center; margin-bottom: 20px; flex-shrink: 0;">
        <h1 style="font-size: 24px;">🧮 Math Solver</h1>
        <p style="font-size: 14px; opacity: 0.9;">Waterfall Engine (Gemini ➔ Cloudflare ➔ Groq)</p>
    </div>
    
    <div id="mathChatHistory"></div>
  </div>
  <div class="chat-input-area">
    <div class="image-preview-chip" id="mathPreviewChip">
        <div class="image-preview-close" id="clearMathImgBtn" onclick="clearMathImage()" style="position:absolute; top:-5px; right:-5px; background:red; color:white; border-radius:50%; width:20px; height:20px; display:flex; justify-content:center; align-items:center; font-size:12px; cursor:pointer;">✕</div>
    </div>
    <div class="chat-input-wrapper">
        <button class="chat-action-btn" id="openMathCameraBtn" onclick="openCamera()" title="Take Photo">➕</button>
        <textarea id="mathInstructionInput" placeholder="Ask math question or attach image... (Press Enter)"></textarea>
        <button class="chat-action-btn send" id="sendMathBtn" onclick="executeMathFlow()">↑</button>
    </div>
  </div>
</div>

<div id="cameraModal" class="cameraModal">
    <video id="cameraVideo" autoplay playsinline></video>
    <div class="camera-top-bar">
        <button id="closeCameraBtn" class="cam-icon-btn" onclick="closeCamera()">❌</button>
    </div>
    <div class="cameraControls">
        <button id="toggleFlashBtn" class="cam-icon-btn">🔦</button>
        <div id="capturePhotoBtn" class="cameraCircle" onclick="captureImage()"></div>
        <button id="switchCameraBtn" class="cam-icon-btn" onclick="switchCamera()">🔄</button>
    </div>
    <canvas id="captureCanvas" style="display:none;"></canvas>
</div>

<script>
    let currentMathImage = null;
    let mathConversationHistory = [];
    let videoStream = null;
    let usingFrontCamera = false;

    // Handle Enter Key
    document.getElementById("mathInstructionInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); executeMathFlow(); }
    });

    async function executeMathFlow() {
        const inputEl = document.getElementById("mathInstructionInput");
        const userText = inputEl.value.trim();
        if (!userText && !currentMathImage) return;

        appendMessage('user', userText || "Solve this image.", currentMathImage);
        inputEl.value = "";
        mathConversationHistory.push(`User: ${userText}`);

        // THE EXAMINER PROMPT
        const tutorPrompt = `You are a direct math tutor. STRICT RULES:
1. NO GREETINGS OR INTROS. Start immediately.
2. For the question:
   - First line: "प्रश्न: [Write the exact question here]"
   - Middle: Step-by-step solution using $ for math notation.
   - Last: "💡 Explanation:" followed by 4-8 lines for hard concepts, or 2-4 lines for easy concepts.
3. If multiple questions, format them as Q1, Q2 sequentially following the same layout.
4. Respond in the user's language.
Task: ${userText}`;

        showTyping();

        let endpoint = currentMathImage ? "/api/gemini-vision" : "/api/gemini-text";
        let payload = { userPrompt: tutorPrompt };
        if (currentMathImage) payload.imageBase64 = currentMathImage;

        try {
            const res = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            removeTyping();

            if (data.error) throw new Error(data.error);

            // 1. Output the Text Solution
            appendMessage('ai', data.text);
            mathConversationHistory.push(`AI: ${data.text}`);
            clearMathImage();

            // 2. Immediately Generate the Handwritten Image
            generateMathImage(data.text);

        } catch (err) {
            removeTyping();
            appendMessage('ai', "❌ Math Solver Error: " + err.message);
        }
    }

    // --- BULLETPROOF IMAGE GENERATOR ---
    async function generateMathImage(aiResponseText) {
        const historyDiv = document.getElementById("mathChatHistory");
        const loadingId = "load-" + Date.now();
        
        try {
            // 1. Show loud visual loading indicator
            const loadingDiv = document.createElement("div");
            loadingDiv.id = loadingId;
            loadingDiv.className = "img-status-msg loading";
            loadingDiv.innerText = "⏳ Requesting Cloudflare to draw handwritten notes...";
            historyDiv.appendChild(loadingDiv);
            document.getElementById("mathScrollArea").scrollTop = 99999;

            // 2. EXTREME SANITIZATION: Strip all weird characters that break JSON
            let mathTextOnly = aiResponseText.split("💡")[0].trim();
            // Remove double quotes, backslashes, and newlines that crash JSON.stringify
            mathTextOnly = mathTextOnly.replace(/["\\\n\r]/g, ' '); 
            mathTextOnly = mathTextOnly.substring(0, 150); // Keep it short for the image AI

            const cfPrompt = `A high-quality photo of lined notebook paper. Written neatly on the lines in blue pen: ${mathTextOnly}.`;

            const imgRes = await fetch("/api/cloudflare-image", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: cfPrompt })
            });

            const imgData = await imgRes.json();
            
            // Remove the loading indicator
            document.getElementById(loadingId)?.remove();

            if (!imgRes.ok) throw new Error(imgData.error || "Cloudflare rejected the request.");
            if (!imgData.image && !imgData.base64) throw new Error("Cloudflare returned an empty image payload.");

            const imgUrl = imgData.image || `data:image/png;base64,${imgData.base64}`;
            appendMessage('ai', "📝 Handwritten preview:", imgUrl, true);
            
        } catch (e) {
            // Ensure loading indicator is removed if it crashed hard
            document.getElementById(loadingId)?.remove();
            
            // Log to console for Render logs
            console.error("🖼️ Image Generation Error:", e);
            
            // Add loud red error box to UI
            const errDiv = document.createElement("div");
            errDiv.className = "img-status-msg error";
            errDiv.innerText = "⚠️ Image Failed: " + e.message;
            historyDiv.appendChild(errDiv);
            document.getElementById("mathScrollArea").scrollTop = 99999;
        }
    }

    // --- UI HELPERS ---
    function appendMessage(role, text, imageUrl = null, isGeneratedImage = false) {
        const historyDiv = document.getElementById("mathChatHistory");
        const msgDiv = document.createElement("div");
        msgDiv.className = `chat-msg ${role === 'user' ? 'chat-user' : 'chat-ai'}`;
        
        let contentHtml = `<div class="bubble">`;
        if (imageUrl) {
            let imgClass = isGeneratedImage ? "handwritten-img" : "bubble-img";
            contentHtml += `<img src="${imageUrl}" class="${imgClass}" style="${!isGeneratedImage ? 'max-width: 200px; border-radius: 10px; margin-bottom: 10px;' : ''}"><br>`;
        }
        
        let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
        contentHtml += `<div>${formattedText}</div></div>`;
        msgDiv.innerHTML = contentHtml;
        historyDiv.appendChild(msgDiv);
        
        if (window.MathJax) MathJax.typesetPromise([msgDiv]);
        document.getElementById("mathScrollArea").scrollTop = 99999;
    }

    function showTyping() {
        const div = document.createElement("div");
        div.id = "mathTyping";
        div.className = "chat-msg chat-ai";
        div.innerHTML = `<div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
        document.getElementById("mathChatHistory").appendChild(div);
        document.getElementById("mathScrollArea").scrollTop = 99999;
    }

    function removeTyping() { document.getElementById("mathTyping")?.remove(); }
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }

    // --- CAMERA LOGIC ---
    function openCamera() { document.getElementById("cameraModal").classList.add("active"); startVideoStream(); }
    function closeCamera() { document.getElementById("cameraModal").classList.remove("active"); if (videoStream) videoStream.getTracks().forEach(t => t.stop()); }
    
    async function startVideoStream() {
        if (videoStream) videoStream.getTracks().forEach(t => t.stop());
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: usingFrontCamera ? "user" : "environment" } });
            document.getElementById("cameraVideo").srcObject = videoStream;
        } catch (err) { alert("Camera Error"); closeCamera(); }
    }

    function switchCamera() { usingFrontCamera = !usingFrontCamera; startVideoStream(); }

    function captureImage() {
        const video = document.getElementById("cameraVideo");
        const canvas = document.getElementById("captureCanvas");
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
        currentMathImage = canvas.toDataURL("image/jpeg", 0.6);
        const chip = document.getElementById("mathPreviewChip");
        chip.style.backgroundImage = `url(${currentMathImage})`;
        chip.style.display = "block";
        closeCamera();
    }

    function clearMathImage() { currentMathImage = null; document.getElementById("mathPreviewChip").style.display = "none"; }
</script>

<script src="ui-controls.js" defer></script>
<script src="main.js" defer></script>
</body>
</html>
