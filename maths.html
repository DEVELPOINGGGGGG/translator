<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Solver - AI Pro Suite</title>
    
    <!-- Premium Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="menuBtn" onclick="window.location.href='index.html'">🔙</div>
  <div class="appTitle">Math Solver Engine</div>
</div>

<div class="page active" style="top: 70px; max-width: 800px; margin: 0 auto;">
  
  <div class="chat-container" id="chatContainer">
      <div class="message ai">
          <strong>🧮 Math Engine Ready</strong><br>
          Type your equation or upload a picture of a math problem. I will break it down step-by-step with clean fractions and 'X' for multiplication.
      </div>
  </div>

  <!-- Math Input Area with Image Upload -->
  <div class="input-area" style="flex-direction: column; align-items: stretch; gap: 10px; background: var(--bg-card);">
      
      <!-- Image Preview Box (Hidden by default) -->
      <div id="imagePreviewContainer" style="display: none; position: relative; width: max-content;">
          <img id="mathPreviewImg" src="" style="max-height: 80px; border-radius: 8px; border: 1px solid var(--border);">
          <button onclick="clearMathImage()" style="position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer; font-weight: bold;">X</button>
      </div>

      <div style="display: flex; gap: 10px; width: 100%;">
          <!-- Camera/Image Button -->
          <label for="mathImageInput" style="cursor: pointer; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 12px; border-radius: 12px; display: flex; align-items: center; justify-content: center; transition: 0.2s;" title="Upload Math Image">
              📷
          </label>
          <input type="file" id="mathImageInput" accept="image/*" style="display: none;" onchange="loadMathImage(event)">
          
          <!-- Text Input -->
          <textarea id="mathPromptInput" placeholder="Type a formula, equation, or ask a math question..." rows="1" style="flex: 1; padding-top: 12px;"></textarea>
          
          <!-- Solve Button -->
          <button class="actionBtnSmall blue" onclick="triggerMathSolve()" style="padding: 0 20px;">Solve</button>
      </div>
  </div>
</div>

<!-- LINK TO YOUR MAIN.JS WHERE THE REAL MAGIC HAPPENS -->
<script src="main.js"></script>

<script>
    let currentMathImageBase64 = null;

    // Handle Image Selection and Base64 Conversion
    function loadMathImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            currentMathImageBase64 = e.target.result;
            document.getElementById('mathPreviewImg').src = currentMathImageBase64;
            document.getElementById('imagePreviewContainer').style.display = 'block';
        };
        reader.readAsDataURL(file);
    }

    // Clear the uploaded image
    function clearMathImage() {
        currentMathImageBase64 = null;
        document.getElementById('mathImageInput').value = '';
        document.getElementById('imagePreviewContainer').style.display = 'none';
    }

    // Execute the solve function from main.js
    function triggerMathSolve() {
        const textPrompt = document.getElementById('mathPromptInput').value.trim();
        
        // Prevent empty submits
        if (!textPrompt && !currentMathImageBase64) {
            alert("Bro, you need to type an equation or upload a picture first!");
            return;
        }
        
        // Call the heavy-lifting function from main.js
        handleMathSolve(textPrompt, currentMathImageBase64);
        
        // Clear the inputs after sending
        document.getElementById('mathPromptInput').value = '';
        clearMathImage();
    }
</script>

</body>
</html>
