<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Suite - Math Solver</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script>
      MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
    </script>
    <script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <link rel="stylesheet" href="style.css">
    
    <style>
        mjx-container { padding: 5px 0 !important; margin: 0 !important; }
        .typing-indicator { display: flex; gap: 5px; padding: 10px; }
        .typing-indicator span { width: 8px; height: 8px; background: #c084fc; border-radius: 50%; animation: pulse 1s infinite alternate; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { from { opacity: 0.3; transform: scale(0.8); } to { opacity: 1; transform: scale(1.2); } }
        
        /* 📝 THE PURE CSS DIGITAL PAPER ENGINE */
        .digital-paper-container {
            width: 100%;
            margin-top: 5px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 10px;
            background-color: #fdfbf7; 
            background-image: repeating-linear-gradient(transparent, transparent 29px, #93c5fd 29px, #93c5fd 30px);
            line-height: 30px;
            padding: 30px 20px 30px 65px;
            position: relative;
            font-family: 'Kalam', cursive, sans-serif; 
            font-size: 18px;
            color: #1e3a8a; 
            overflow-x: auto;
        }
        .digital-paper-container::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 45px;
            width: 2px;
            background: #fca5a5; 
        }

        /* 🔍 DYNAMIC MATH IMAGE ZOOM VIEWER GUI */
        .zoom-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 1000000; justify-content: center; align-items: center; backdrop-filter: blur(10px); user-select: none; }
        .zoom-overlay.active { display: flex; }
        .zoom-container { position: relative; max-width: 90%; max-height: 80%; display: flex; justify-content: center; align-items: center; overflow: auto; padding: 20px; }
        .zoom-img-wrapper { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); transition: transform 0.1s ease-out; transform-origin: center center; display: inline-block; }
        .zoom-overlay img { max-width: 100%; max-height: 70vh; display: block; pointer-events: none; }
        .zoom-controls { position: absolute; bottom: -60px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; background: rgba(255, 255, 255, 0.15); padding: 8px 18px; border-radius: 30px; backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .zoom-btn { background: white; color: #0f172a; border: none; width: 36px; height: 36px; border-radius: 50%; font-weight: bold; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .zoom-btn:hover { transform: scale(1.1); background: #f1f5f9; }
        .zoom-top-actions { position: absolute; top: 20px; right: 20px; display: flex; gap: 15px; z-index: 1000002; }
        .action-round-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 20px; transition: 0.2s; backdrop-filter: blur(5px); }
        .action-round-btn:hover { background: white; color: #0f172a; transform: scale(1.05); }
    </style>
</head>
<body>

<div class="page active chat-page-layout" id="mathsPage">
  <div class="chat-scroll-area" id="mathScrollArea">

    <button onclick="openWhatsAppModal()" style="background: #25D366; color: white; padding: 10px 15px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);">

        Share Full Chat via WhatsApp
    </button>

    <div id="mathChatHistory"></div>
  </div>
  <div class="chat-input-area">
    <div class="image-preview-chip" id="mathPreviewChip">
        <div class="image-preview-close" id="clearMathImgBtn" onclick="clearMathImage()" style="position:absolute; top:-5px; right:-5px; background:red; color:white; border-radius:50%; width:20px; height:20px; display:flex; justify-content:center; align-items:center; font-size:12px; cursor:pointer;">✕</div>
    </div>

        <button class="chat-action-btn" id="openMathCameraBtn" onclick="openCamera()" title="Take Photo">➕</button>

    <div class="card" style="background:var(--bg-surface); padding:20px; border-radius:16px; border:1px solid rgba(255,255,255,0.1); width:90%; max-width:600px; max-height:80vh; overflow-y:auto;" onclick="event.stopPropagation()">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 id="histTitle" style="color:var(--primary);">History</h3>

        <div id="histAnswer" style="background:rgba(59,130,246,0.1); padding:15px; border-radius:8px; font-size:14px; color:var(--text-main, #f8fafc); border:1px solid rgba(59,130,246,0.3);"></div>
    </div>
</div>

<script>
    /* =======================================================
       📊 0. API TRACKER SYSTEM (FIXED DOMContentLoaded)
    ======================================================= */
    let visionReqs = parseInt(localStorage.getItem('visionReqs')) || 0;
    let textReqs = parseInt(localStorage.getItem('textReqs')) || 0;

    function updateTrackerUI() {
        let tot = document.getElementById('apiTotal'); if(tot) tot.innerText = visionReqs + textReqs;
        let vis = document.getElementById('apiVision'); if(vis) vis.innerText = visionReqs;
        let txt = document.getElementById('apiText'); if(txt) txt.innerText = textReqs;
    }

    function track(type) { 
        if(type === 'v'){ visionReqs++; localStorage.setItem('visionReqs', visionReqs); } 
        else { textReqs++; localStorage.setItem('textReqs', textReqs); } 
        updateTrackerUI();
    }

    function updatePTTimer() {
        try {
            let d = new Date();
            let utc = d.getTime() + (d.getTimezoneOffset() * 60000);
            let pt = new Date(utc + (3600000 * -7)); 
            let h = 23 - pt.getHours();
            let m = 59 - pt.getMinutes();
            let s = 59 - pt.getSeconds();
            let t = document.getElementById('apiTimer');
            if(t) t.innerText = `${h.toString().padStart(2,'0')}h ${m.toString().padStart(2,'0')}m ${s.toString().padStart(2,'0')}s`;
        } catch(e) {}
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateTrackerUI();
        updatePTTimer();
        setInterval(updatePTTimer, 1000);
    });

    /* =======================================================
       🛡️ 1. HISTORY VAULT LOADER & CONTEXT ENGINE
    ======================================================= */
    let appHistory = [];
    let sessionCache = { math: null };
    const GOOGLE_SHEETS_WEBHOOK = "https://script.google.com/macros/s/AKfycbz1_gv9M2QYJcWkkUQMlDtpBXajrV0psXXc9q68LZLJkZ0b_rokKsz6fyKcYzJ8R6Dsnw/exec";

    if (typeof localforage !== 'undefined') {
        localforage.config({ name: 'AI_Pro_Suite', storeName: 'massive_chat_history' });
        localforage.getItem('aiHistory').then(function(savedData) {
            let mergedHistory = savedData ? savedData : [];
            let oldHistory = [];
            try { let oldData = localStorage.getItem('aiHistory'); if (oldData) oldHistory = JSON.parse(oldData); } catch(e) {}

            if (oldHistory.length > 0) {
                let existingIds = new Set(mergedHistory.map(item => item.id));
                oldHistory.forEach(item => { if (!existingIds.has(item.id)) mergedHistory.push(item); });
                mergedHistory.sort((a, b) => b.id - a.id);
                localforage.setItem('aiHistory', mergedHistory);
            }
            appHistory = mergedHistory;
        }).catch(e => console.log("Vault error:", e));
    } else {
        try { appHistory = JSON.parse(localStorage.getItem('aiHistory') || '[]'); } catch(e) { appHistory = []; }
    }

    function saveHistorySafe() { 
        if (typeof localforage !== 'undefined') {
            localforage.setItem('aiHistory', appHistory).catch(e => console.error("Vault save failed:", e));
        } else {
            try { localStorage.setItem('aiHistory', JSON.stringify(appHistory)); } catch(e) { appHistory.pop(); saveHistorySafe(); }
        }
    }

    function saveToHistory(type, q, a, img = null, provider = "AI") { 
        fetch(GOOGLE_SHEETS_WEBHOOK, {
            method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, 
            body: JSON.stringify({ action: "log", type: type, question: q, answer: a.replace(/<[^>]*>?/gm, ''), provider: provider || "Gemini" })
        }).catch(e => console.log("Google Sheets sync failed."));

        let sessionId = sessionCache[type];
        let histItem = appHistory.find(i => i.id === sessionId);

        if (!histItem) {
            sessionId = Date.now(); sessionCache[type] = sessionId; 
            histItem = { id: sessionId, type: type, title: q.substring(0,25) + '...', interactions: [{ question: q, answer: a, image: img, provider: provider }], provider: provider, question: q, answer: a };
            appHistory.unshift(histItem);
        } else {
            histItem.interactions.push({ question: q, answer: a, image: img, provider: provider });
            histItem.question = q; histItem.answer = a; 
        }
        saveHistorySafe(); 
    }

    function getSessionContext(type) {
        let sessionId = sessionCache[type];
        if (!sessionId) return "";
        let session = appHistory.find(i => i.id === sessionId);
        if (!session || !session.interactions) return "";
        
        let ctx = "\n--- PREVIOUS CHAT HISTORY FOR CONTEXT ---\n";
        let recent = session.interactions.slice(-3); 
        recent.forEach(inter => {
            let cleanAns = inter.answer.replace(/<[^>]*>?/gm, '');
            ctx += `User asked: ${inter.question}\nYou answered: ${cleanAns}\n\n`;
        });
        return ctx + "--- CURRENT NEW QUESTION ---\n";
    }

    function getLastContextImage(type) {
        let sessionId = sessionCache[type];
        if (!sessionId) return null;
        let session = appHistory.find(i => i.id === sessionId);
        if (!session || !session.interactions) return null;
        for (let i = session.interactions.length - 1; i >= 0; i--) {
            if (session.interactions[i].image) return session.interactions[i].image;
        }
        return null;
    }

    window.closeHistory = function() { 
        const modal = document.getElementById('historyModal'); 
        if (modal) modal.classList.remove('active'); 
    };

    /* =======================================================
       🧮 2. MATH SOLVER ENGINE 
    ======================================================= */
    let currentMathImage = null;
    let isProcessing = false;
    let videoStream = null;
    let usingFrontCamera = false;
    let currentMathLang = "Hindi";

    function showToast(msg) {
        let t = document.createElement('div'); t.innerText = msg;
        t.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg, #3b82f6, #8b5cf6); color:white; padding:12px 25px; border-radius:30px; box-shadow:0 10px 25px rgba(0,0,0,0.5); z-index:10000; font-weight:600; font-size: 14px; text-align:center; animation:fadeInOut 3s forwards;";
        document.body.appendChild(t);
        if(!document.getElementById('toastStyles')) {
            let s = document.createElement('style'); s.id = 'toastStyles';
            s.innerHTML = "@keyframes fadeInOut { 0%{opacity:0; bottom:10px;} 10%{opacity:1; bottom:30px;} 90%{opacity:1; bottom:30px;} 100%{opacity:0; bottom:10px;} }";
            document.head.appendChild(s);
        }
        setTimeout(() => t.remove(), 3000);
    }
    
    function toggleSidebar() { 
        document.getElementById('sidebar').classList.toggle('active'); 
        document.getElementById('overlay').classList.toggle('active'); 
    }

    function toggleMathLanguage() {
        const langText = document.getElementById('langText');
        if (currentMathLang === "Hindi") {
            currentMathLang = "English";
            langText.innerText = "EN";
            showToast("🌍 Language changed to English");
        } else {
            currentMathLang = "Hindi";
            langText.innerText = "HI";
            showToast("🌍 Language changed to Hindi");
        }
    }

    // Camera Tools
    function openCamera() { document.getElementById("cameraModal").classList.add("active"); startVideoStream(); }
    function closeCamera() { document.getElementById("cameraModal").classList.remove("active"); if (videoStream) videoStream.getTracks().forEach(t => t.stop()); }
    async function startVideoStream() {
        if (videoStream) videoStream.getTracks().forEach(t => t.stop());
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: usingFrontCamera ? "user" : "environment" } });
            document.getElementById("cameraVideo").srcObject = videoStream;
        } catch (err) { alert("Camera Error"); closeCamera(); }
    }
    function switchCamera() { usingFrontCamera = !usingFrontCamera; startVideoStream(); }
    function captureImage() {
        const video = document.getElementById("cameraVideo");
        const canvas = document.getElementById("captureCanvas");
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
        currentMathImage = canvas.toDataURL("image/jpeg", 0.6);
        document.getElementById("mathPreviewChip").style.backgroundImage = `url(${currentMathImage})`;
        document.getElementById("mathPreviewChip").style.display = "block";
        closeCamera();
    }
    function clearMathImage() { currentMathImage = null; document.getElementById("mathPreviewChip").style.display = "none"; }

    document.getElementById("mathInstructionInput").addEventListener("keydown", function(e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); executeMathFlow(); }
    });

    function scrollToBottom() {
        const area = document.getElementById("mathScrollArea");
        area.scrollTop = area.scrollHeight;
    }

    function appendUserBubble(text, imageUrl = null) {
        const historyDiv = document.getElementById("mathChatHistory");
        const msgDiv = document.createElement("div");
        msgDiv.className = `chat-msg chat-user`;
        let contentHtml = `<div class="bubble">`;
        if (imageUrl) contentHtml += `<img src="${imageUrl}" class="bubble-img" style="max-width: 200px; border-radius: 10px; margin-bottom: 10px;"><br>`;
        contentHtml += `<div style="color: inherit;">${text.replace(/\n/g, '<br>')}</div></div>`;
        msgDiv.innerHTML = contentHtml;
        historyDiv.appendChild(msgDiv);
        scrollToBottom();
    }

    function appendAiLoading() {
        const historyDiv = document.getElementById("mathChatHistory");
        const id = "loading_" + Date.now();
        historyDiv.insertAdjacentHTML('beforeend', `
            <div class="chat-msg chat-ai" id="${id}">
                <div class="bubble" style="display:flex; align-items:center; gap:12px;">
                    <div class="typing-indicator"><span></span><span></span><span></span></div>
                    <span style="color:var(--muted); font-size:14px; font-weight:600;">Solving...</span>
                </div>
            </div>
        `);
        scrollToBottom();
        return id;
    }

    // 🚀 INJECTS TEXT EXPLANATION + STRICT PAPER LABEL
    function updateAiBubbleWithContent(lId, text, provider, paperHtml = "") {
        const loadingBubble = document.getElementById(lId);
        if (!loadingBubble) return;
        const bbl = loadingBubble.querySelector('.bubble');
        
        let providerBadge = `<div style="position:absolute; top:8px; right:12px; font-size:9px; color:var(--muted, #94a3b8); font-weight:bold; letter-spacing:0.5px; text-transform:uppercase; z-index:2; background: rgba(0,0,0,0.1); padding: 2px 6px; border-radius: 4px;">✨ BY ${provider}</div>`;
        
        let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
        
        bbl.style.position = "relative"; 
        bbl.innerHTML = `${providerBadge}<div style="color: inherit; font-size: 15px;">${formattedText}</div>${paperHtml}`;
        
        if (window.MathJax) { MathJax.typesetClear([bbl]); MathJax.typesetPromise([bbl]); }
        scrollToBottom();
    }

    // CORE MATH ENGINE (STRICT PROMPT OVERRIDE)
    async function executeMathFlow() {
        if (isProcessing) return;
        const inputEl = document.getElementById("mathInstructionInput");
        const userText = inputEl.value.trim();
        if (!userText && !currentMathImage) return;

        appendUserBubble(userText || "Solve this image.", currentMathImage);
        inputEl.value = "";
        
        let historyContext = getSessionContext('math');
        let lId = appendAiLoading();
        isProcessing = true;

        // 🚀 PROMPT ENGINE: FORCES GREETING AVOIDANCE AND TAG ISOLATION
        const sysPrompt = `You are an expert math tutor. STRICT RULES:
1. GREETINGS: If the user says "hi", "hello", or asks a non-math question, ONLY reply with a normal friendly response in ${currentMathLang}. DO NOT generate any math problems or use the format below.
2. MATH QUESTIONS: You MUST format your response EXACTLY like this:

QUESTION 1: [Write the exact question here]
SOLUTION- [Write ONLY the final answer or a direct 1-line mathematical result. NO EXPLANATION.]
EXPLANATION- [Write a short text explanation here in ${currentMathLang}. NO MATH FORMULAS.]

<MATH>
[Write the pure step-by-step mathematical formulas using standard LaTeX. DO NOT LEAVE THIS BLANK. DO NOT write words inside here, ONLY MATH.]
</MATH>`;

        let activeImage = currentMathImage || getLastContextImage('math');
        let finalPrompt = `${sysPrompt}\n\n${historyContext}\n\nCurrent Task: ${userText}`;
        
        // 🚀 GRAB THE SELECTED MODEL FROM THE DROPDOWN
        let selectedModel = document.getElementById("modelSelect").value;
        let payload = { 
            userPrompt: finalPrompt,
            providerOverride: selectedModel
        };
        
        if (activeImage) {
            payload.imageBase64 = activeImage;
            track('v'); 
        } else {
            track('t'); 
        }
        
        let endpoint = activeImage ? "/api/gemini-vision" : "/api/gemini-text";

        try {
            const res = await fetch(endpoint, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Failed API request.");

            let aiText = data.text;
            let paperHtml = "";

            // 🚀 RUTHLESS PARSER: Eliminates <MATH> tags entirely and prevents empty papers
            let match = aiText.match(/<MATH(?:_PAPER)?>([\s\S]*?)<\/MATH(?:_PAPER)?>/i);
            if (match) {
                let mathContent = match[1].trim();
                mathContent = mathContent.replace(/\*\*(.*?)\*\*/g, '$1'); // Clean any stray markdown
                
                let paperId = "paper_" + Date.now();
                paperHtml = `
                <div style="font-weight:bold; color:#3b82f6; margin-top:20px; margin-bottom:5px; font-size:14px;">IMAGE OF SOLUTION-</div>
                <div class="digital-paper-container" id="${paperId}">${mathContent.replace(/\n/g, '<br>')}</div>`;
            } 
            
            // Remove the tags from the main text response completely, whether there was a match or not.
            aiText = aiText.replace(/<MATH(?:_PAPER)?>[\s\S]*?<\/MATH(?:_PAPER)?>/gi, '').trim();
            aiText = aiText.replace(/<\/?MATH(?:_PAPER)?>/gi, '').trim();

            saveToHistory('math', userText || "Solve this image", aiText + "\n" + (match ? match[1] : ""), activeImage, data.provider);
            updateAiBubbleWithContent(lId, aiText, data.provider || "Gemini", paperHtml);
            
            clearMathImage();
            isProcessing = false;

        } catch (err) {
            isProcessing = false;
            updateAiBubbleWithContent(lId, "❌ Math Solver Error: " + err.message, "System");
        }
    }

    // WHATSAPP SHARE ENGINE
    window.openWhatsAppModal = function() {
        const historyDiv = document.getElementById("mathChatHistory");
        const messages = historyDiv.querySelectorAll(".chat-msg");
        if (messages.length === 0) return alert("⚠️ No chat history available to share yet!");
        document.getElementById('whatsappModal').style.display = 'flex';
        document.getElementById('waNumberInput').focus();
    };

    window.closeWhatsAppModal = function() {
        document.getElementById('whatsappModal').style.display = 'none';
        document.getElementById('waNumberInput').value = '';
    };

    window.submitWhatsAppNumber = async function(event) {
        const number = document.getElementById('waNumberInput').value.trim();
        if (!number) return alert("Please enter a mobile number.");

        const historyDiv = document.getElementById("mathChatHistory");
        const messages = historyDiv.querySelectorAll(".chat-msg");
        let fullChatText = "";

        messages.forEach(msg => {
            const isUser = msg.classList.contains("chat-user");
            const bubble = msg.querySelector(".bubble");
            if (!bubble) return;

            let clone = bubble.cloneNode(true);
            clone.querySelectorAll('img, .api-badge').forEach(el => el.remove());
            
            let htmlStr = clone.innerHTML;
            htmlStr = htmlStr.replace(/<br\s*[\/]?>/gi, '\n');
            htmlStr = htmlStr.replace(/<\/div>/gi, '\n');
            
            clone.innerHTML = htmlStr;
            let msgText = clone.textContent || clone.innerText || "";
            msgText = msgText.replace(/\n\s*\n/g, '\n\n').trim();

            if (msgText.length > 0) {
                if (isUser) fullChatText += `👤 *YOU:* ${msgText}\n\n`;
                else fullChatText += `🤖 *AI SOLVER:* \n${msgText}\n\n---------------------------------\n\n`;
            }
        });

        const btn = event.target;
        const originalText = btn.innerHTML;
        btn.innerHTML = "⏳ Sending..."; btn.disabled = true;

        try {
            const response = await fetch("/api/secure-whatsapp", {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ number: number, message: "📚 *AI Pro Suite Math Export*\n\n" + fullChatText.trim() })
            });
            if (response.ok) { alert("✅ Chat sent!"); closeWhatsAppModal(); } 
            else { alert("❌ Failed to send."); }
        } catch (e) { alert("❌ Connection error."); }

        btn.innerHTML = originalText; btn.disabled = false;
    };
</script>
<script src="ui-controls.js" defer></script>
