    let quizData = [];

    // STRICT PROMPT FIX: Math formatting and preventing English hints in translated correct options
    async function fetchQuizChunk(chunkCount, grade, finalTopicStr, language, providerOverride) {
        const prompt = `Create a quiz with exactly ${chunkCount} multiple choice questions for a Class ${grade} student on the subject/topic: "${finalTopicStr}". 
        CRITICAL RULES:
        1. LANGUAGE: The ENTIRE quiz (questions, options, and explanations) MUST be strictly in ${language.toUpperCase()}. Even if the topic name is English, write everything in ${language}.
        2. NO HINTS IN OPTIONS (CRITICAL): The 4 items in the "options" array MUST be identical in format. DO NOT add any extra English meanings, translations, or hints to the correct option. Make all options look uniformly plausible.
        3. ALL NUMBERS MUST be standard English Arabic numerals (0-9). DO NOT use Hindi numerals.
        4. Use LaTeX for ALL math equations. Wrap inline math in $...$ and display math in $$...$$.
        5. JSON ESCAPING (CRITICAL): Double-escape ALL LaTeX backslashes. Write \\\\frac instead of \\frac.
        6. Return ONLY a valid JSON array. NO markdown code blocks. NO extra conversational text.
        Format exactly like this:
        [
          {
            "question": "What is $\\\\frac{1}{2} + \\\\frac{1}{4}$?",
            "options": ["$\\\\frac{3}{4}$", "1", "0", "$\\\\frac{1}{8}$"],
            "correctOption": "$\\\\frac{3}{4}$",
            "explanation": "Because $\\\\frac{2}{4} + \\\\frac{1}{4} = \\\\frac{3}{4}$."
          }
        ]`;

        const response = await fetch('/api/gemini-text', {
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                systemPrompt: "You are a strict data-only API. Output nothing except the requested JSON array.",
                userPrompt: prompt,
                providerOverride: providerOverride
            })
        });
        
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Failed to fetch from server.");

        let rawText = data.text;
        // Strip out potential markdown wrapping just in case the AI ignored the rule
        let startIdx = rawText.indexOf('[');
        let endIdx = rawText.lastIndexOf(']');
        if (startIdx === -1 || endIdx === -1) throw new Error("AI did not return the correct array format.");

        let cleanJsonString = rawText.substring(startIdx, endIdx + 1);
        let parsedArray;
        
        try {
            parsedArray = JSON.parse(cleanJsonString);
        } catch (err) {
            console.error("JSON Parsing failed for this chunk:", cleanJsonString);
            throw new Error("AI returned malformed data (Syntax Error). Please try again.");
        }

        // Normalizer to protect from API key changes
        return parsedArray.map(item => ({
            question: item.question || item.q || "Question text missing",
            options: item.options || item.choices || ["A", "B", "C", "D"],
            correctOption: item.correctOption || item.correct_option || item.answer || item.correctAnswer || item.correct || "",
            explanation: item.explanation || item.reason || item.reasoning || item.desc || "No explanation provided."
        }));
    }

    async function robustFetchChunk(chunkCount, grade, topicStr, language, modelQueue) {
        for (let i = 0; i < modelQueue.length; i++) {
            let currentModel = modelQueue[i];
            try {
                console.log(`Trying ${chunkCount} questions with ${currentModel}`);
                return await fetchQuizChunk(chunkCount, grade, topicStr, language, currentModel);
            } catch (e) {
                console.warn(`[Fallback Triggered] ${currentModel} failed:`, e);
            }
        }
        throw new Error("All models in the queue failed for this chunk.");
    }

    startBtn.addEventListener('click', async () => {
        const grade = document.getElementById('quizClass').value;
        const language = document.getElementById('quizLanguage').value;
        let count = parseInt(document.getElementById('quizCount').value);
        
        const modelPriorityStr = document.getElementById('modelPriority').value;
        const isDivideMode = document.getElementById('divideMode').checked;

        if(!chosenSubject) { showToast("⚠️ Please select a Subject first."); return; }
        if(topicData[chosenSubject] && !chosenTopic) { showToast("⚠️ Please select a Specific Topic."); return; }
        if(!grade) { showToast("⚠️ Please select a Class/Grade."); return; }
        
        if(isNaN(count) || count < 1) count = 5;
        if(count > 30) count = 30;

        startBtn.style.display = 'none';
        loadBar.style.display = 'block';
        
        const finalTopicStr = chosenTopic ? `${chosenSubject} - ${chosenTopic}` : chosenSubject;
        const baseModelOrder = modelPriorityStr.split(','); 

        try {
            let allFetchedQuestions = [];

            if (isDivideMode) {
                setupStatus.innerHTML = "Dividing workload across AI Models simultaneously...";
                
                let chunk1 = Math.ceil(count / 3);
                let chunk2 = Math.ceil((count - chunk1) / 2);
                let chunk3 = count - chunk1 - chunk2;

                const promises = [];

                if (chunk1 > 0) {
                    let order1 = [baseModelOrder[0], baseModelOrder[1], baseModelOrder[2]];
                    promises.push(robustFetchChunk(chunk1, grade, finalTopicStr, language, order1));
                }
                if (chunk2 > 0) {
                    let order2 = [baseModelOrder[1], baseModelOrder[2], baseModelOrder[0]];
                    promises.push(robustFetchChunk(chunk2, grade, finalTopicStr, language, order2));
                }
                if (chunk3 > 0) {
                    let order3 = [baseModelOrder[2], baseModelOrder[0], baseModelOrder[1]];
                    promises.push(robustFetchChunk(chunk3, grade, finalTopicStr, language, order3));
                }

                const results = await Promise.all(promises);
                allFetchedQuestions = results.flat();
            } else {
                setupStatus.innerHTML = `Connecting to ${baseModelOrder[0].toUpperCase()}...`;
                
                let chunks = [];
                let remaining = count;
                while(remaining > 0) {
                    let c = Math.min(remaining, 15);
                    chunks.push(c);
                    remaining -= c;
                }

                for (let c of chunks) {
                    let result = await robustFetchChunk(c, grade, finalTopicStr, language, baseModelOrder);
                    allFetchedQuestions = allFetchedQuestions.concat(result);
                }
            }

            if(allFetchedQuestions.length === 0) throw new Error("AI returned empty quiz array. Please try again.");

            quizData = allFetchedQuestions.slice(0, count); 
            currentQuestionIndex = 0;
            userAnswers = [];
            document.getElementById('quizTag').innerText = `${finalTopicStr} • Class ${grade}`;
            
            setupEl.classList.remove('active');
            activeEl.classList.add('active');
            renderQuestion();

        } catch(err) {
            console.error("Quiz Generation Failed:", err);
            setupStatus.innerHTML = `❌ Error: Generation failed. Try asking for fewer questions.`;
            showToast("⚠️ Generation error. Click start again!");
            startBtn.style.display = 'block';
            loadBar.style.display = 'none';
        }
    });

    function renderQuestion() {

        document.getElementById('quizProgress').innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
        
        document.getElementById('questionText').innerHTML = String(qData.question).replace(/</g, "&lt;").replace(/>/g, "&gt;");

            btn.onclick = () => { userAnswers[currentQuestionIndex] = opt; renderQuestion(); };
            optsContainer.appendChild(btn);
        });

        prevBtn.style.display = currentQuestionIndex > 0 ? 'block' : 'none';

    function finishQuiz() {
        activeEl.classList.remove('active');

        let correctCount = 0;

        quizData.forEach((q, index) => {

        else if (percentage >= 40) { perfMsg = "Good effort, but you need to study more to master this. 📚"; perfColor = "#f59e0b"; }
        else { perfMsg = "Needs improvement. Please review the concepts and try again. 📖"; perfColor = "#ef4444"; }

        document.getElementById('performanceMessage').innerHTML = `<span style="color: ${perfColor};">${perfMsg}</span> <br><span style="font-size: 13px; color: #94a3b8; font-weight: normal; margin-top: 5px; display: inline-block;">You scored ${percentage}% marks.</span>`;

        document.getElementById('resultSubtext').innerText = `${finalTopicStr} - Class ${grade}`;
        document.getElementById('statCorrect').innerText = correctCount;
        document.getElementById('statWrong').innerText = total - correctCount;

        if (window.MathJax) MathJax.typesetPromise([document.getElementById('reviewContainer')]).catch((err) => console.log('MathJax Review Render Error: ', err));

    function saveQuizToHistory(subject, grade, correct, total, htmlDetails) {
        if (typeof localforage !== 'undefined') {
            let sessionId = Date.now();
            let percentage = total > 0 ? Math.round((correct / total) * 100) : 0;

            let histItem = { 
                id: sessionId, 
                type: 'quiz', 
                title: `${subject} Quiz (${correct}/${total})`, 
                interactions: [{ question: `Take a ${total}-question quiz on ${subject} for Class ${grade}.`, answer: formattedAnswer, provider: "AI Quiz Engine" }], 
                provider: "AI Quiz Engine", 
                question: `Take a ${total}-question quiz on ${subject} for Class ${grade}.`,

            localforage.getItem('aiHistory').then(function(history) {

                if (item.interactions && item.interactions.length > 0 && container.classList.contains('chat-scroll-area')) {
                    container.innerHTML = ''; // Wipe the empty screen
                    
                    item.interactions.forEach((inter, index) => {
                        let imgHtml = inter.image ? `<img src="${inter.image}" class="bubble-img" style="max-width:100%; border-radius:16px; margin-bottom:15px; border: 2px solid var(--border-light); box-shadow: var(--glass-shadow);">` : '';
                        let textId = `restored_text_${index}`;
                        
                        container.insertAdjacentHTML('beforeend', `
                            <div class="chat-msg chat-user" style="animation: slideInUp 0.5s ease-out;">
                                <div class="bubble" style="background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border-bottom-right-radius: 6px; box-shadow: 0 8px 25px var(--primary-glow);">
                                    ${imgHtml}
                                    <div>${inter.question.replace(/\n/g, '<br>')}</div>
                                </div>
                            </div>
                            <div class="chat-msg chat-ai" style="animation: bounceInBubble 0.6s ease-out;">
                                <div class="bubble" style="background: var(--bg-surface); border: 1px solid var(--border-light); border-bottom-left-radius: 6px; box-shadow: var(--glass-shadow); display: flex; flex-direction: column;">
                                    <div class="api-badge" style="display: inline-block; align-self: flex-start; background: var(--input-bg); border: 1px solid var(--primary); color: var(--primary); padding: 8px 16px; border-radius: 14px; font-size: 11px; font-weight: 900; margin-bottom: 20px; box-shadow: 0 4px 10px var(--primary-glow);">✨ BY ${inter.provider || "AI"}</div>
                                    <div id="${textId}" style="margin-top:0; width:100%; overflow-x:auto;">${inter.answer.replace(/\n/g, '<br>')}</div>
                                    
                                    <div class="action-buttons-container" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:25px; padding-top:15px; border-top:1px solid var(--border-light); width:100%;">
                                        <button class="btn green" style="background: linear-gradient(145deg, var(--bg-surface), var(--input-bg)); color: var(--primary); border: 1px solid var(--primary); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer; flex: 1; box-shadow: 0 4px 10px rgba(0,0,0,0.05);" onclick="speakAndHighlight('${textId}')">🔊 Listen</button>
                                        <button class="btn" style="background: linear-gradient(145deg, var(--bg-surface), var(--input-bg)); color: var(--primary); border: 1px solid var(--primary); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer; flex: 1; box-shadow: 0 4px 10px rgba(0,0,0,0.05);" onclick="copyToClipboard('${textId}')">📋 Copy</button>
                                    </div>
                                </div>
                            </div>
                        `);
                    });
                    
                    // Force the window to scroll to the newly injected text
                    setTimeout(() => { container.scrollTop = container.scrollHeight; }, 100);
                    if (typeof showToast === 'function') showToast("🔄 Search Restored Successfully!");
                } 
                
                // 🛑 SCENARIO 2: It's a Text Box Interface (Translator, Q&A)
                else {
                    let textId = `restored_text_box`;
                    let ansText = item.interactions ? item.interactions[0].answer : item.answer;
                    
                    container.innerHTML = `
                        <div class="api-badge" style="display: inline-block; background: var(--input-bg); border: 1px solid var(--primary); color: var(--primary); padding: 8px 16px; border-radius: 14px; font-size: 11px; font-weight: 900; margin-bottom: 20px;">✨ BY ${item.provider || "AI"}</div>
                        <div id="${textId}" style="margin-top:0;">${ansText.replace(/\n/g, '<br>')}</div>
                        <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:25px; padding-top:15px; border-top:1px solid var(--border-light);">
                            <button class="btn green" style="background: linear-gradient(145deg, var(--bg-surface), var(--input-bg)); color: var(--primary); border: 1px solid var(--primary); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 800; flex: 1;" onclick="speakAndHighlight('${textId}')">🔊 Listen</button>
                            <button class="btn" style="background: linear-gradient(145deg, var(--bg-surface), var(--input-bg)); color: var(--primary); border: 1px solid var(--primary); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 800; flex: 1;" onclick="copyToClipboard('${textId}')">📋 Copy</button>
                        </div>
                    `;
                    // Refill the input text box too
                    if (document.getElementById('inputText')) document.getElementById('inputText').value = item.question || "";
                    if (typeof showToast === 'function') showToast("🔄 Document Restored Successfully!");
                }

                // Safely render any Math/Physics equations (LaTeX)
                if (window.MathJax) {
                    MathJax.typesetPromise([container]).catch(e => console.log(e));
                }
            };

            // Safely fetch from your LocalForage database, fallback to LocalStorage
            if (typeof localforage !== 'undefined') {
                localforage.getItem('aiHistory').then(data => {
                    if (data && data.length > 0) forceInjectData(data);
                    else forceInjectData(JSON.parse(localStorage.getItem('aiHistory') || '[]'));
                }).catch(() => forceInjectData(JSON.parse(localStorage.getItem('aiHistory') || '[]')));
            } else {
                forceInjectData(JSON.parse(localStorage.getItem('aiHistory') || '[]'));
            }
            
        }, 800);
    });
</script>
</body>
</html>
