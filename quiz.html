function openSolutionModal(qData){
document.getElementById('solutionModal').style.display='flex';
document.getElementById('solutionContent').innerHTML=`
<h3 style="color:#38bdf8">${qData.question}</h3>
<div><b>Correct Answer:</b> ${qData.correctOption}</div>
<div style="margin-top:15px">${qData.deepSolution || qData.explanation}</div>`;
if(window.MathJax){MathJax.typesetClear();MathJax.typesetPromise([document.getElementById('solutionContent')]);}
}
function closeSolutionModal(){document.getElementById('solutionModal').style.display='none';}

</script>

    <style>
        /* 🛑 INDESTRUCTIBLE CENTERING 🛑 */

            position: absolute !important;
            top: 70px !important;

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Core UI Elements */
        .quiz-btn {
            background: linear-gradient(135deg, #a855f7, #7e22ce);

            padding: 16px;

        input[type="number"].standard, select.standard {
            width: 100%;
            padding: 15px 20px;

            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            box-sizing: border-box;
            appearance: none;
        }
        input[type="number"].standard:focus, select.standard:focus {
            border-color: #c084fc;
            background: rgba(15, 23, 42, 0.9);
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
            word-wrap: break-word; 
        }
        .option-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: #38bdf8; }
        .option-btn.selected {
            background: rgba(56, 189, 248, 0.2) !important;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3) !important;
        }

        .stat-box {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            padding: 20px; border-radius: 15px; text-align: center; flex: 1;
        }
        .stat-box .num { font-size: 32px; font-weight: 900; }
        
        .result-card {
            background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; padding: 20px; margin-bottom: 15px; text-align: left; word-wrap: break-word; 
        }

        @keyframes loadingSweep { 0% { left: -30%; width: 30%; } 50% { width: 50%; } 100% { left: 100%; width: 30%; } }
        @keyframes fadeToast { 0% { opacity: 0; bottom: 10px; } 10% { opacity: 1; bottom: 30px; } 90% { opacity: 1; bottom: 30px; } 100% { opacity: 0; bottom: 10px; } }

        select.standard option { background: #0f172a; color: white; }

        /* Subject Modal Styling & SCROLL FIX */
        .subj-btn {
            background: rgba(255, 255, 255, 0.05);

        /* Forces the modal list to scroll perfectly */

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const active = !sidebar.classList.contains("active");
        sidebar.classList.toggle("active", active);
        overlay.classList.toggle("active", active);
    }
    
    if(document.getElementById("overlay")) {
        document.getElementById("overlay").onclick = toggleSidebar;
    }

    function showToast(msg) {
        let t = document.createElement('div');
        t.innerText = msg;
        t.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg, #ef4444, #b91c1c); color:white; padding:12px 25px; border-radius:30px; box-shadow:0 10px 25px rgba(0,0,0,0.5); z-index:100000; font-weight:600; font-size: 14px; text-align:center; animation:fadeToast 3s forwards; pointer-events: none;";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    // --- Subject Modal Logic ---
    let chosenSubject = "";

const topicMap={
Math:["Algebra","Profit & Loss","Percentage","Geometry","Trigonometry","Statistics","Probability","Fractions","Decimals","Number System"],
Science:["Physics","Chemistry","Biology","Motion","Electricity","Magnetism","Cell","Genetics","Human Body","Atoms"],
SST:["History","Geography","Civics","Economics","Constitution","Democracy","Climate","Population","Resources","Ancient India"]
};

    const subjModal = document.getElementById('subjectModal');
    
    document.getElementById('quizSubjectSelector').addEventListener('click', () => {
        subjModal.style.display = 'flex';
    });
    
    document.getElementById('closeSubjectModalBtn').addEventListener('click', () => {
        subjModal.style.display = 'none';
    });

    document.querySelectorAll('.subj-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            chosenSubject = e.target.innerText;
            const textEl = document.getElementById('selectedSubjectText');
            textEl.innerText = chosenSubject;
            textEl.style.color = "white";
            subjModal.style.display = 'none';
        });
    });

    // --- Quiz Logic ---
    let quizData = [];
    let currentQuestionIndex = 0;
    let userAnswers = [];

    const setupEl = document.getElementById('quizSetup');
    const activeEl = document.getElementById('quizActive');
    const resultsEl = document.getElementById('quizResults');
    const startBtn = document.getElementById('startQuizBtn');
    const setupStatus = document.getElementById('setupStatus');
    const loadBar = document.getElementById('loadingBarContainer');
    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');

    startBtn.addEventListener('click', async () => {
        const grade = document.getElementById('quizClass').value;
        const language = document.getElementById('quizLanguage').value;
        let count = parseInt(document.getElementById('quizCount').value);

        if(!chosenSubject) {
            showToast("⚠️ Please select a Subject first.");
            return;
        }
        
        if(isNaN(count) || count < 1) count = 5;
        if(count > 15) count = 15;

        startBtn.style.display = 'none';
        loadBar.style.display = 'block';
        setupStatus.innerHTML = "Connecting to AI... Building your custom quiz.";

      const prompt = `Create a quiz with exactly ${count} questions for a Class ${grade} student on "${chosenSubject}".
CRITICAL FORMATTING RULES:
1. Use LaTeX for math. Fractions should be written as \\frac{numerator}{denominator} (e.g., \\frac{5}{6}). 
2. Use caret notation for powers (e.g., 3^2).
3. The text of the quiz MUST be generated in ${language}.
4. Return ONLY a strictly valid JSON array. Do NOT use markdown code blocks.
5. Example format: [{"question": "What is \\frac{1}{2} + \\frac{1}{4}?", "options": ["\\frac{3}{4}", "1", "0", "2"], "correctOption": "\\frac{3}{4}", "explanation": "Since 3^2 = 9, the answer is..."}]
6. Array format must be exactly like this:
        [
          {
            "question": "What is the powerhouse of the cell?",
            "options": ["Nucleus", "Mitochondria", "Ribosome", "Endoplasmic Reticulum"],
            "correctOption": "Mitochondria",
            "explanation": "Mitochondria are responsible for creating ATP, which provides energy to the cell."
          }`;

        try {
            const response = await fetch('/api/gemini-text', {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    systemPrompt: "You are a strict data-only API. Output nothing except the requested JSON array.",
                    userPrompt: prompt
                })
            });
            
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "Failed to fetch from server.");

            let rawText = data.text;
            let startIdx = rawText.indexOf('[');
            let endIdx = rawText.lastIndexOf(']');

            if (startIdx === -1 || endIdx === -1) {
                throw new Error("AI did not return the correct array format.");
            }

            let cleanJsonString = rawText.substring(startIdx, endIdx + 1);
            quizData = JSON.parse(cleanJsonString);
            
            if(quizData.length === 0) throw new Error("AI returned empty quiz array.");

            currentQuestionIndex = 0;
            userAnswers = [];
            document.getElementById('quizTag').innerText = `${chosenSubject} • Class ${grade}`;
            
            setupEl.classList.remove('active');
            activeEl.classList.add('active');
            
            renderQuestion();

        } catch(err) {
            console.error("Quiz Generation Failed:", err);
            setupStatus.innerHTML = `❌ Error: AI formatting glitch.`;
            showToast("⚠️ AI formatting error. Just click start again!");
            
            startBtn.style.display = 'block';
            loadBar.style.display = 'none';
        }
    });

    function renderQuestion() {
        const qData = quizData[currentQuestionIndex];
        
        const progressPct = ((currentQuestionIndex) / quizData.length) * 100;
        document.getElementById('quizProgressBar').style.width = progressPct + '%';
        document.getElementById('quizProgress').innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
        
        document.getElementById('questionText').innerHTML = qData.question;
        
        const optsContainer = document.getElementById('optionsContainer');
        optsContainer.innerHTML = '';

        const prevAns = userAnswers[currentQuestionIndex];

        qData.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt;
            
            if (prevAns && opt === prevAns) {
                btn.classList.add('selected'); 
            }
            
            btn.onclick = () => {
                userAnswers[currentQuestionIndex] = opt;
                renderQuestion(); 
            };
            
            optsContainer.appendChild(btn);
        });

        prevBtn.style.display = currentQuestionIndex > 0 ? 'block' : 'none';
        nextBtn.innerText = currentQuestionIndex === quizData.length - 1 ? 'Finish 🏆' : 'Next ➡️';

        if (window.MathJax) {
        MathJax.typesetClear();
        MathJax.typesetPromise([document.getElementById('questionText'),document.getElementById('optionsContainer')])
            .catch((err) => console.log('MathJax Error:', err));
    }
}

    nextBtn.addEventListener('click', () => {
        if (!userAnswers[currentQuestionIndex]) {
            showToast("⚠️ Please select an answer first!");
            return;
        }

        currentQuestionIndex++;
        if (currentQuestionIndex >= quizData.length) {
            finishQuiz();
        } else {
            renderQuestion();
        }
    });

    prevBtn.addEventListener('click', () => {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderQuestion();
        }
    });

    function finishQuiz() {
        activeEl.classList.remove('active');
        resultsEl.classList.add('active');
        
        let correctCount = 0;
        let reviewHtml = '';

        quizData.forEach((q, index) => {
            const userAns = userAnswers[index] || "Unanswered";
            const isCorrect = userAns === q.correctOption;
            if(isCorrect) correctCount++;

            const statusIcon = isCorrect ? '✅' : '❌';
            const colorClass = isCorrect ? '#22c55e' : '#ef4444';

            reviewHtml += `
            <div class="result-card">
                <div style="font-weight: 700; font-size: 15px; margin-bottom: 10px; color: white;">
                    ${index + 1}. ${q.question}
                </div>
                <div style="font-size: 13px; margin-bottom: 5px;">
                    <span style="color: #94a3b8;">Your Answer:</span> 
                    <span style="color: ${colorClass}; font-weight: 600;">${statusIcon} ${userAns}</span>
                </div>
                <div style="font-size: 13px; margin-bottom: 10px;">
                    <span style="color: #94a3b8;">Correct Answer:</span> 
                    <span style="color: #22c55e; font-weight: 600;">${q.correctOption}</span>
                </div>
                <div style="font-size: 13px; color: #cbd5e1; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; border-left: 3px solid #a855f7;">
                    <b>Why?</b> ${q.explanation}
                </div>
            </div>`;
        });

        const grade = document.getElementById('quizClass').value;
        const total = quizData.length;

        document.getElementById('resultSubtext').innerText = `${chosenSubject} - Class ${grade}`;
        document.getElementById('statCorrect').innerText = correctCount;
        document.getElementById('statWrong').innerText = total - correctCount;
        document.getElementById('statTotal').innerText = total;
        document.getElementById('reviewContainer').innerHTML = reviewHtml;

      if (window.MathJax) {
        MathJax.typesetPromise([document.getElementById('reviewContainer')])
            .catch((err) => console.log('MathJax Error:', err));
    }

        saveQuizToHistory(chosenSubject, grade, correctCount, total, reviewHtml);
    }

    function saveQuizToHistory(subject, grade, correct, total, htmlDetails) {
        try {
            let history = JSON.parse(localStorage.getItem('aiHistory') || '[]');
            let sessionId = Date.now();
            
            let formattedAnswer = `
                <div style="font-size:16px; font-weight:bold; color:#22c55e;">Score: ${correct} out of ${total}</div>
                <hr style="border-color:rgba(255,255,255,0.1); margin:10px 0;">
                ${htmlDetails}
            `;

            let histItem = {
                id: sessionId,
                type: 'quiz',
                title: `${subject} Quiz (${correct}/${total})`,
                interactions: [{
                    question: `Take a ${total}-question quiz on ${subject} for Class ${grade}.`,
                    answer: formattedAnswer,
                    provider: "Gemini Quiz Engine"
                }],
                provider: "Gemini Quiz Engine",
                question: `Take a ${total}-question quiz on ${subject} for Class ${grade}.`,
                answer: formattedAnswer
            };
            history.unshift(histItem);
            localStorage.setItem('aiHistory', JSON.stringify(history));
        } catch(e) { 
            console.error("Failed to save history", e); 
        }
    }

    function downloadPDF() {
        const element = document.getElementById('pdfExportArea');
        const opt = {
            margin:       10,
            filename:     `AI_Quiz_Result_${chosenSubject.replace(/\s+/g, '_')}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#0f172a' },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            showToast("✅ PDF Downloaded!");
        });
    }
</script>

<script>
let uiLang='English';
let quizTimer=null;
let timeLeft=0;

const hindiTopics={
'Geography':'भूगोल','History':'इतिहास','Civics':'नागरिक शास्त्र',
'Physics':'भौतिकी','Chemistry':'रसायन विज्ञान','Biology':'जीव विज्ञान',
'Algebra':'बीजगणित'
};

document.addEventListener('DOMContentLoaded',()=>{
 const b=document.getElementById('langToggle');
 if(b){
  b.onclick=()=>{
   uiLang=uiLang==='English'?'Hindi':'English';
   const sel=document.getElementById('quizTopic');
   if(sel){
    [...sel.options].forEach(o=>{
      o.textContent=(uiLang==='Hindi' && hindiTopics[o.value])?hindiTopics[o.value]:o.value;
    });
   }
  };
 }
});

function startQuizTimer(totalQuestions){
 clearInterval(quizTimer);
 timeLeft=totalQuestions*60;
 quizTimer=setInterval(()=>{
   timeLeft--;
   const m=Math.floor(timeLeft/60);
   const s=timeLeft%60;
   const el=document.getElementById('timerDisplay');
   if(el) el.textContent='⏳ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
   if(timeLeft<=0){
      clearInterval(quizTimer);
      alert('Time Over! Showing score.');
      if(typeof finishQuiz==='function') finishQuiz();
   }
 },1000);
}
</script>
