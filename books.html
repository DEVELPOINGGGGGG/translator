<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Book Deep Study</title>
    
    <!-- SYSTEM DEFAULT STYLING & FONTS -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script>
      MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        /* Wizard Custom Layout over style.css base */
        .wizard-container {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px; padding-top: 100px;
        }

        .step-card {
            width: 100%; max-width: 600px; display: none; text-align: center;
            animation: popInCard 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .step-card.active { display: block; }

        .step-card h2 { color: var(--primary); margin-bottom: 20px; font-weight: 800; }
        .step-card label { display: block; text-align: left; margin-bottom: 8px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; font-size: 13px;}

        .btn-row { display: flex; gap: 15px; justify-content: space-between; margin-top: 25px; }
        .btn-row .btn { flex: 1; }

        /* Camera UI */
        .cam-controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-evenly; align-items: center; z-index: 9999999;}
    </style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<!-- PREMIUM TOPBAR -->
<div class="topbar" id="appTopbar">
    <div class="menuBtn" onclick="toggleSidebar()">☰</div>
    <div class="appTitle">📚 Book Deep Study</div>
    <button class="btn" id="settingsBtn" style="padding: 8px 15px; display: none; font-size: 13px;" onclick="openSettings()">⚙️ Settings</button>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <button class="sidebar-close-btn" onclick="toggleSidebar()">✖ Close Menu</button>
  <button onclick="window.location.href='index.html'">🏠 Dashboard</button>
  <button onclick="window.location.href='books.html'" style="border-left: 4px solid var(--primary); color: var(--primary); background: var(--border-light);">📚 Book Deep Study</button>
  <button onclick="window.location.href='maths.html'">🧮 Math Solver</button>
  <button onclick="window.location.href='search.html'">🔎 Deep Search</button>
  <button onclick="window.location.href='history.html'">🕒 History</button>
</div>

<!-- CAMERA OVERLAY -->
<div id="cameraModal" class="cameraModal">
    <button class="closeBtn" onclick="closeCamera()">✖</button>
    <video id="cameraVideo" autoplay playsinline></video>
    <div class="cam-controls">
        <button class="cam-icon-btn" id="toggleFlashBtn">💡</button>
        <div class="cameraCircle" onclick="capturePhoto()"></div>
        <button class="cam-icon-btn" onclick="switchCamera()">🔄</button>
    </div>
</div>

<!-- WIZARD STEPS -->
<div class="page active" id="wizardPage">
    <div class="wizard-container" id="wizardContainer">
        
        <!-- Step 1: Publisher -->
        <div class="card step-card active" id="step-1">
            <h2>Step 1: Board / Publisher</h2>
            <label>Select Publisher / Board:</label>
            <select id="publisherSelect" class="standard">
                <option value="" selected disabled>-- Select Publisher --</option>
                <option value="NCERT">NCERT</option>
                <option value="SCERT">SCERT</option>
                <option value="Bihar Board">Bihar Board</option>
                <option value="CBSE Reference">CBSE Reference</option>
                <option value="Arihant">Arihant</option>
                <option value="Oswaal">Oswaal</option>
                <option value="S Chand">S Chand</option>
                <option value="Pradeep">Pradeep</option>
                <option value="Other">Other Publisher</option>
            </select>
            <div class="btn-row">
                <button class="btn" onclick="nextStep(2)">Next ➔</button>
            </div>
        </div>

        <!-- Step 2: Class -->
        <div class="card step-card" id="step-2">
            <h2>Step 2: Class</h2>
            <label>Select Class:</label>
            <select id="classSelect" class="standard" onchange="triggerChapterFetch()">
                <option value="" selected disabled>-- Select Class --</option>
                <option value="Class 1">Class 1</option>
                <option value="Class 2">Class 2</option>
                <option value="Class 3">Class 3</option>
                <option value="Class 4">Class 4</option>
                <option value="Class 5">Class 5</option>
                <option value="Class 6">Class 6</option>
                <option value="Class 7">Class 7</option>
                <option value="Class 8">Class 8</option>
                <option value="Class 9">Class 9</option>
                <option value="Class 10">Class 10</option>
                <option value="Class 11">Class 11</option>
                <option value="Class 12">Class 12</option>
            </select>
            <div class="btn-row">
                <button class="btn" style="background: #475569;" onclick="nextStep(1)">⬅ Back</button>
                <button class="btn" onclick="nextStep(3)">Next ➔</button>
            </div>
        </div>

        <!-- Step 3: Subject -->
        <div class="card step-card" id="step-3">
            <h2>Step 3: Subject</h2>
            <label>Select Subject:</label>
            <select id="subjectSelect" class="standard" onchange="triggerChapterFetch()">
                <option value="" selected disabled>-- Select Subject --</option>
                <option value="Science">Science</option>
                <option value="Physics">Physics</option>
                <option value="Chemistry">Chemistry</option>
                <option value="Biology">Biology</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Social Science">Social Science</option>
                <option value="History">History</option>
                <option value="Geography">Geography</option>
                <option value="Civics">Civics</option>
                <option value="Economics">Economics</option>
                <option value="English">English</option>
                <option value="Hindi">Hindi</option>
                <option value="Sanskrit">Sanskrit</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Accountancy">Accountancy</option>
                <option value="Business Studies">Business Studies</option>
                <option value="Physical Education">Physical Education</option>
                <option value="Other">Other Subject</option>
            </select>
            <div class="btn-row">
                <button class="btn" style="background: #475569;" onclick="nextStep(2)">⬅ Back</button>
                <button class="btn" onclick="nextStep(4)">Next ➔</button>
            </div>
        </div>

        <!-- Step 4: Chapter (AI FETCH ENABLED) -->
        <div class="card step-card" id="step-4">
            <h2>Step 4: Chapter</h2>
            <label>Select Chapter (Names in Hindi):</label>
            <select id="chapterSelect" class="standard">
                <option value="" selected disabled>-- Select Subject & Class First --</option>
            </select>
            
            <label style="margin-top:20px;">Or, Type Chapter Name Manually:</label>
            <input type="text" id="manualChapter" class="standard" placeholder="e.g. अध्याय 2: बल तथा गति">
            
            <div class="btn-row">
                <button class="btn" style="background: #475569;" onclick="nextStep(3)">⬅ Back</button>
                <button class="btn" onclick="nextStep(5)">Next ➔</button>
            </div>
        </div>

        <!-- Step 5: Summary & Start -->
        <div class="card step-card" id="step-5">
            <h2>System Ready</h2>
            <div id="selectionSummary" style="text-align:left; background: var(--input-bg); border: 1px solid var(--border-light); padding:20px; border-radius:16px; margin-bottom:25px; font-weight:600; line-height:2;"></div>
            
            <button class="btn green" style="width: 100%; font-size: 18px; padding: 18px;" onclick="startConversation()">Initialize AI Tutor 🚀</button>
            <div class="btn-row">
                <button class="btn" style="background: #475569;" onclick="nextStep(4)">⬅ Edit Details</button>
            </div>
        </div>
    </div>
</div>

<!-- CHAT INTERFACE -->
<div class="page chat-page-layout" id="chatPage" style="display: none;">
    <div class="chat-scroll-area" id="chatHistory">
        <!-- Messages appear here -->
    </div>

    <div class="chat-input-area">
        <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">
        
        <div style="display:flex; flex-direction:column; flex:1;">
            <div id="imagePreviewContainer" style="display:none; position:absolute; top:-70px; left:20px; z-index: 100;">
                <img id="imgChip" class="image-preview-chip" style="display:block; margin:0;">
                <div class="image-preview-close" onclick="removeImage()">✖</div>
            </div>
            
            <div class="chat-input-wrapper">
                <button class="chat-action-btn" style="background: transparent; box-shadow: none;" onclick="openCameraUI()" title="Upload Image">📷</button>
                <textarea id="chatInput" placeholder="Ask your question here..." rows="1" onkeypress="handleEnter(event)"></textarea>
                <button class="chat-action-btn send" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleSidebar() {
        const s = document.getElementById("sidebar"), o = document.getElementById("overlay");
        const a = !s.classList.contains("active");
        s.classList.toggle("active", a); o.classList.toggle("active", a);
    }
    document.getElementById("overlay").onclick = toggleSidebar;

    // 🛑 ALL CHAPTER NAMES IN HINDI 🛑
    const localChapterBanks = {
        'Science': ['हमारे आस-पास के पदार्थ', 'क्या हमारे आस-पास के पदार्थ शुद्ध हैं', 'परमाणु एवं अणु', 'परमाणु की संरचना', 'जीवन की मौलिक इकाई', 'ऊतक', 'जीवों में विविधता', 'गति', 'बल तथा गति के नियम', 'गुरुत्वाकर्षण', 'कार्य तथा ऊर्जा', 'ध्वनि', 'हम बीमार क्यों होते हैं', 'प्राकृतिक संपदा', 'खाद्य संसाधनों में सुधार'],
        'Mathematics': ['समुच्चय', 'संबंध एवं फलन', 'त्रिकोणमितीय फलन', 'गणितीय आगमन का सिद्धांत', 'सम्मिश्र संख्याएँ', 'रैखिक असमिकाएँ', 'क्रमचय और संचय', 'द्विपद प्रमेय', 'अनुक्रम तथा श्रेणी', 'सरल रेखाएँ', 'शंकु परिच्छेद', 'त्रिविमीय ज्यामिति का परिचय', 'सीमा और अवकलज', 'गणितीय विवेचन', 'सांख्यिकी', 'प्रायिकता'],
        'History': ['फ्रांसीसी क्रांति', 'यूरोप में समाजवाद एवं रूसी क्रांति', 'नात्सीवाद और हिटलर का उदय', 'वन्य समाज और उपनिवेशवाद', 'आधुनिक विश्व में चरवाहे'],
        'Geography': ['भारत - आकार और स्थिति', 'भारत का भौतिक स्वरूप', 'अपवाह', 'जलवायु', 'प्राकृतिक वनस्पति तथा वन्य प्राणी', 'जनसंख्या'],
        'Hindi': ['दो बैलों की कथा', 'ल्हासा की ओर', 'उपभोक्तावाद की संस्कृति', 'साँवले सपनों की याद', 'नाना साहब की पुत्री देवी मैना को भस्म कर दिया गया']
    };

    let selectedData = {};
    let currentImageBase64 = null;

    window.onload = function() {
        let savedHistory = localStorage.getItem('bookChatHistory_vEngUI');
        let savedSettings = localStorage.getItem('bookSettings_vEngUI');
        if (savedHistory && savedSettings) {
            selectedData = JSON.parse(savedSettings);
            document.getElementById('wizardPage').style.display = 'none';
            document.getElementById('chatPage').style.display = 'flex';
            document.getElementById('settingsBtn').style.display = 'block';
            document.getElementById('chatHistory').innerHTML = savedHistory;
            scrollToBottom();
        }
    };

    function nextStep(step) {
        if(step === 2 && !document.getElementById('publisherSelect').value) return alert("Please select a Publisher!");
        if(step === 3 && !document.getElementById('classSelect').value) return alert("Please select a Class!");
        if(step === 4 && !document.getElementById('subjectSelect').value) return alert("Please select a Subject!");
        
        document.querySelectorAll('.step-card').forEach(el => el.classList.remove('active'));
        document.getElementById(`step-${step}`).classList.add('active');

        if(step === 5) {
            let pub = document.getElementById('publisherSelect').value;
            let sub = document.getElementById('subjectSelect').value;
            let cls = document.getElementById('classSelect').value;
            let chapList = document.getElementById('chapterSelect').value;
            let chapMan = document.getElementById('manualChapter').value;
            let finalChap = chapMan ? chapMan : chapList;

            if(!finalChap) {
                nextStep(4);
                return alert("Please select or type a chapter!");
            }

            selectedData = { publisher: pub, subject: sub, class: cls, chapter: finalChap };
            document.getElementById('selectionSummary').innerHTML = 
                `<span style="color:var(--primary)">Publisher:</span> ${pub}<br>
                 <span style="color:var(--secondary)">Class:</span> ${cls}<br>
                 <span style="color:var(--accent)">Subject:</span> ${sub}<br>
                 <span style="color:#10b981">Chapter:</span> ${finalChap}`;
        }
    }

    // 🛑 DYNAMIC AI CHAPTER FETCHING 🛑
    async function triggerChapterFetch() {
        let sub = document.getElementById('subjectSelect').value;
        let cls = document.getElementById('classSelect').value;
        let chapSelect = document.getElementById('chapterSelect');
        
        if(!sub || !cls) return;

        let chapters = localChapterBanks[sub];
        
        if (chapters) {
            chapSelect.innerHTML = '<option value="" selected disabled>-- Select Chapter --</option>';
            chapters.forEach((chap, i) => { chapSelect.innerHTML += `<option value="Chapter ${i+1}: ${chap}">Chapter ${i+1}: ${chap}</option>`; });
        } else {
            chapSelect.innerHTML = '<option value="" selected disabled>-- 🤖 Fetching Chapters from AI... --</option>';
            try {
                const sysPrompt = "You are a textbook database. The user wants the standard chapter names for a specific subject and class. YOU MUST RETURN ONLY A VALID JSON ARRAY OF STRINGS containing the chapter names strictly translated to HINDI. DO NOT return markdown, backticks, or any other text. JUST THE JSON ARRAY.";
                const r = await fetch("/api/gemini-text", {
                    method: "POST", headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ systemPrompt: sysPrompt, userPrompt: `Class: ${cls}, Subject: ${sub}` })
                });
                const data = await r.json();
                let cleanJson = data.text.replace(/```json/g, '').replace(/```/g, '').trim();
                let fetchedChapters = JSON.parse(cleanJson);
                
                chapSelect.innerHTML = '<option value="" selected disabled>-- Select Chapter --</option>';
                fetchedChapters.forEach((chap, i) => { chapSelect.innerHTML += `<option value="Chapter ${i+1}: ${chap}">Chapter ${i+1}: ${chap}</option>`; });
                
                localChapterBanks[sub] = fetchedChapters; // Cache it
            } catch(e) {
                console.error("AI Fetch failed, defaulting to manual.", e);
                chapSelect.innerHTML = '<option value="" selected disabled>-- Failed to load. Please type manually below --</option>';
            }
        }
    }

    function startConversation() {
        document.getElementById('wizardPage').style.display = 'none';
        document.getElementById('chatPage').style.display = 'flex';
        document.getElementById('settingsBtn').style.display = 'block';
        
        localStorage.setItem('bookSettings_vEngUI', JSON.stringify(selectedData));

        if(document.getElementById('chatHistory').innerHTML.trim() === "") {
            addAiMessage(`Hello! I am your advanced AI tutor for **${selectedData.subject}**. \n\nWe are focusing on **${selectedData.chapter}** for **${selectedData.class}**. I will answer all your questions in English. How can I help you today?`);
        }
    }

    function openSettings() {
        document.getElementById('chatPage').style.display = 'none';
        document.getElementById('settingsBtn').style.display = 'none';
        document.getElementById('wizardPage').style.display = 'block';
        nextStep(1); 
    }

    // 🛑 CAMERA ENGINE (NATIVE HTML) 🛑
    let stream = null; let isFlashOn = false; let currentFacing = 'environment';
    
    async function openCameraUI() {
        const modal = document.getElementById('cameraModal');
        modal.classList.add('active');
        await initCam();
    }
    
    async function initCam() {
        if(stream) stream.getTracks().forEach(t => t.stop());
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacing } });
            document.getElementById('cameraVideo').srcObject = stream;
        } catch(e) { alert("Camera access failed."); closeCamera(); }
    }

    async function switchCamera() {
        currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
        isFlashOn = false;
        await initCam();
    }
    
    async function toggleFlash() {
        if(!stream) return;
        const track = stream.getVideoTracks()[0];
        try {
            if(track.getCapabilities().torch) {
                isFlashOn = !isFlashOn;
                await track.applyConstraints({ advanced: [{ torch: isFlashOn }] });
                document.getElementById('toggleFlashBtn').innerText = isFlashOn ? "💡" : "🔦";
            }
        } catch(e) {}
    }

    function capturePhoto() {
        const v = document.getElementById('cameraVideo');
        const c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        currentImageBase64 = c.toDataURL('image/jpeg');
        document.getElementById('imgChip').src = currentImageBase64;
        document.getElementById('imagePreviewContainer').style.display = 'block';
        closeCamera();
    }

    function closeCamera() {
        document.getElementById('cameraModal').classList.remove('active');
        if(stream) {
            const track = stream.getVideoTracks()[0];
            try { if(track.getCapabilities().torch) track.applyConstraints({ advanced: [{ torch: false }] }); } catch(e){}
            stream.getTracks().forEach(t => t.stop());
        }
    }

    function handleImageSelect(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            currentImageBase64 = e.target.result;
            document.getElementById('imagePreviewContainer').style.display = 'block';
            document.getElementById('imgChip').src = currentImageBase64;
        };
        reader.readAsDataURL(file);
    }
    
    function removeImage() {
        currentImageBase64 = null;
        document.getElementById('imagePreviewContainer').style.display = 'none';
        document.getElementById('imageInput').value = '';
    }

    function handleEnter(e) {
        if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function scrollToBottom() {
        const chatHist = document.getElementById('chatHistory');
        chatHist.scrollTop = chatHist.scrollHeight;
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text);
        let t = document.createElement('div'); t.innerText = "✅ Copied!";
        t.style.cssText = "position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--primary); color:white; padding:10px 20px; border-radius:20px; z-index:99999;";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2000);
    }

    // 🛑 SEND MESSAGE TO AI 🛑
    async function sendMessage() {
        const inputEl = document.getElementById('chatInput');
        const text = inputEl.value.trim();
        const img = currentImageBase64;

        if(!text && !img) return;

        // User Message UI
        const msgDiv = document.createElement("div");
        msgDiv.className = "chat-msg chat-user";
        let imgHtml = img ? `<img src="${img}" class="bubble-img"><br>` : "";
        let escapedText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
        
        msgDiv.innerHTML = `
            <div class="bubble">
                ${imgHtml}${escapedText}
                <button onclick="copyToClipboard('${text.replace(/'/g, "\\'")}')" style="position:absolute; top:-10px; right:-10px; background:var(--primary); color:white; border:2px solid var(--bg-surface); border-radius:50%; width:28px; height:28px; font-size:12px; cursor:pointer;">📋</button>
            </div>`;
        document.getElementById('chatHistory').appendChild(msgDiv);
        scrollToBottom();

        inputEl.value = "";
        removeImage(); 

        // AI Typing Indicator
        const loadingId = "load_" + Date.now();
        const loadDiv = document.createElement("div");
        loadDiv.className = "chat-msg chat-ai";
        loadDiv.id = loadingId;
        loadDiv.innerHTML = `<div class="bubble"><div style="display:flex; gap:6px; padding:5px;"><div style="width:10px; height:10px; background:var(--primary); border-radius:50%; animation:pulse 1s infinite;"></div><div style="width:10px; height:10px; background:var(--accent); border-radius:50%; animation:pulse 1s infinite 0.2s;"></div><div style="width:10px; height:10px; background:var(--secondary); border-radius:50%; animation:pulse 1s infinite 0.4s;"></div></div></div>`;
        document.getElementById('chatHistory').appendChild(loadDiv);
        scrollToBottom();

        // 🛑 AI RESPONSES STRICTLY IN ENGLISH 🛑
        const sysPrompt = `You are a premium AI expert educational tutor. STRICT RULES:
1. ALWAYS respond entirely in ENGLISH. Do not use Hindi for the explanation.
2. Structure your answers logically. Use **bolding** for important words.
3. NEVER write everything on a single line. ALWAYS add double spacing (\\n\\n) between paragraphs, points, or lists to ensure readability.
4. If there is math, USE LaTeX formats (e.g. $$ \\frac{a}{b} $$ or $x^2$).
Context: You are teaching ${selectedData.class}, ${selectedData.subject}, Chapter: "${selectedData.chapter}" from the publisher ${selectedData.publisher}. Provide highly accurate, educational answers based on this context.`;

        const payload = img ? 
            { imageBase64: img, userPrompt: text || "Analyze this context.", systemPrompt: sysPrompt } : 
            { userPrompt: text, systemPrompt: sysPrompt };
        
        const endpoint = img ? "/api/gemini-vision" : "/api/gemini-text";

        try {
            const r = await fetch(endpoint, {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify(payload)
            });
            const data = await r.json();
            
            if(!r.ok) throw new Error(data.error || "Server Connection Failed.");

            document.getElementById(loadingId).remove();
            addAiMessage(data.text || data.choices?.[0]?.message?.content, true);

        } catch(err) {
            document.getElementById(loadingId).querySelector('.bubble').innerHTML = "❌ <b style='color:#ef4444;'>Error:</b> " + err.message;
            saveHistory();
        }
    }

    // 🛑 TYPEWRITER EXACTLY 5 SECONDS 🛑
    async function addAiMessage(text, typewrite = false) {
        const msgDiv = document.createElement("div");
        msgDiv.className = "chat-msg chat-ai";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        msgDiv.appendChild(bubble);
        document.getElementById('chatHistory').appendChild(msgDiv);

        let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        let rawCleanText = text.replace(/'/g, "\\'").replace(/\n/g, " ");

        if(typewrite) {
            const duration = 5000;
            const tickRate = Math.max(5, duration / (formattedText.length || 1));
            
            for (let i = 0; i < formattedText.length; i++) {
                let char = formattedText[i];
                if(char === '<') {
                    let end = formattedText.indexOf('>', i);
                    if(end !== -1) {
                        bubble.innerHTML += formattedText.substring(i, end + 1);
                        i = end;
                    } else { bubble.innerHTML += char; }
                } else if (char === '\n') {
                    bubble.innerHTML += '<br>';
                } else {
                    bubble.innerHTML += char;
                }
                
                if (i % 8 === 0) scrollToBottom();
                await new Promise(r => setTimeout(r, tickRate));
            }
        } else {
            bubble.innerHTML = formattedText.replace(/\n/g, '<br>');
        }

        if(window.MathJax) { MathJax.typesetClear([bubble]); MathJax.typesetPromise([bubble]); }
        
        // Add Copy Button to AI Message
        bubble.innerHTML += `<button onclick="copyToClipboard('${rawCleanText}')" style="position:absolute; top:-10px; right:-10px; background:var(--bg-surface); color:var(--primary); border:2px solid var(--primary); border-radius:50%; width:28px; height:28px; font-size:12px; cursor:pointer;">📋</button>`;
        
        saveHistory();
        scrollToBottom();
    }

    function saveHistory() {
        const histHTML = document.getElementById('chatHistory').innerHTML;
        localStorage.setItem('bookChatHistory_vEngUI', histHTML);
    }
</script>
</body>
</html>
