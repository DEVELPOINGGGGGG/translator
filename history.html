<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Suite - History</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
      MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
    </script>
    <script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <link rel="stylesheet" href="style.css">

    <script src="ui-controls.js" defer></script>

    <style>
        .infoModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .infoModal .card { background: #1e293b; width: 90%; max-width: 600px; padding: 20px; border-radius: 12px; max-height: 85vh; display: flex; flex-direction: column; }
        .hist-scroll-area { overflow-y: auto; flex-grow: 1; margin: 15px 0; padding-right: 5px; }
        .outputBox { background: #0f172a; padding: 15px; border-radius: 8px; color: #e2e8f0; font-size: 15px; border: 1px solid #334155; margin-top: 8px; white-space: pre-wrap;}
        .closeBtn { background: transparent; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
        .closeBtn:hover { color: #fff; }
        
        /* Clean list styling */
        .hist-item { background: #1e293b; border-radius: 8px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .hist-title { font-weight: 600; color: #e2e8f0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .hist-date { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        .btn-group-sm { display: flex; gap: 8px; flex-shrink: 0; }
    </style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="topbar">
  <div class="menuBtn" onclick="toggleSidebar()">☰</div>
  <div class="appTitle">AI Pro Suite</div>
</div>

<div class="sidebar" id="sidebar">
  <button onclick="window.location.href='index.html'">🏠 Dashboard</button>
  <button onclick="window.location.href='maths.html'">🧮 Math Solver (Gemini)</button>
  <button onclick="window.location.href='search.html'">🔎 Deep Search (Groq)</button>
  <button onclick="window.location.href='translator.html'">🎙️ Text Translator</button>
  <button onclick="window.location.href='image.html'">🖼️ Image Translator</button>
  <button onclick="window.location.href='create.html'">🎨 Image Creator</button>
  <button onclick="window.location.href='qa.html'">📚 Document Q&A</button>
  <button onclick="window.location.href='history.html'" style="border-left: 4px solid #3b82f6; color: #60a5fa; background: #111827;">🕒 History & Downloads</button>
</div>

<div class="page active" id="historyPage">
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div class="cardTitle" style="font-size: 22px; margin-bottom: 0;">🕒 Saved History</div>
      <button class="btn red" style="width: auto; padding: 8px 15px; margin-top: 0; font-size: 13px; background: #ef4444; color: white; border:none; border-radius: 6px; cursor:pointer;" onclick="clearAllHistory()">🗑️ Clear All</button>
    </div>
    
    <div id="historyList" style="margin-top: 20px;"></div>
  </div>
</div>

<div class="infoModal" id="historyModal">
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div class="cardTitle" id="histTitle" style="font-size: 20px; color: #60a5fa; margin: 0; font-weight: bold;">Title</div>
      <button class="closeBtn" onclick="closeHistory()">✕</button>
    </div>
    
    <div class="hist-scroll-area">
        <img id="histImage" src="" style="display: none; width: 100%; max-width: 300px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; object-fit: contain;">

        <div class="cardSub" style="color: #94a3b8; font-size: 14px; font-weight: 600;">Original Request:</div>
        <div class="outputBox" id="histQuestion"></div>
        
        <div class="cardSub" style="color: #94a3b8; font-size: 14px; font-weight: 600; margin-top: 15px;">Solution:</div>
        <div class="outputBox" id="histAnswer" style="font-family: 'Inter', sans-serif; font-size: 17px; color: #60a5fa;"></div>
    </div>
    
    <div class="hist-footer" style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn green" style="background: #10b981; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; flex: 1;" onclick="speakText('histAnswer')">🔊 Speak</button>
        <button class="btn blue" style="background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; flex: 1;" onclick="downloadHistoryFile()">💾 Download Text</button>
    </div>
  </div>
</div>

<script>
    window.toggleSidebar = function() {
        const sidebar = document.getElementById('sidebar');
        sidebar.style.transform = (sidebar.style.transform === 'translateX(0px)') ? 'translateX(-100%)' : 'translateX(0px)';
    };

    window.loadHistory = function() {
        const historyList = document.getElementById("historyList");
        if (!historyList) return;
        
        let savedHistory = [];
        try { savedHistory = JSON.parse(localStorage.getItem("aiHistory")) || []; } 
        catch(e) { console.error("Failed to parse localStorage:", e); }
        
        historyList.innerHTML = "";
        
        if (savedHistory.length === 0) {
            historyList.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 30px;"><p>No history saved yet.</p></div>';
            return;
        }

        // Build cleanly with DOM
        for (let i = savedHistory.length - 1; i >= 0; i--) {
            const item = savedHistory[i];
            const imgData = item.image || item.imageBase64 || item.img || item.capturedImageBase64 || null;
            
            const itemDiv = document.createElement('div');
            itemDiv.className = "hist-item"; 
            
            const leftSide = document.createElement('div');
            leftSide.style.cssText = "display: flex; align-items: center; gap: 15px; overflow: hidden;";

            if (imgData) {
                const thumb = document.createElement('img');
                thumb.src = imgData;
                thumb.style.cssText = "width: 45px; height: 45px; object-fit: cover; border-radius: 6px; flex-shrink: 0;";
                leftSide.appendChild(thumb);
            }
            
            const textDiv = document.createElement('div');
            
            const titleEl = document.createElement('div');
            titleEl.className = "hist-title";
            titleEl.textContent = item.title || "Math Problem";
            
            const dateEl = document.createElement('div');
            dateEl.className = "hist-date";
            dateEl.textContent = item.date || new Date().toLocaleDateString();
            
            textDiv.appendChild(titleEl);
            textDiv.appendChild(dateEl);
            leftSide.appendChild(textDiv);
            
            // Buttons Wrapper
            const btnGroup = document.createElement('div');
            btnGroup.className = "btn-group-sm";

            // View Modal Button
            const viewBtn = document.createElement('button');
            viewBtn.style.cssText = "background: #475569; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600;";
            viewBtn.textContent = "View";
            viewBtn.onclick = function() {
                viewHistoryItem(item.title || "History Item", item.question || "", item.answer || "", imgData);
            };

            // Restore Button 🚀
            const restoreBtn = document.createElement('button');
            restoreBtn.style.cssText = "background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600;";
            restoreBtn.textContent = "Restore ↪";
            restoreBtn.onclick = function() {
                // Save this exact item into a temporary holding cell
                localStorage.setItem("pendingRestoreChat", JSON.stringify({
                    question: item.question || "",
                    answer: item.answer || "",
                    image: imgData
                }));
                // Redirect to Math Solver
                window.location.href = "maths.html";
            };
            
            btnGroup.appendChild(viewBtn);
            btnGroup.appendChild(restoreBtn);

            itemDiv.appendChild(leftSide);
            itemDiv.appendChild(btnGroup);
            
            historyList.appendChild(itemDiv);
        }
    };

    window.viewHistoryItem = function(title, question, answer, imgData) {
        document.getElementById("histTitle").innerText = title;
        document.getElementById("histQuestion").innerHTML = question.replace(/\n/g, '<br>');
        document.getElementById("histAnswer").innerHTML = answer.replace(/\n/g, '<br>');
        
        const imgEl = document.getElementById("histImage");
        if (imgData) { imgEl.src = imgData; imgEl.style.display = "block"; } 
        else { imgEl.src = ""; imgEl.style.display = "none"; }

        document.getElementById("historyModal").style.display = "flex";
        if (window.MathJax) { MathJax.typesetPromise([document.getElementById('histAnswer')]).catch(e => console.log(e)); }
    };

    window.closeHistory = function() { document.getElementById("historyModal").style.display = "none"; };
    
    window.clearAllHistory = function() {
        if(confirm("Are you sure you want to delete all saved history?")) {
            localStorage.removeItem("aiHistory");
            loadHistory();
        }
    };

    window.downloadHistoryFile = function() {
        const title = document.getElementById("histTitle").innerText;
        const q = document.getElementById("histQuestion").innerText;
        const a = document.getElementById("histAnswer").innerText;
        const fileContent = "--- " + title + " ---\n\nQUESTION:\n" + q + "\n\nSOLUTION:\n" + a + "\n\nGenerated by AI Pro Suite";
        const blob = new Blob([fileContent], { type: 'text/plain' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = "history_export.txt";
        link.click();
    };

    window.speakText = function(elementId) {
        const textToRead = document.getElementById(elementId).innerText;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = 'hi-IN';
            window.speechSynthesis.speak(utterance);
        }
    };

    document.addEventListener("DOMContentLoaded", loadHistory);
</script>

</body>
</html>
