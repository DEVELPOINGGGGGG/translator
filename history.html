<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Suite - History</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
      MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
    </script>
    <script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="topbar">
  <div class="menuBtn" onclick="toggleSidebarEngine()">☰</div>
  <div class="appTitle">AI Pro Suite</div>
</div>

<div class="apiTracker">
    <div>⏱️ Reset: <span id="apiTimer" class="api-val timer">60s</span></div>
    <div>🖼️ Vis: <span id="apiVision" class="api-val vision">0</span>/20</div>
    <div>📝 Txt: <span id="apiText" class="api-val text">0</span>/20</div>
</div>

<div class="sidebar" id="sidebar">
  <button class="sidebar-close-btn" onclick="toggleSidebarEngine()">✖ Close Menu</button>
  <button onclick="window.location.href='index.html'">🏠 Dashboard</button>
  <button onclick="window.location.href='maths.html'">🧮 Math Solver</button>
  <button onclick="window.location.href='search.html'">🔎 Deep Search</button>
  <button onclick="window.location.href='translator.html'">🎙️ Text Translator</button>
  <button onclick="window.location.href='image.html'">🖼️ Image Translator</button>
  <button onclick="window.location.href='create.html'">🎨 Image Creator</button>
  <button onclick="window.location.href='qa.html'">📚 Document Q&A</button>
  <button onclick="window.location.href='history.html'" style="border-left: 4px solid var(--primary); color: var(--primary); background: var(--border-light);">🕒 History & Downloads</button>
</div>

<div class="page active" id="historyPage">
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <div class="cardTitle" style="font-size: 22px; margin-bottom: 0;">🕒 Saved History</div>
      <button class="btn red" style="width: auto; padding: 8px 15px; margin-top: 0; font-size: 13px;" onclick="clearAllHistoryEngine()">🗑️ Clear All</button>
    </div>
    
    <div id="historyList"></div>
  </div>
</div>

<div class="infoModal" id="historyModal">
  <div class="card" style="display: flex; flex-direction: column; max-height: 90vh; text-align: left; position: relative;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); padding-bottom: 15px; margin-bottom: 15px;">
      <div class="cardTitle" id="histTitle" style="font-size: 20px; color: var(--primary); margin: 0;">Title</div>
      <button class="closeBtn" onclick="closeHistoryEngine()" style="position: static; flex-shrink: 0; width: 40px; height: 40px; font-size: 16px; background: #ef4444; border-radius: 50%; color: white; display: grid; place-items: center; border: none; cursor: pointer;">✕</button>
    </div>
    
    <div style="flex: 1; overflow-y: auto; padding-right: 5px;">
        <div style="color: var(--text-muted); font-weight: 700; margin-bottom: 5px; font-size: 13px;">Original Request:</div>
        <div class="outputBox" id="histQuestion" style="margin-top: 0; margin-bottom: 20px; padding: 12px; background: var(--input-bg); border-radius: 12px;"></div>
        
        <div style="color: var(--text-muted); font-weight: 700; margin-bottom: 5px; font-size: 13px;">Response / Output:</div>
        <div class="outputBox" id="histAnswer" style="margin-top: 0; padding: 12px; background: var(--input-bg); border-radius: 12px;"></div>
    </div>
    
    <div id="histFooter" style="margin-top: 15px; border-top: 1px solid var(--border-light); padding-top: 15px;"></div>
  </div>
</div>

<script>
    let localHistoryArray = [];

    // Initialize Database Connections on Startup Loading Events
    document.addEventListener('DOMContentLoaded', () => {
        initializeDatabaseEngine();
        runClockTracker();
    });

    // 1. Sidebar Menu Layout Toggles Handler
    function toggleSidebarEngine() {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        if (!sidebar || !overlay) return;
        const active = !sidebar.classList.contains("active");
        sidebar.classList.toggle("active", active);
        overlay.classList.toggle("active", active);
    }
    document.getElementById("overlay").onclick = toggleSidebarEngine;

    // 2. LocalForage + LocalStorage Safe Sync Framework Loader
    function initializeDatabaseEngine() {
        if (typeof localforage !== 'undefined') {
            localforage.config({ name: 'AI_Pro_Suite', storeName: 'massive_chat_history' });
            localforage.getItem('aiHistory').then(savedData => {
                localHistoryArray = savedData ? savedData : [];
                // Fallback layer to grab older local storage indexes if array returns clear
                if (localHistoryArray.length === 0) {
                    try { localHistoryArray = JSON.parse(localStorage.getItem('aiHistory') || '[]'); } catch(e) {}
                }
                renderHistoryCards();
            }).catch(() => {
                fallbackToLocalStorageEngine();
            });
        } else {
            fallbackToLocalStorageEngine();
        }
    }

    function fallbackToLocalStorageEngine() {
        try { localHistoryArray = JSON.parse(localStorage.getItem('aiHistory') || '[]'); } catch(e) { localHistoryArray = []; }
        renderHistoryCards();
    }

    // 3. Render High Decoration Glass Cards Inside the History Stack
    function renderHistoryCards() {
        const list = document.getElementById("historyList");
        if (!list) return;

        if (localHistoryArray.length === 0) {
            list.innerHTML = "<div style='text-align:center; padding:30px; font-weight:600; color:var(--text-muted);'>No saved elements found in memory database.</div>";
            return;
        }

        let html = "";
        localHistoryArray.forEach(item => {
            let icon = "📝";
            if(item.type === 'math') icon = "🧮";
            if(item.type === 'search') icon = "🔍";
            if(item.type === 'youtube') icon = "🎬";
            if(item.type === 'create') icon = "🎨";
            if(item.type === 'translation') icon = "🌍";
            if(item.type === 'image_translation') icon = "🖼️";
            if(item.type === 'qa') icon = "📚";
            if(item.type === 'quiz') icon = "🏆";

            html += `
            <div onclick="openSmartHistoryModal(${item.id})" class="history-item-card" style="background: linear-gradient(145deg, var(--bg-surface), var(--input-bg)) !important; border: 1px solid var(--border-light) !important; border-left: 8px solid var(--primary) !important; border-radius: 20px !important; padding: 24px !important; margin-bottom: 15px !important; box-shadow: var(--glass-shadow) !important; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important; position: relative; cursor: pointer;">
                <strong style="color: var(--text-main) !important; font-size: 20px !important; font-weight: 900 !important; display: block !important; margin-bottom: 8px !important;">${icon} ${item.title || item.type.toUpperCase()}</strong>
                <span style="display: inline-block !important; background: var(--border-light) !important; color: var(--text-muted) !important; padding: 6px 12px !important; border-radius: 12px !important; font-size: 12px !important; font-weight: 700 !important;">📅 Logged: ${new Date(item.id).toLocaleString()}</span>
            </div>`;
        });
        list.innerHTML = html;
    }

    // 4. GUI Viewer Engine - Handles Strings, Custom Arrays, and Nested Objects Dynamically
    window.openSmartHistoryModal = function(id) {
        let item = localHistoryArray.find(i => i.id === id);
        if (!item) return;

        document.getElementById('histTitle').innerText = item.title || "Saved Configuration Log";
        
        let q = item.question || "";
        let a = item.answer || "";
        let imgHtml = "";

        // Unpack nested conversation sequences if saved under multi-turn system keys
        if (item.interactions && item.interactions.length > 0) {
            let last = item.interactions[item.interactions.length - 1];
            if (!q) q = last.question || "No prompt parameters recorded.";
            if (!a) a = last.answer || "No text payload generated.";
            if (last.image) {
                imgHtml = `<br><img src="${last.image}" style="max-width:100%; border-radius:12px; margin-top:15px; border: 2px solid var(--border-light); box-shadow: var(--glass-shadow);">`;
            }
        }
        if(item.image && !imgHtml) {
            imgHtml = `<br><img src="${item.image}" style="max-width:100%; border-radius:12px; margin-top:15px; border: 2px solid var(--border-light); box-shadow: var(--glass-shadow);">`;
        }

        document.getElementById('histQuestion').innerHTML = q + imgHtml;
        document.getElementById('histAnswer').innerHTML = a;

        // Force-Inject clean action button parameters into the footer frame views
        document.getElementById('histFooter').innerHTML = `
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn blue" style="flex: 1; padding: 12px; font-size: 14px; min-width: 100px;" onclick="triggerSessionRestoreEngine('${item.type}', ${item.id})">🚀 Restore</button>
                <button class="btn green" style="flex: 1; padding: 12px; font-size: 14px; min-width: 100px;" onclick="speakOutputTextEngine()">🔊 Speak</button>
                <button class="btn red" style="flex: 1; padding: 12px; font-size: 14px; min-width: 100px;" onclick="deleteSingleItemEngine(${item.id})">🗑️ Delete</button>
            </div>
        `;

        document.getElementById('historyModal').classList.add('active');
        
        if (window.MathJax) {
            MathJax.typesetPromise([document.getElementById('histQuestion'), document.getElementById('histAnswer')]).catch(e => console.log(e));
        }
    };

    // 5. THE bulletproof RESTORATION AND REDIRECTION ROUTING ENGINE
    window.triggerSessionRestoreEngine = function(type, id) {
        const subRoutes = {
            'math': 'maths.html',
            'search': 'search.html',
            'youtube': 'youtube.html',
            'create': 'create.html',
            'translation': 'translator.html',
            'image_translation': 'image.html',
            'qa': 'qa.html',
            'quiz': 'quiz.html'
        };
        const destFile = subRoutes[type] || 'index.html';
        
        // Save an emergency runtime variable pointer inside the local storage cache
        localStorage.setItem('activeRestoreIdPointer', id);
        
        // Pass via search string query configurations to wake up module event loops
        window.location.href = `${destFile}?restore=${id}`;
    };

    // 6. Text To Speech Speech Engine
    window.speakOutputTextEngine = function() {
        let cleanText = document.getElementById('histAnswer').innerText;
        window.speechSynthesis.cancel(); // Terminate existing processes
        let utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'hi-IN'; // Default speech profile parameters
        window.speechSynthesis.speak(utterance);
    };

    // 7. Delete Operations Processing Loops
    window.deleteSingleItemEngine = function(id) {
        if (confirm("Permanently wipe this configuration log item from database vaults?")) {
            localHistoryArray = localHistoryArray.filter(i => i.id !== id);
            
            // Push arrays back to localforage vaults and localstorage keys concurrently
            if (typeof localforage !== 'undefined') {
                localforage.setItem('aiHistory', localHistoryArray);
            }
            localStorage.setItem('aiHistory', JSON.stringify(localHistoryArray));
            
            closeHistoryEngine();
            renderHistoryCards();
        }
    };

    window.clearAllHistoryEngine = function() {
        if (confirm("Are you absolutely sure you want to completely wipe out ALL storage history data logs? This cannot be undone!")) {
            localHistoryArray = [];
            if (typeof localforage !== 'undefined') { localforage.setItem('aiHistory', []); }
            localStorage.setItem('aiHistory', '[]');
            renderHistoryCards();
        }
    };

    window.closeHistoryEngine = function() {
        document.getElementById('historyModal').classList.remove('active');
        window.speechSynthesis.cancel();
    };

    // 8. Background Clock Synchronization Thread loops
    function runClockTracker() {
        setInterval(() => {
            const now = new Date();
            const ptTimeStr = now.toLocaleString("en-US", { timeZone: "America/Los_Angeles" });
            const ptTime = new Date(ptTimeStr);
            const midNode = new Date(ptTime);
            midNode.setHours(24, 0, 0, 0);
            
            let delta = midNode - ptTime;
            let hr = Math.floor(delta / (1000 * 60 * 60));
            let mn = Math.floor((delta % (1000 * 60 * 60)) / (1000 * 60));
            let sc = Math.floor((delta % (1000 * 60)) / 1000);
            
            const renderStr = num => num.toString().padStart(2, '0');
            const el = document.getElementById('apiTimer');
            if (el) el.innerText = `${renderStr(hr)}h ${renderStr(mn)}m ${renderStr(sc)}s`;
        }, 1000);
    }
</script>

</body>
</html>
