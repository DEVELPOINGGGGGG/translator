<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Suite - History</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
      MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
    </script>
    <script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="topbar">
  <div class="menuBtn" onclick="toggleSidebar()">☰</div>
  <div class="appTitle">AI Pro Suite</div>
</div>

<div class="apiTracker">
    <div>⏱️ Reset: <span id="apiTimer" class="api-val timer">60s</span></div>
    <div>🖼️ Vis: <span id="apiVision" class="api-val vision">0</span>/20</div>
    <div>📝 Txt: <span id="apiText" class="api-val text">0</span>/20</div>
</div>

<div id="ttsPlayer">
  <div class="ttsIndicator">🔊 Reading</div>
  <button class="ttsBtn" id="ttsPlayBtn">⏸️</button>
  <button class="ttsBtn" id="ttsStopBtn">⏹️</button>
  <button class="ttsBtn" id="ttsCloseBtn">✖️</button>
</div>

<div class="sidebar" id="sidebar">
  <button onclick="window.location.href='index.html'">🏠 Dashboard</button>
  <button onclick="window.location.href='maths.html'">🧮 Math Solver</button>
  <button onclick="window.location.href='search.html'">🔎 Deep Search</button>
  <button onclick="window.location.href='translator.html'">🎙️ Text Translator</button>
  <button onclick="window.location.href='image.html'">🖼️ Image Translator</button>
  <button onclick="window.location.href='create.html'">🎨 Image Creator</button>
  <button onclick="window.location.href='qa.html'">📚 Document Q&A</button>
  <button onclick="window.location.href='history.html'" style="border-left: 4px solid var(--primary); color: var(--primary); background: var(--border-light);">🕒 History & Downloads</button>
</div>

<div class="page active" id="historyPage">
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div class="cardTitle" style="font-size: 22px; margin-bottom: 0;">🕒 Saved History</div>
      <button class="btn red" style="width: auto; padding: 8px 15px; margin-top: 0; font-size: 13px;" onclick="clearAllHistory()">🗑️ Clear All</button>
    </div>
    
    <div id="historyList" style="margin-top: 20px;"></div>
  </div>
</div>

<div class="infoModal" id="historyModal">
  <div class="card" style="display: flex; flex-direction: column; max-height: 90vh;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); padding-bottom: 15px; margin-bottom: 15px;">
      <div class="cardTitle" id="histTitle" style="font-size: 20px; color: var(--primary); margin: 0;">Title</div>
      <button class="closeBtn" onclick="closeHistory()" style="position: static; flex-shrink: 0; width: 40px; height: 40px; font-size: 16px;">✕</button>
    </div>
    
    <div class="hist-scroll-area" style="flex: 1; overflow-y: auto; padding-right: 5px;">
        <div style="color: var(--text-muted); font-weight: 700; margin-bottom: 5px; font-size: 13px;">Original Request:</div>
        <div class="outputBox" id="histQuestion" style="margin-top: 0; margin-bottom: 20px;"></div>
        
        <div style="color: var(--text-muted); font-weight: 700; margin-bottom: 5px; font-size: 13px;">Response / Output:</div>
        <div class="outputBox" id="histAnswer" style="margin-top: 0;"></div>
    </div>
    
    <div class="hist-footer" id="histFooter" style="margin-top: 15px; border-top: 1px solid var(--border-light); padding-top: 15px;">
    </div>
  </div>
</div>

<script src="ui-controls.js" defer></script>
<script src="main.js" defer></script>

<script>
    function renderAllHistory() {
        const list = document.getElementById("historyList");
        if (!list) return;

        let historyData = [];
        try { historyData = JSON.parse(localStorage.getItem('aiHistory') || '[]'); } catch(e) {}

        if (historyData.length === 0) {
            list.innerHTML = "<div style='text-align:center; padding:30px; font-weight:600; color:var(--text-muted);'>No history saved yet.</div>";
            return;
        }

        let html = "";
        historyData.forEach(item => {
            let icon = "📝";
            if(item.type === 'math') icon = "🧮";
            if(item.type === 'search') icon = "🔍";
            if(item.type === 'youtube') icon = "🎬";
            if(item.type === 'create') icon = "🎨";
            if(item.type === 'translate') icon = "🌍";
            if(item.type === 'qa') icon = "📚";
            if(item.type === 'quiz') icon = "🏆";

            html += `
            <div onclick="viewSmartHistory(${item.id})" style="background: var(--input-bg); border: 1px solid var(--border-light); border-left: 5px solid var(--primary); border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: var(--glass-shadow); transition: transform 0.2s; cursor: pointer; position: relative;">
                <strong style="color: var(--primary); font-size: 18px; font-weight: 900; display: block; margin-bottom: 5px; padding-right: 40px;">${icon} ${item.title || item.type.toUpperCase()}</strong>
                <span style="color: var(--text-muted); font-size: 13px; display:block;">💾 Saved: ${new Date(item.id).toLocaleString()}</span>
                <button onclick="event.stopPropagation(); deleteSmartHistory(${item.id})" class="btn red" style="position: absolute; right: 15px; top: 15px; padding: 8px 12px; font-size: 14px; border-radius: 10px; margin:0; width:auto; box-shadow: none;">🗑️</button>
            </div>`;
        });
        list.innerHTML = html;
    }

    window.viewSmartHistory = function(id) {
        let historyData = JSON.parse(localStorage.getItem('aiHistory') || '[]');
        let item = historyData.find(i => i.id === id);
        if (!item) return;

        document.getElementById('histTitle').innerText = item.title || "Saved Log";
        
        let q = item.question || "";
        let a = item.answer || "";
        let imgHtml = "";

        if (item.interactions && item.interactions.length > 0) {
            let last = item.interactions[item.interactions.length - 1];
            if (!q) q = last.question || "No prompt recorded.";
            if (!a) a = last.answer || "No response recorded.";
            if (last.image) {
                imgHtml = `<br><img src="${last.image}" style="max-width:100%; border-radius:12px; margin-top:15px; border: 2px solid var(--border-light); box-shadow: var(--glass-shadow);">`;
            }
        }

        document.getElementById('histQuestion').innerHTML = q + imgHtml;
        document.getElementById('histAnswer').innerHTML = a;

        // INJECT BUTTONS WITH ID PASSING
        document.getElementById('histFooter').innerHTML = `
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn blue" style="flex: 1; padding: 12px; font-size: 14px; min-width: 100px;" onclick="restoreApp('${item.type}', ${item.id})">🚀 Restore</button>
                <button class="btn green" style="flex: 1; padding: 12px; font-size: 14px; min-width: 100px;" onclick="speakHistoryText()">🔊 Speak</button>
                <button class="btn red" style="flex: 1; padding: 12px; font-size: 14px; min-width: 100px;" onclick="deleteAndCloseHistory(${item.id})">🗑️ Delete</button>
            </div>
        `;

        document.getElementById('historyModal').classList.add('active');
        
        if (window.MathJax) {
            MathJax.typesetPromise([document.getElementById('histQuestion'), document.getElementById('histAnswer')]).catch(e => console.log("MathJax Error:", e));
        }
    };

    window.restoreApp = function(type, id) {
        const routes = {
            'math': 'maths.html',
            'search': 'search.html',
            'youtube': 'youtube.html',
            'create': 'create.html',
            'translate': 'translator.html',
            'qa': 'qa.html',
            'quiz': 'quiz.html'
        };
        const url = routes[type] || 'index.html';
        window.location.href = `${url}?restoreId=${id}`; 
    };

    window.speakHistoryText = function() {
        let text = document.getElementById('histAnswer').innerText;
        let utterance = new SpeechSynthesisUtterance(text);
        speechSynthesis.speak(utterance);
    };

    window.deleteSmartHistory = function(id) {
        if(confirm("Delete this saved item?")) {
            let historyData = JSON.parse(localStorage.getItem('aiHistory') || '[]');
            historyData = historyData.filter(i => i.id !== id);
            localStorage.setItem('aiHistory', JSON.stringify(historyData));
            renderAllHistory(); 
        }
    };

    window.deleteAndCloseHistory = function(id) {
        window.deleteSmartHistory(id);
        closeHistory();
    };

    window.closeHistory = function() { 
        document.getElementById('historyModal').classList.remove('active'); 
        window.speechSynthesis.cancel(); 
    };

    window.clearAllHistory = function() {
        if(confirm("Are you sure you want to clear ALL history? This cannot be undone.")) {
            localStorage.setItem('aiHistory', '[]');
            renderAllHistory(); 
        }
    };

    document.addEventListener('DOMContentLoaded', renderAllHistory);
</script>

</body>
</html>
