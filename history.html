<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Suite - History</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script>
      MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
    </script>
    <script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="topbar">
  <div class="menuBtn" onclick="toggleSidebar()">☰</div>
  <div class="appTitle">AI Pro Suite</div>
</div>
<div class="apiTracker">
    <div>⏱️ Reset: <span id="apiTimer" class="api-val timer">60s</span></div>
    <div>🖼️ Vis: <span id="apiVision" class="api-val vision">0</span>/20</div>
    <div>📝 Txt: <span id="apiText" class="api-val text">0</span>/20</div>
</div>

<div id="ttsPlayer">
  <div class="ttsIndicator">🔊 Reading</div>
  <button class="ttsBtn" id="ttsPlayBtn">⏸️</button>
  <button class="ttsBtn" id="ttsStopBtn">⏹️</button>
  <button class="ttsBtn" id="ttsCloseBtn">✖️</button>
</div>

<div class="sidebar" id="sidebar">
  <button onclick="window.location.href='index.html'">🏠 Dashboard</button>
  <button onclick="window.location.href='maths.html'">🧮 Math Solver (Gemini)</button>
  <button onclick="window.location.href='search.html'">🔎 Deep Search (Groq)</button>
  <button onclick="window.location.href='translator.html'">🎙️ Text Translator</button>
  <button onclick="window.location.href='image.html'">🖼️ Image Translator</button>
  <button onclick="window.location.href='create.html'">🎨 Image Creator</button>
  <button onclick="window.location.href='qa.html'">📚 Document Q&A</button>
  <button onclick="window.location.href='history.html'" style="border-left: 4px solid #3b82f6; color: #60a5fa; background: #111827;">🕒 History & Downloads</button>
</div>

<div class="page active" id="historyPage">
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div class="cardTitle" style="font-size: 22px; margin-bottom: 0;">🕒 Saved History</div>
      <button class="btn red" style="width: auto; padding: 8px 15px; margin-top: 0; font-size: 13px;" onclick="clearAllHistory()">🗑️ Clear All</button>
    </div>
    
    <div id="historyList" style="margin-top: 15px;"></div>
  </div>
</div>

<div class="infoModal" id="historyModal">
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div class="cardTitle" id="histTitle" style="font-size: 20px; color: #60a5fa; margin: 0;">Title</div>
      <button class="closeBtn" onclick="closeHistory()" style="position: static; flex-shrink: 0;">✕</button>
    </div>
    <div class="hist-scroll-area">
        <div class="cardSub" style="margin-top: 5px;">Original Request:</div>
        <div class="outputBox" id="histQuestion"></div>
        <div class="cardSub" style="margin-top: 15px;">Solution:</div>
        <div class="outputBox" id="histAnswer"></div>
    </div>
    <div class="hist-footer">
        <div class="btn-group" style="margin-top: 0;">
            <button class="btn green" onclick="speakText('histAnswer')">🔊 Speak</button>
            <button class="btn blue" onclick="downloadHistoryFile()">💾 Download Text</button>
        </div>
    </div>
  </div>
</div>

<script src="ui-controls.js" defer></script>
<script src="main.js" defer></script>
<!-- 🚀 UNIVERSAL SMART HISTORY ENGINE (OVERRIDES MAIN.JS) 🚀 -->
<script>
    function renderAllHistory() {
        const list = document.getElementById("historyList");
        if (!list) return;

        let historyData = [];
        try { historyData = JSON.parse(localStorage.getItem('aiHistory') || '[]'); } catch(e) {}

        if (historyData.length === 0) {
            list.innerHTML = "<div style='text-align:center; padding:30px; font-weight:600; color:var(--text-muted);'>No history saved yet.</div>";
            return;
        }

        let html = "";
        historyData.forEach(item => {
            // Assign the correct icon based on the app
            let icon = "📝";
            if(item.type === 'math') icon = "🧮";
            if(item.type === 'search') icon = "🔍";
            if(item.type === 'youtube') icon = "🎬";
            if(item.type === 'create') icon = "🎨";
            if(item.type === 'translate') icon = "🌍";
            if(item.type === 'qa') icon = "📚";
            if(item.type === 'quiz') icon = "🏆";

            html += `
            <div style="background: var(--input-bg); border: 1px solid var(--border-light); border-left: 5px solid var(--primary); border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: var(--glass-shadow); transition: transform 0.3s;">
                <strong style="color: var(--primary); font-size: 18px; font-weight: 900; display: block; margin-bottom: 5px;">${icon} ${item.title || item.type.toUpperCase()}</strong>
                <span style="color: var(--text-muted); font-size: 13px; display:block; margin-bottom:15px;">💾 Saved: ${new Date(item.id).toLocaleString()}</span>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button onclick="viewSmartHistory(${item.id})" class="btn blue" style="padding: 8px 18px; font-size: 13px; border-radius: 10px; margin:0; width:auto; text-transform:none; letter-spacing:0;">👁️ View</button>
                    <button onclick="deleteSmartHistory(${item.id})" class="btn red" style="padding: 8px 18px; font-size: 13px; border-radius: 10px; margin:0; width:auto; text-transform:none; letter-spacing:0;">🗑️ Delete</button>
                </div>
            </div>`;
        });
        list.innerHTML = html;
    }

    // Smart Viewer that handles Images, HTML, and Text dynamically
    window.viewSmartHistory = function(id) {
        let historyData = JSON.parse(localStorage.getItem('aiHistory') || '[]');
        let item = historyData.find(i => i.id === id);
        if (!item) return;

        document.getElementById('histTitle').innerText = item.title || "Saved Log";
        
        let q = item.question || "";
        let a = item.answer || "";
        let imgHtml = "";

        // Safely extract data if it is buried inside the "interactions" array (Create, Quiz, YouTube use this)
        if (item.interactions && item.interactions.length > 0) {
            let last = item.interactions[item.interactions.length - 1];
            if (!q) q = last.question || "No prompt recorded.";
            if (!a) a = last.answer || "No response recorded.";
            if (last.image) {
                imgHtml = `<br><img src="${last.image}" style="max-width:100%; border-radius:12px; margin-top:15px; border: 2px solid var(--border-light); box-shadow: var(--glass-shadow);">`;
            }
        }

        // Inject the content into the modal
        document.getElementById('histQuestion').innerHTML = q + imgHtml;
        document.getElementById('histAnswer').innerHTML = a;

        document.getElementById('historyModal').classList.add('active');
        
        // Re-render LaTeX math formulas if they exist
        if (window.MathJax) {
            MathJax.typesetPromise([document.getElementById('histQuestion'), document.getElementById('histAnswer')]).catch(e => console.log("MathJax Error:", e));
        }
    };

    // Fix the Close Button
    window.closeHistory = function() { 
        document.getElementById('historyModal').classList.remove('active'); 
    };

    // Fix the Delete Button
    window.deleteSmartHistory = function(id) {
        if(confirm("Delete this saved item?")) {
            let historyData = JSON.parse(localStorage.getItem('aiHistory') || '[]');
            historyData = historyData.filter(i => i.id !== id);
            localStorage.setItem('aiHistory', JSON.stringify(historyData));
            renderAllHistory(); // Instantly refresh UI
        }
    };

    // Fix the Clear All Button
    window.clearAllHistory = function() {
        if(confirm("Are you sure you want to clear ALL history? This cannot be undone.")) {
            localStorage.setItem('aiHistory', '[]');
            renderAllHistory(); // Instantly refresh UI
        }
    };

    // Force the new engine to run when the page loads
    document.addEventListener('DOMContentLoaded', renderAllHistory);
</script>
    
</body>
</html>
