<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Search - AI Pro Suite</title>
    
    <!-- Premium Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="menuBtn" onclick="window.location.href='index.html'">🔙</div>
  <div class="appTitle">Deep Search</div>
</div>

<div class="page active" style="top: 70px; max-width: 800px; margin: 0 auto;">
  
  <!-- Timer and Usage Tracker -->
  <div class="card" style="margin-bottom: 20px; text-align: center; background: var(--bg-card);">
      <div id="ptTimer" style="color: #f59e0b; font-weight: 600; font-size: 14px; margin-bottom: 8px;">⏳ PT Reset: Calculating...</div>
      <div id="geminiCount" style="color: #60a5fa; font-size: 14px; font-weight: 500;">Total Gemini Requests: Loading...</div>
  </div>

  <div class="chat-container" id="chatContainer">
      <div class="message ai">
          <strong>🔎 Deep Research Engine Ready</strong><br>
          What would you like to research today? Type your query and choose your AI model.
      </div>
  </div>

  <div class="input-area">
      <textarea id="searchPrompt" placeholder="Ask a deep research question..." rows="1" style="flex: 1; padding-top: 12px;"></textarea>
      <button class="actionBtnSmall blue" onclick="openModelChooser()" style="padding: 0 20px;">🔍 Search</button>
  </div>
</div>

<!-- 🛑 AI Model Chooser Modal 🛑 -->
<div class="modal-overlay" id="modelModal">
    <div class="modal-box">
        <h3 style="margin-top: 0; color: white;">Choose AI Engine</h3>
        <p style="font-size: 13px; color: var(--muted); margin-bottom: 20px;">Which model should perform this search?</p>
        <button class="modal-btn gemini" onclick="triggerSearch('gemini')">✨ Gemini (Google)</button>
        <button class="modal-btn groq" onclick="triggerSearch('groq')">⚡ Groq (Llama 3)</button>
        <button class="modal-btn cloudflare" onclick="triggerSearch('cloudflare')">☁️ Cloudflare</button>
        <button style="background: none; border: none; color: var(--muted); margin-top: 15px; cursor: pointer; font-weight: 600;" onclick="document.getElementById('modelModal').style.display = 'none'">Cancel</button>
    </div>
</div>

<!-- LINK TO YOUR MAIN.JS WHERE THE REAL MAGIC HAPPENS -->
<script src="main.js"></script>

<script>
    // --- 1. Timer Logic for Pacific Time Midnight Reset ---
    setInterval(() => {
        const now = new Date();
        const laTime = new Date(now.toLocaleString("en-US", { timeZone: "America/Los_Angeles" }));
        const nextMidnight = new Date(laTime); 
        nextMidnight.setHours(24, 0, 0, 0);
        
        const diff = nextMidnight - laTime;
        const h = Math.floor(diff / (1000 * 60 * 60)).toString().padStart(2, '0');
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
        const s = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
        
        document.getElementById('ptTimer').innerText = `⏳ Quota Resets in: ${h}h ${m}m ${s}s (PT)`;
    }, 1000);

    // --- 2. Fetch Live Gemini Request Count ---
    async function updateUsage() {
        try {
            const res = await fetch('/api/usage'); 
            const data = await res.json();
            let geminiTotal = 0;
            for (const [key, value] of Object.entries(data)) { 
                if (key.includes("GEMINI")) geminiTotal += value; 
            }
            document.getElementById('geminiCount').innerText = `Total Gemini Requests: ${geminiTotal}`;
        } catch (e) {
            document.getElementById('geminiCount').innerText = `Total Gemini Requests: Offline`;
        }
    }
    // Run immediately, then check every 10 seconds
    updateUsage(); 
    setInterval(updateUsage, 10000); 

    // --- 3. Handle Modal and Search Execution ---
    let currentPrompt = "";
    
    function openModelChooser() {
        const text = document.getElementById('searchPrompt').value.trim();
        if (!text) {
            alert("Bro, you need to type a question first!");
            return;
        }
        currentPrompt = text;
        document.getElementById('modelModal').style.display = 'flex';
    }

    function triggerSearch(provider) {
        // Close the modal
        document.getElementById('modelModal').style.display = 'none';
        
        // Clear the input box
        document.getElementById('searchPrompt').value = '';
        
        // Trigger the master function inside main.js
        handleDeepSearch(currentPrompt, provider);
        
        // Wait a few seconds for the API to respond, then update the usage stats
        setTimeout(updateUsage, 3000);
    }
</script>

</body>
</html>
