<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Search</title>
    
    <!-- Link to your main CSS file -->
    <link rel="stylesheet" href="style.css">
    
    <!-- PDF.js Library for reading PDFs in the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
        /* Styles for the attachment popup menu */
        .attachment-menu {
            display: none; 
            position: absolute; 
            bottom: 60px; 
            left: 10px; 
            background: #1e293b; 
            border: 1px solid #334155;
            border-radius: 12px; 
            padding: 8px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            flex-direction: column; 
            gap: 5px; 
            z-index: 100;
            min-width: 120px;
        }
        .attachment-menu.active {
            display: flex;
        }
        .attachment-menu button {
            background: transparent; 
            border: none; 
            color: #f8fafc; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            text-align: left;
            transition: background 0.2s;
        }
        .attachment-menu button:hover {
            background: #334155;
        }
        .relative-container {
            position: relative;
        }
    </style>
</head>
<body>

    <!-- Main Chat Area -->
    <div class="chat-container">
        <!-- Chat History -->
        <div id="searchChatHistory" class="chat-history">
            <!-- Messages will appear here -->
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            
            <!-- Previews for Images and PDFs -->
            <div style="display: flex; gap: 10px; margin-bottom: 5px;">
                <!-- Image Preview Chip -->
                <div class="image-preview-chip" id="mathPreviewChip" style="display:none;" onclick="viewPhotoFullscreen(this.style.backgroundImage.slice(5, -2))">
                    <div class="image-preview-close" style="position:absolute; top:-5px; right:-5px; background:#f43f5e; color:white; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-size:12px; font-weight:bold; box-shadow:0 5px 15px rgba(0,0,0,0.5); cursor:pointer;" onclick="clearMathImage(event)">✕</div>
                </div>
                
                <!-- PDF Preview Chip -->
                <div class="image-preview-chip" id="pdfPreviewChip" style="display:none; background:#1e293b; color:white; align-items:center; justify-content:center; flex-direction:column; font-size:10px; border: 2px solid #38bdf8; width: 60px; height: 60px; border-radius: 8px; position:relative;">
                    <div style="font-size:24px; margin-bottom: 2px;">📄</div>
                    <div id="pdfName" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:100%; padding:0 5px; text-align:center;">doc.pdf</div>
                    <div class="image-preview-close" style="position:absolute; top:-5px; right:-5px; background:#f43f5e; color:white; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-size:12px; font-weight:bold; box-shadow:0 5px 15px rgba(0,0,0,0.5); cursor:pointer;" onclick="clearPdfFile(event)">✕</div>
                </div>
            </div>

            <div class="chat-input-wrapper">
                
                <!-- The + Button and Popup Menu -->
                <div class="relative-container">
                    <button class="chat-action-btn" id="attachBtn" onclick="toggleAttachmentMenu()" title="Attach File">➕</button>
                    
                    <!-- Popup Menu -->
                    <div id="attachmentMenu" class="attachment-menu">
                        <button onclick="document.getElementById('pdfUploadInput').click(); toggleAttachmentMenu();">
                            📄 PDF Document
                        </button>
                        <button onclick="openCamera('search'); toggleAttachmentMenu();">
                            📸 Camera
                        </button>
                    </div>
                </div>
                
                <!-- Hidden PDF Input -->
                <input type="file" id="pdfUploadInput" accept="application/pdf" style="display: none;" onchange="handlePdfUpload(event)">
                
                <input type="hidden" id="voiceSourceLang" value="hi-IN">
                
                <!-- Text Input -->
                <textarea id="searchInput" placeholder="Search web, ask about an image, or upload a PDF..." rows="1" style="flex: 1; resize: none;"></textarea>
                
                <!-- Mic & Send Buttons -->
                <button class="chat-action-btn" id="micBtn" onclick="toggleRecording()" title="Voice Input">🎙️</button>
                <button class="chat-action-btn send" id="sendSearchBtn" onclick="runGroqSearch()" title="Send">🚀</button>
            </div>
        </div>
    </div>

    <!-- UI Scripts for Menu Toggle -->
    <script>
        // Toggles the + menu open and closed
        function toggleAttachmentMenu() {
            const menu = document.getElementById('attachmentMenu');
            menu.classList.toggle('active');
        }

        // Closes the menu if you click anywhere outside of it
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('attachmentMenu');
            const attachBtn = document.getElementById('attachBtn');
            if (menu.classList.contains('active') && !menu.contains(event.target) && !attachBtn.contains(event.target)) {
                menu.classList.remove('active');
            }
        });
    </script>

    <!-- Link to your main logic file (where your runGroqSearch and handlePdfUpload functions live) -->
    <script src="main.js"></script>

</body>
</html>
