<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Search & AI Creator</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js](https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js)"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = '[https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js](https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js)';</script>
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js](https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js)"></script>
    <script src="[https://cdn.jsdelivr.net/npm/marked/marked.min.js](https://cdn.jsdelivr.net/npm/marked/marked.min.js)"></script>
    
    <script>
        MathJax = { 
            options: {
                ignoreHtmlClass: 'code-box', // Forces MathJax to NEVER touch code
                processHtmlClass: 'markdown-body'
            },
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' },
            chtml: { displayAlign: 'left' }
        };
    </script>
    <script id="MathJax-script" async src="[https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js](https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js)"></script>

    <style>
        :root { --app-font-scale: 1; }
        
        body, .chat-msg, .bubble, .markdown-body, .markdown-body p, .markdown-body li { 
            font-size: calc(15px * var(--app-font-scale)) !important; 
        }
        
        .chat-time { font-size: 10px; color: var(--text-muted); margin-top: 5px; text-align: right; opacity: 0.7; }

        mjx-container[jax="CHTML"][display="true"] {
            overflow-x: auto !important;
            overflow-y: hidden !important;
            max-width: 100%;
            padding-bottom: 5px;
        }

        body.focus-mode .topbar { display: none !important; }
        body.focus-mode .chat-input-area { display: none !important; }
        body.focus-mode #searchChatHistory { 
            padding-top: 20px !important;
            padding-bottom: 120px !important; 
            margin-top: 0 !important; 
            height: 100vh; 
            overflow-y: auto; 
            overflow-x: hidden;
            word-wrap: break-word;
        }
        
        #exitFocusBtn { display: none; position: fixed; top: 20px; right: 20px; z-index: 100000; background: #ef4444; color: white; border: 2px solid white; border-radius: 50%; width: 45px; height: 45px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; }
        body.focus-mode #exitFocusBtn { display: flex; }

        #settingsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 100000; justify-content: center; align-items: center; }
        .settings-content { background: var(--bg-surface); border: 2px solid var(--primary); border-radius: 20px; padding: 20px; width: 90%; max-width: 400px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); animation: popIn 0.3s ease; }
        .setting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; font-size: 14px; color: var(--text-main); font-weight: 600; }
        .setting-select, .setting-input { background: var(--input-bg); border: 1px solid var(--border-light); color: var(--text-main); padding: 8px; border-radius: 8px; outline: none; font-size: 13px; width: 140px; }
        
        .font-btns { display: flex; gap: 5px; }
        .font-btn { background: var(--input-bg); border: 1px solid var(--border-light); color: var(--text-main); padding: 6px; border-radius: 6px; font-size: 11px; cursor: pointer; }
        .font-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .ai-thinking-pulse { display: flex; align-items: center; gap: 10px; }
        .pulse-orb { width: 15px; height: 15px; border-radius: 50%; background: linear-gradient(135deg, var(--secondary), var(--primary)); animation: pulseGlow 1.5s infinite; }
        @keyframes pulseGlow { 0% { transform: scale(0.9); box-shadow: 0 0 5px var(--primary); } 50% { transform: scale(1.1); box-shadow: 0 0 20px var(--primary); } 100% { transform: scale(0.9); box-shadow: 0 0 5px var(--primary); } }

        .mode-toggle-btn { background: var(--input-bg); border: 1px solid var(--border-light); color: var(--text-main); padding: 5px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .mode-toggle-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .markdown-body { line-height: 1.6; }
        .markdown-body strong { font-weight: 800; color: var(--primary); }
        .markdown-body p { margin-bottom: 10px; }
        
        .ai-signature { font-size: 10px; color: var(--primary); text-transform: uppercase; font-weight: 800; margin-bottom: 8px; letter-spacing: 0.5px; opacity: 0.9; display: flex; align-items: center; gap: 5px; }

        /* Code Containers */
        .code-box { background:#0d1117; color:#c9d1d9; border-radius:8px; margin:15px 0; border:1px solid #30363d; overflow:hidden; font-family:monospace; }
        .code-header { background:#161b22; padding:8px 15px; display:flex; justify-content:flex-end; align-items:center; border-bottom:1px solid #30363d; gap: 5px; }
        .code-body { padding:15px; overflow-x:auto; font-size:13px; white-space:pre-wrap; }
        .copy-btn { background:#21262d; border:1px solid #30363d; color:#c9d1d9; padding:5px 12px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:11px; transition: 0.2s; }
        .copy-btn:hover { background: #30363d; }
        .play-btn { background:#10b981 !important; color:white !important; border-color:#059669 !important; }

        @media (prefers-color-scheme: dark) {
            .code-box { background:#f6f8fa; color:#24292f; border-color:#d0d7de; }
            .code-header { background:#eaeef2; border-bottom:1px solid #d0d7de; }
            .copy-btn { background:#ffffff; border:1px solid #d0d7de; color:#24292f; }
            .copy-btn:hover { background: #f3f4f6; }
        }

        .bubble img { max-width: 100%; border-radius: 8px; display: block; object-fit: contain; }
        @media (min-width: 1024px) { .bubble img { max-width: 450px; } }

        .action-row { margin-top:15px; border-top:1px solid var(--border-light); padding-top:12px; display:flex; gap:10px; position:relative; align-items:center; }
        .action-btn { background:var(--input-bg); border:1px solid var(--border-light); color:var(--text-main); border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; font-weight:bold; display:flex; align-items:center; gap:4px; }
        
        .options-menu { display:none; position:absolute; bottom:40px; left:120px; background:var(--bg-surface); border:1px solid var(--border-light); border-radius:10px; box-shadow:0 5px 15px rgba(0,0,0,0.3); z-index:99; flex-direction:column; min-width:120px; overflow:hidden; }
        .options-menu button { background:transparent; border:none; color:var(--text-main); padding:10px; font-size:12px; font-weight:bold; text-align:left; cursor:pointer; width:100%; }
        .options-menu button:hover { background:var(--input-bg); }

        .feedback-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:100005; justify-content:center; align-items:center; }
        .feedback-box { background:var(--bg-surface); border:2px solid var(--primary); border-radius:16px; padding:20px; width:90%; max-width:360px; box-shadow:0 10px 30px rgba(0,0,0,0.5); }

        #htmlPreviewModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:100005; flex-direction:column; }
        .preview-header { display:flex; justify-content:space-between; align-items:center; padding:15px 20px; background:#161b22; color:white; font-weight:bold; }
        .preview-close { background:#ef4444; color:white; border:none; border-radius:8px; padding:8px 20px; cursor:pointer; font-weight:bold; }
        #htmlPreviewFrame { flex:1; width:100%; border:none; background:white; }

        #floatingModeChip { display:none; align-items:center; gap:8px; background:linear-gradient(135deg, #a855f7, #06b6d4); color:white; padding:6px 14px; border-radius:20px; margin-bottom:10px; font-size:12px; font-weight:bold; width:max-content; box-shadow:0 4px 12px rgba(168,85,247,0.3); }
        #floatingModeChip button { background:rgba(255,255,255,0.2); border:none; color:white; font-weight:bold; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:10px; }
        #floatingModeChip button:hover { background:rgba(255,255,255,0.4); }
    </style>
</head>
<body class="chat-page-layout" onclick="closeAllMenus(event)">

    <div id="settingsModal">

            <button onclick="clearBrain()" style="width:100%; background:rgba(239, 68, 68, 0.1); color:#ef4444; border:1px solid #ef4444; padding:8px; border-radius:8px; margin-top:5px; cursor:pointer; font-weight:bold; font-size:12px;">Wipe Memory</button>

    <div id="feedbackOverlay" class="feedback-overlay" onclick="document.getElementById('feedbackOverlay').style.display='none'">

            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button onclick="document.getElementById('feedbackOverlay').style.display='none'" style="background:var(--input-bg); border:1px solid var(--border-light); color:var(--text-main); padding:8px 15px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:13px;">Cancel</button>

        <div style="color:var(--primary); font-size:22px;">🎧</div>

    </div>

    <div class="topbar">
        <div class="menuBtn" onclick="toggleSidebar()">☰</div>
        <div class="appTitle" style="font-size: 18px;">Deep AI</div>
        
        <div style="margin-left: auto; display: flex; align-items: center; gap: 15px;">
            <button onclick="toggleFocusMode()" title="Focus Mode" style="background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-main);">🧘‍♂️</button>
            <div class="menuBtn" style="font-size: 20px;" onclick="clearSearchChat();" title="Clear All">🗑️</div>
            <button onclick="document.getElementById('settingsModal').style.display='flex'; updateBrainDisplay();" title="Settings" style="background:none; border:none; font-size:22px; cursor:pointer; color:var(--primary);">⚙️</button>

        </div>

            <button id="viewPhotosBtn" onclick="toggleMultiImage()" style="display:none; background:var(--primary); color:white; border:none; padding:5px 10px; border-radius:12px; font-size:11px; cursor:pointer;">🖼️ Photos (0)</button>
        </div>

        <div id="multiImageManager" style="display:none; padding:10px; margin-bottom:10px; background:var(--input-bg); border:1px solid var(--border-light); border-radius:12px; overflow-x:auto;">
            <div id="multiImageList" style="display:flex; gap:10px;"></div>
        </div>

        <div id="pdfPreviewChip" style="display:none; align-items:center; background:var(--input-bg); padding:8px 12px; border-radius:12px; margin-bottom:10px; font-size:12px; color:var(--primary); border:1px solid var(--primary);">
            📄 <span id="pdfName" style="margin:0 10px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">doc.pdf</span>
            <button onclick="clearPdfFile()" style="background:none; border:none; color:red; cursor:pointer; font-weight:bold; font-size:14px;">✕</button>

            <div style="position:relative;">
                <button class="chat-action-btn" onclick="event.stopPropagation(); document.getElementById('attachmentMenu').style.display = document.getElementById('attachmentMenu').style.display === 'flex' ? 'none' : 'flex';" style="width:45px; height:45px; font-size:20px; background:transparent; border:none; cursor:pointer;">➕</button>
                
                <div id="attachmentMenu" style="display:none; position:absolute; bottom:60px; left:0; background:var(--bg-surface); border:1px solid var(--border-light); border-radius:16px; padding:10px; box-shadow:0 10px 30px rgba(0,0,0,0.6); flex-direction:column; gap:8px; z-index:100; min-width:150px;">
                    <button onclick="document.getElementById('imageUploadInput').click(); this.parentElement.style.display='none';" style="background:var(--input-bg); border:none; padding:12px; border-radius:10px; cursor:pointer; text-align:left; color:var(--text-main); font-weight:600;">🖼️ Add Photo (Max 10)</button>
                    <button onclick="document.getElementById('pdfUploadInput').click(); this.parentElement.style.display='none';" style="background:var(--input-bg); border:none; padding:12px; border-radius:10px; cursor:pointer; text-align:left; color:var(--text-main); font-weight:600;">📄 Add PDF</button>

        </div>

    <script>
        // --- CUSTOM MARKDOWN RENDERER (FIXES THE BUG) ---
        const renderer = new marked.Renderer();
        renderer.code = function(code, language) {
            // Escape HTML brackets so it renders correctly instead of injecting
            let safeCode = code.replace(/</g, '&lt;').replace(/>/g, '&gt;').trim();
            
            // Check if language is explicitly HTML, or if the code looks like HTML
            let isHtml = (language && language.toLowerCase() === 'html') || safeCode.toLowerCase().includes('&lt;html') || safeCode.toLowerCase().includes('&lt;!doctype html');
            
            // Add play button ONLY if it's HTML
            let playBtnStr = isHtml ? `<button class="copy-btn play-btn" onclick="playHtmlCode(this)">▶ Play HTML</button>` : '';

            return `<div class="code-box">
                <div class="code-header">${playBtnStr}<button class="copy-btn" onclick="navigator.clipboard.writeText(this.parentElement.nextElementSibling.innerText); this.innerText='Copied!'; setTimeout(()=>this.innerText='Copy Code',2000);">Copy Code</button></div>
                <div class="code-body">${safeCode}</div>
            </div>`;
        };
        marked.setOptions({ renderer: renderer });


        let appHistory = [];
        let sessionMessages = [];
        let isProcessing = false;
        let activeAbortController = null;
        let persistentPdfMemory = "";
        let uploadedImages = []; 
        let aiBrain = []; 
        let activeSearchMode = "web"; 
        let currentFeedbackTargetText = "";
        let imageGenerationModeActive = false; 

        function setSearchMode(mode) {
            activeSearchMode = mode;
            document.getElementById('modeLocalBtn').classList.toggle('active', mode === 'local');
            document.getElementById('modeWebBtn').classList.toggle('active', mode === 'web');
            showToast(mode === 'local' ? "📚 Local Book Mode Activated" : "🌐 Live Web Search Activated");
        }

        function activateImageMode() {
            imageGenerationModeActive = true;
            document.getElementById("floatingModeChip").style.display = "flex";
            const searchInput = document.getElementById("searchInput");
            searchInput.placeholder = "Describe the image you want Flux to paint right here...";
            searchInput.focus();
        }

        function disableImageMode() {
            imageGenerationModeActive = false;
            document.getElementById("floatingModeChip").style.display = "none";
            document.getElementById("searchInput").placeholder = "Ask anything, solve using book data or draw diagrams...";
        }

        function saveHistorySafe() {
            if (typeof localforage !== 'undefined') {
                localforage.setItem('aiHistory', appHistory).catch(err => console.log(err));
            }
            try { localStorage.setItem('aiHistory', JSON.stringify(appHistory)); } catch(e) {}
        }

        try { appHistory = JSON.parse(localStorage.getItem('aiHistory') || '[]'); } catch(e) {}
        try { aiBrain = JSON.parse(localStorage.getItem('aiBrain') || '[]'); } catch(e) {}

        document.addEventListener("DOMContentLoaded", () => {
            if (sessionMessages.length === 0 && !new URLSearchParams(window.location.search).get('restore')) {
                showWelcomeMessage();
            }
        });

        function showWelcomeMessage() {
            const chatContainer = document.getElementById("searchChatHistory");
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="chat-msg chat-ai">
                    <div class="bubble" style="border: 1px solid var(--primary);">
                        <div class="ai-signature">✨ BY SYSTEM ENGINE</div>
                        <b style="color:var(--primary); font-size:18px;">👋 Welcome to Deep AI Dashboard!</b><br><br>
                        • <b>Code Box Fix:</b> HTML code will now perfectly format inside a code box with a Play Button.<br>
                    </div>
                </div>`);
        }

        function setFont(scale, btn) {
            document.documentElement.style.setProperty('--app-font-scale', scale);
            document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function toggleSidebar() { document.getElementById("sidebar").classList.toggle("active"); document.getElementById("overlay").classList.toggle("active"); }
        function toggleFocusMode() { document.body.classList.toggle("focus-mode"); }
        function showToast(msg) { let t = document.createElement('div'); t.innerText = msg; t.style.cssText = "position:fixed; bottom:140px; left:50%; transform:translateX(-50%); background:var(--primary); color:white; padding:10px 20px; border-radius:20px; z-index:10000; font-weight:bold; font-size:12px;"; document.body.appendChild(t); setTimeout(() => t.remove(), 2500); }
        function safeScroll() { const c = document.getElementById("searchChatHistory"); c.scrollTop = c.scrollHeight; }
        function clearSearchChat() { if(confirm("Clear chat?")) { document.getElementById("searchChatHistory").innerHTML = ''; sessionMessages = []; uploadedImages = []; updateImageUI(); clearPdfFile(); } }

        function closeAllMenus(e) {
            document.getElementById('attachmentMenu').style.display = 'none';
            document.querySelectorAll('.options-menu').forEach(m => m.style.display = 'none');
        }

        function toggleOptionsMenu(e, menuId) {
            e.stopPropagation();
            const targetMenu = document.getElementById(menuId);
            const currentState = targetMenu.style.display;
            document.querySelectorAll('.options-menu').forEach(m => m.style.display = 'none');
            targetMenu.style.display = currentState === 'flex' ? 'none' : 'flex';
        }

        function openFeedbackDialog(textElementId) {
            currentFeedbackTargetText = document.getElementById(textElementId).innerText;
            document.getElementById('feedbackText').value = "";
            document.getElementById('feedbackOverlay').style.display = 'flex';
        }

        async function submitFeedbackApi() {
            const userChanges = document.getElementById('feedbackText').value.trim();
            if(!userChanges) return;
            try {
                await fetch("/api/secure-whatsapp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ number: "feedback", message: `Change requested:\n${userChanges}` })
                });
                document.getElementById('feedbackOverlay').style.display = 'none';
                showToast("🚀 Feedback closed and dispatched!");
            } catch(err) {
                document.getElementById('feedbackOverlay').style.display = 'none';
            }
        }

        function copyResponseToClipboard(textElementId) {
            navigator.clipboard.writeText(document.getElementById(textElementId).innerText);
            showToast("📋 Copied!");
        }

        let currentFullscreenBase64 = null;
        window.openFullscreenImage = function(imgId) {
            const imgEl = document.getElementById(imgId); if(!imgEl) return;
            currentFullscreenBase64 = imgEl.src; document.getElementById('fsImage').src = currentFullscreenBase64;
            document.getElementById('fullscreenViewer').style.display = 'flex';
        }
        
        window.downloadFullscreenImage = async function() {
            if(!currentFullscreenBase64) return;
            try {
                const response = await fetch(currentFullscreenBase64);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                let a = document.createElement("a");
                a.href = url;
                a.download = `DeepAI_Image_${Date.now()}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch(e) {
                window.open(currentFullscreenBase64, '_blank');
            }
        }

        function runInsaneTypewriter(targetElement, fullHtml, callback) {
            let tempDiv = document.createElement('div');
            tempDiv.innerHTML = fullHtml;
            let nodes = Array.from(tempDiv.childNodes);
            targetElement.innerHTML = "";
            let nodeIndex = 0;

            function typeNextNode() {
                if (nodeIndex >= nodes.length) { if(callback) callback(); return; }
                let currentNode = nodes[nodeIndex].cloneNode(true);
                targetElement.appendChild(currentNode);
                nodeIndex++;
                safeScroll();
                setTimeout(typeNextNode, 20); // Extremely fast
            }
            typeNextNode();
        }

        window.startTts = function(textId) {
            window.speechSynthesis.cancel();
            let currentUtterance = new SpeechSynthesisUtterance(document.getElementById(textId).innerText);
            currentUtterance.lang = document.getElementById("appLang").value;
            window.speechSynthesis.speak(currentUtterance);
        };

        window.closeTts = function() { window.speechSynthesis.cancel(); };

        // Play HTML Function
        window.playHtmlCode = function(btn) {
            const code = btn.parentElement.nextElementSibling.innerText;
            document.getElementById('htmlPreviewFrame').srcdoc = code;
            document.getElementById('htmlPreviewModal').style.display = 'flex';
        }

        function processMath(text) {
            return text.replace(/(\d+)\/(\d+)/g, '\\frac{$1}{$2}');
        }

        function toggleMultiImage() { const m = document.getElementById("multiImageManager"); m.style.display = m.style.display === "none" ? "block" : "none"; }
        function updateImageUI() {
            const list = document.getElementById("multiImageList"); const btn = document.getElementById("viewPhotosBtn");
            if (uploadedImages.length > 0) {
                btn.style.display = "block"; btn.innerText = `🖼️ View Photos (${uploadedImages.length})`; list.innerHTML = "";
                uploadedImages.forEach((imgSrc, index) => {
                    list.innerHTML += `<div style="position:relative;"><button onclick="removeUploadedImage(${index})" style="position:absolute; top:-5px; right:-5px; background:red; color:white; border:none; border-radius:50%; width:20px; height:20px; cursor:pointer;">✕</button><img src="${imgSrc}" style="width:70px; height:70px; object-fit:cover; border-radius:10px;"></div>`;
                });
            } else { btn.style.display = "none"; document.getElementById("multiImageManager").style.display = "none"; }
        }
        function removeUploadedImage(index) { uploadedImages.splice(index, 1); updateImageUI(); }
        function handleImageUpload(e) { const f = e.target.files[0]; if(!f) return; if(uploadedImages.length >= 10) return; const r = new FileReader(); r.onload = () => { uploadedImages.push(r.result); updateImageUI(); }; r.readAsDataURL(f); }
        function handlePdfUpload(e) { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = async function() { const typedarray = new Uint8Array(this.result); const pdf = await pdfjsLib.getDocument(typedarray).promise; let text = ""; for(let i=1; i<=pdf.numPages; i++){ const p = await pdf.getPage(i); const c = await p.getTextContent(); text += c.items.map(i=>i.str).join(' '); } persistentPdfMemory = text; document.getElementById('pdfPreviewChip').style.display='flex'; document.getElementById('pdfName').innerText = f.name; }; r.readAsArrayBuffer(f); }
        function clearPdfFile() { persistentPdfMemory = ""; document.getElementById('pdfPreviewChip').style.display='none'; }

        function runMainPipeline() {
            const inp = document.getElementById("searchInput");
            const textValue = inp.value.trim();
            if (imageGenerationModeActive) { runDirectImageGeneration(textValue); disableImageMode(); } 
            else { runStandaloneTextSearch(); }
        }

        async function runDirectImageGeneration(promptText) {
            if(!promptText) return;
            const chatContainer = document.getElementById("searchChatHistory"); 
            const loadId = "load_" + Date.now();
            
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="chat-msg chat-user"><div class="bubble">🎨 <b>Create Image Request:</b><br>${promptText}</div></div>
                <div class="chat-msg chat-ai" id="${loadId}">
                    <div class="bubble">
                        <div class="ai-signature">✨ BY FLUX ENGINE</div>
                        <div class="ai-thinking-pulse"><div class="pulse-orb"></div><span style="color:var(--text-muted); font-size:13px; font-weight:bold;">Painting your request in high definition...</span></div>
                    </div>
                </div>`);
            safeScroll();

            try {
                const response = await fetch("/api/hf-search-image", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt: promptText }) });
                const result = await response.json();
                if (result.imageBase64) {
                    document.getElementById(loadId).querySelector('.bubble').innerHTML = `
                        <div class="ai-signature">✨ BY FLUX ENGINE</div>
                        <div style="border-radius:12px; overflow:hidden; margin-top:10px;" onclick="openFullscreenImage('img_src_${loadId}')">
                            <img src="${result.imageBase64}" style="max-width:100%; display:block; cursor:pointer;" id="img_src_${loadId}" onload="safeScroll()">
                        </div>`;
                    saveHistorySafe();
                }
            } catch (error) {
                document.getElementById(loadId).querySelector('.bubble').innerHTML = `<span style="color:red;">❌ Image painting failed.</span>`;
            }
        }

        async function runStandaloneTextSearch() {
            const inp = document.getElementById("searchInput"); let q = inp.value.trim(); 
            if(!q && uploadedImages.length === 0 && !persistentPdfMemory) return; 
            
            isProcessing = true; document.getElementById("sendSearchBtn").innerHTML = "🛑";
            const chatContainer = document.getElementById("searchChatHistory");
            const selectedModelValue = document.getElementById("modelSelector").value;

            let userImgHtml = ''; uploadedImages.forEach(img => { userImgHtml += `<img src="${img}" style="max-height:80px; margin-right:5px; display:inline-block;">`; });
            let currentImagesToSave = [...uploadedImages];
            let imageToUseForApi = uploadedImages.length > 0 ? uploadedImages[0] : null;

            chatContainer.insertAdjacentHTML('beforeend', `<div class="chat-msg chat-user"><div class="bubble">${userImgHtml ? userImgHtml+'<br>':''}${q.replace(/\n/g, '<br>')}</div></div>`);
            inp.value = ""; safeScroll();

            let requiresImageTrigger = false;
            let lowercaseQ = q.toLowerCase();
            if(lowercaseQ.includes("चित्र") || lowercaseQ.includes("नक्शा") || lowercaseQ.includes("map") || lowercaseQ.includes("diagram") || lowercaseQ.includes("picture")) {
                requiresImageTrigger = true;
            }

            const loadId = "load_" + Date.now();
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="chat-msg chat-ai" id="${loadId}">
                    <div class="bubble">
                        <div class="ai-signature">✨ BY AI MODEL</div>
                        <div class="ai-thinking-pulse"><div class="pulse-orb"></div><span style="color:var(--text-muted); font-size:13px; font-weight:bold;">AI is processing...</span></div>
                    </div>
                </div>`);
            safeScroll();

            try {
                let endpoint = imageToUseForApi ? "/api/gemini-vision" : "/api/gemini-text";
                let body = imageToUseForApi ? { imageBase64: imageToUseForApi, userPrompt: q, providerOverride: selectedModelValue } : { systemPrompt: "Tone: Standard. Use LaTeX.", userPrompt: q, providerOverride: selectedModelValue };
                
                const response = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
                const data = await response.json();
                
                let actualProvider = data.provider ? data.provider.toUpperCase() : "GEMINI API";
                let cleanAns = data.text;

                // SAFETY NET: If the AI outputs raw HTML without backticks, automatically wrap it so it gets boxed
                if (cleanAns.includes('<!DOCTYPE html>') && !cleanAns.includes('```')) {
                    cleanAns = cleanAns.replace(/(<!DOCTYPE html>[\s\S]*?<\/html>)/i, "\n```html\n$1\n```\n");
                }

                let processedMathAns = processMath(cleanAns);
                
                // Let marked.js (with our custom renderer) do all the formatting
                let finalHtml = marked.parse(processedMathAns);

                document.getElementById(loadId).querySelector('.bubble').innerHTML = `
                    <div class="ai-signature">✨ BY ${actualProvider}</div>
                    <div id="text_${loadId}" class="markdown-body"></div>
                    <div class="action-row">
                        <button class="action-btn" onclick="startTts('text_${loadId}')">🔊 Voice</button>
                        <button class="action-btn" onclick="copyResponseToClipboard('text_${loadId}')">📋 Copy Text</button>
                        <button class="action-btn" onclick="toggleOptionsMenu(event, 'menu_${loadId}')">•••</button>
                        <div class="options-menu" id="menu_${loadId}"><button onclick="openFeedbackDialog('text_${loadId}')">📝 Feedback</button></div>
                    </div>
                    <div id="attached_image_zone_${loadId}" style="margin-top:10px;"></div>`;
                
                runInsaneTypewriter(document.getElementById(`text_${loadId}`), finalHtml, () => {
                    if (window.MathJax) { MathJax.typesetPromise([document.getElementById(loadId)]); }
                    if (requiresImageTrigger) {
                        runDirectImageGeneration(q, `attached_image_zone_${loadId}`);
                    }
                });
            } catch (err) {
                document.getElementById(loadId).querySelector('.bubble').innerHTML = `<span>❌ Delivery exception encountered.</span>`;
            } finally {
                isProcessing = false; document.getElementById("sendSearchBtn").innerHTML = "🚀"; uploadedImages = []; updateImageUI(); safeScroll();
            }
        }
    </script>
</body>
</html>
