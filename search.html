<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Search</title>
    
    <!-- STRICT MASTER CSS IMPORT ONLY -->
    <link rel="stylesheet" href="style.css">
    
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body>

    <!-- Main Chat Area -->
    <div class="chat-container">
        
        <!-- Chat History -->
        <div id="searchChatHistory" class="chat-history chat-scroll-area">
            <!-- AI Bubble Welcome message injected via JS -->
        </div>

        <!-- Master CSS Chat Input Area -->
        <div class="chat-input-area">
            
            <!-- Previews -->
            <div class="image-preview-chip" id="mathPreviewChip" style="display:none;">
                <div class="closeBtn" onclick="clearSearchImage(event)">✕</div>
            </div>
            
            <div class="image-preview-chip" id="pdfPreviewChip" style="display:none;">
                <div>📄</div>
                <div id="pdfName">doc.pdf</div>
                <div class="closeBtn" onclick="clearPdfFile(event)">✕</div>
            </div>

            <!-- Input Wrapper -->
            <div class="chat-input-wrapper">
                <div class="relative-container">
                    <button class="chat-action-btn" id="attachBtn" onclick="toggleAttachmentMenu()" title="Attach File">➕</button>
                    
                    <div id="attachmentMenu" class="attachment-menu">
                        <button onclick="document.getElementById('pdfUploadInput').click(); toggleAttachmentMenu();">📄 Upload PDF</button>
                        <button onclick="openStandaloneCamera(); toggleAttachmentMenu();">📸 Camera</button>
                    </div>
                </div>
                
                <input type="file" id="pdfUploadInput" accept="application/pdf" style="display: none;" onchange="handlePdfUpload(event)">
                
                <textarea id="searchInput" placeholder="Search web, upload PDF, or use Camera..." rows="1"></textarea>
                
                <button class="chat-action-btn send" id="sendSearchBtn" onclick="runStandaloneSearch()" title="Send">🚀</button>
            </div>
        </div>
    </div>

    <!-- 📸 STANDALONE CAMERA MODAL (USING MASTER CSS) -->
    <div id="standaloneCameraModal" class="cameraModal">
        <!-- Close Button -->
        <button onclick="closeStandaloneCamera()" class="closeBtn" id="camCloseBtn">✕</button>

        <!-- Video Feed -->
        <video id="standaloneVideo" autoplay playsinline></video>
        <canvas id="standaloneCanvas" style="display:none;"></canvas>

        <!-- Camera Controls -->
        <div class="cameraControls">
            <!-- Flash Toggle -->
            <button class="cam-secondary-btn" id="standaloneFlashBtn" onclick="toggleStandaloneFlash()">🔦</button>
            
            <!-- Master CSS Capture Button -->
            <div class="cameraCircle" onclick="captureStandalonePhoto()" title="Capture"></div>
            
            <!-- Switch Camera Toggle -->
            <button class="cam-secondary-btn" onclick="switchStandaloneCamera()">🔄</button>
        </div>
    </div>

    <!-- Flash Animation Overlay -->
    <div id="cameraFlashOverlay" class="flash-overlay"></div>


    <!-- ==========================================
         STANDALONE SCRIPT FOR SEARCH, PDF & CAMERA
         ========================================== -->
    <script>
        // --- 1. STATE VARIABLES ---
        let standaloneCapturedImage = null;
        let persistentPdfMemory = "";
        let isProcessing = false;

        // --- 2. WELCOME MESSAGE ---
        document.addEventListener("DOMContentLoaded", () => {
            const chatContainer = document.getElementById("searchChatHistory");
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="chat-msg chat-ai">
                    <div class="bubble">
                        👋 <b>Welcome to Deep Search!</b><br><br>
                        1. <b>➕ Button:</b> Attach a PDF or use the Camera.<br>
                        2. <b>Search:</b> Type any question; I will use your file + Internet to answer it.<br>
                        <br><i>Note: I will remember your PDF during our chat!</i>
                    </div>
                </div>
            `);

            // Enter key to send
            const inp = document.getElementById("searchInput");
            inp.addEventListener("keypress", function(e) {
                if(e.key === "Enter" && !e.shiftKey) { e.preventDefault(); runStandaloneSearch(); }
            });
        });

        // --- 3. UI HELPERS ---
        function toggleAttachmentMenu() { document.getElementById('attachmentMenu').classList.toggle('active'); }
        function scrollToBottom() { const c = document.getElementById("searchChatHistory"); c.scrollTop = c.scrollHeight; }
        
        function showStandaloneToast(msg) {
            let t = document.createElement('div'); t.innerText = msg;
            t.className = 'toast-message'; // Relies on your style.css if you have a toast class, otherwise fallback below
            t.style.cssText = "position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background: #38bdf8; color:black; padding:12px 25px; border-radius:30px; font-weight:bold; z-index:10000;";
            document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
        }

        // --- 4. PERSISTENT PDF MEMORY ---
        async function handlePdfUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.type !== "application/pdf") return showStandaloneToast("⚠️ Only PDF files are supported!");
            
            showStandaloneToast("📄 Reading PDF... Please wait.");
            const fileReader = new FileReader();
            
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                try {
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let fullText = `DOCUMENT NAME: ${file.name}\n`;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        fullText += `\n--- Page ${i} ---\n` + textContent.items.map(item => item.str).join(' ');
                    }
                    persistentPdfMemory = fullText;
                    
                    const chip = document.getElementById("pdfPreviewChip");
                    chip.style.display = "flex";
                    document.getElementById("pdfName").innerText = file.name;
                    showStandaloneToast(`✅ PDF Attached and saved to memory!`);
                } catch(e) { showStandaloneToast("❌ Error reading PDF: " + e.message); }
            };
            fileReader.readAsArrayBuffer(file);
        }

        function clearPdfFile(e) {
            if(e) e.stopPropagation();
            persistentPdfMemory = "";
            document.getElementById("pdfUploadInput").value = "";
            document.getElementById("pdfPreviewChip").style.display = "none";
        }

        // --- 5. PRO CAMERA ENGINE (Auto-Flash & Animations) ---
        let standaloneStream = null;
        let standaloneFacingMode = "environment";
        let isStandaloneFlashOn = false;

        async function startCameraTrack() {
            if (standaloneStream) { standaloneStream.getTracks().forEach(t => t.stop()); }
            try {
                standaloneStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: standaloneFacingMode, width: {ideal: 1920}, height: {ideal: 1080} } 
                });
                document.getElementById("standaloneVideo").srcObject = standaloneStream;
                
                // AUTO FLASHLIGHT LOGIC
                setTimeout(async () => {
                    if (standaloneFacingMode === "environment") {
                        const track = standaloneStream.getVideoTracks()[0];
                        try {
                            const cap = track.getCapabilities();
                            if (cap.torch) {
                                isStandaloneFlashOn = true;
                                await track.applyConstraints({ advanced: [{ torch: true }] });
                                updateFlashUI();
                            }
                        } catch(err) { console.log("Torch capability check failed:", err); }
                    }
                }, 500);

            } catch(e) { showStandaloneToast("⚠️ Camera Error. Please check permissions."); }
        }

        async function openStandaloneCamera() {
            document.getElementById("standaloneCameraModal").classList.add("active");
            await startCameraTrack();
        }

        function closeStandaloneCamera() {
            document.getElementById("standaloneCameraModal").classList.remove("active");
            if (standaloneStream) {
                const track = standaloneStream.getVideoTracks()[0];
                try {
                    if (track && track.getCapabilities().torch) track.applyConstraints({ advanced: [{ torch: false }] });
                } catch(err) {}
                standaloneStream.getTracks().forEach(t => t.stop());
                standaloneStream = null;
            }
            isStandaloneFlashOn = false;
            updateFlashUI();
        }

        async function switchStandaloneCamera() {
            standaloneFacingMode = standaloneFacingMode === "environment" ? "user" : "environment";
            await startCameraTrack();
        }

        async function toggleStandaloneFlash() {
            if (!standaloneStream) return;
            const track = standaloneStream.getVideoTracks()[0];
            try {
                if (track.getCapabilities().torch) {
                    isStandaloneFlashOn = !isStandaloneFlashOn;
                    await track.applyConstraints({ advanced: [{ torch: isStandaloneFlashOn }] });
                    updateFlashUI();
                } else {
                    showStandaloneToast("⚠️ Flashlight not supported on this camera.");
                }
            } catch(err){ showStandaloneToast("⚠️ Flashlight Error."); }
        }

        function updateFlashUI() {
            const btn = document.getElementById("standaloneFlashBtn");
            if (btn) {
                btn.innerText = isStandaloneFlashOn ? "💡" : "🔦";
                btn.style.background = isStandaloneFlashOn ? "white" : "rgba(255,255,255,0.15)";
                btn.style.color = isStandaloneFlashOn ? "black" : "white";
            }
        }

        function captureStandalonePhoto() {
            // Trigger Flash Overlay Animation
            const overlay = document.getElementById("cameraFlashOverlay");
            overlay.classList.remove("active");
            void overlay.offsetWidth; // Trigger reflow
            overlay.classList.add("active");
            
            // Capture Logic
            setTimeout(() => {
                const v = document.getElementById("standaloneVideo");
                const c = document.getElementById("standaloneCanvas");
                let w = v.videoWidth, h = v.videoHeight; 
                if(w > 1500) { h *= 1500/w; w = 1500; }
                c.width = w; c.height = h;
                c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
                standaloneCapturedImage = c.toDataURL("image/jpeg", 0.7);
                
                const chip = document.getElementById("mathPreviewChip");
                chip.style.display = "block";
                chip.style.backgroundImage = `url(${standaloneCapturedImage})`;
                
                closeStandaloneCamera();
            }, 150);
        }

        function clearSearchImage(e) {
            if(e) e.stopPropagation();
            standaloneCapturedImage = null;
            document.getElementById("mathPreviewChip").style.display = "none";
        }

        // --- 6. CORE SEARCH LOGIC & API CALLS ---
        async function runStandaloneSearch() {
            const inp = document.getElementById("searchInput");
            const q = inp.value.trim(); 
            
            if(!q && !standaloneCapturedImage && !persistentPdfMemory) return;
            if(isProcessing) return;
            isProcessing = true;

            const chatContainer = document.getElementById("searchChatHistory");
            
            // Build User Bubble
            let displayQ = q || "Analyze this document.";
            let imgHtml = standaloneCapturedImage ? `<img src="${standaloneCapturedImage}" class="bubble-img">` : '';
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="chat-msg chat-user">
                    <div class="bubble">
                        ${imgHtml}
                        <div>${displayQ.replace(/\n/g, '<br>')}</div>
                    </div>
                </div>
            `);
            
            inp.value = ""; 
            scrollToBottom();

            // Build Loading Bubble
            const loadId = "load_" + Date.now();
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="chat-msg chat-ai" id="${loadId}">
                    <div class="bubble">
                        <span class="typing-indicator">AI is thinking...</span>
                    </div>
                </div>
            `);
            scrollToBottom();

            let sysPrompt = `You are an expert AI Assistant and Guide. 
            CRITICAL RULES:
            1. YOU MUST ANSWER ENTIRELY IN HINDI (DEVANAGARI SCRIPT ONLY). DO NOT USE ENGLISH.
            2. If the user provides a document and asks "how to fill it", DO NOT say the document lacks instructions. 
            3. Use your general internet knowledge combined with the provided document context to explain EXACTLY how to fulfill the user's request step-by-step.
            4. Be highly helpful, practical, and solution-oriented.`;

            let finalPrompt = `User Question: ${q || 'Please help me with this document.'}\n\n`;
            if (persistentPdfMemory) {
                finalPrompt += `[BACKGROUND DOCUMENT CONTEXT (Use this to answer)]:\n${persistentPdfMemory}`;
            }

            try {
                let endpoint = standaloneCapturedImage ? "/api/gemini-vision" : "/api/gemini-text";
                let bodyData = standaloneCapturedImage ? 
                    { imageBase64: standaloneCapturedImage, userPrompt: `${sysPrompt}\n\n${finalPrompt}` } : 
                    { systemPrompt: sysPrompt, userPrompt: finalPrompt };

                const response = await fetch(endpoint, {
                    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(bodyData)
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Server Error");

                let cleanAns = data.text.replace(/[\*&#_]/g, '');
                
                // Final Answer Bubble Injection
                document.getElementById(loadId).querySelector('.bubble').innerHTML = `
                    <div class="ai-credit">✨ BY GEMINI</div>
                    <div>${cleanAns.replace(/\n/g, '<br>')}</div>
                `;
                scrollToBottom();

                // Clear temporary UI attachments (Keep background memory intact)
                clearSearchImage();
                document.getElementById("pdfPreviewChip").style.display = "none";

            } catch (error) {
                document.getElementById(loadId).querySelector('.bubble').innerHTML = `<span>❌ Error: ${error.message}</span>`;
            } finally {
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
