<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI PRO SUITE</title>
    
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';</script>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script>MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };</script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        /* ===== UNIVERSAL CSS ===== */
        :root { --bg: #0f172a; --surface: #1e293b; --primary: #3b82f6; --text: #f8fafc; --muted: #94a3b8; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* ===== TOP BAR & AUDIO PLAYER ===== */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--surface); border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 50; }
        .app-title { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .settings-btn { background: none; border: none; font-size: 24px; cursor: pointer; transition: 0.2s; }
        
        #topAudioPlayer { display: none; position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #1e293b; border: 2px solid #3b82f6; border-radius: 30px; padding: 10px 20px; z-index: 1000; align-items: center; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .audio-btn { background: #3b82f6; border: none; color: white; width: 35px; height: 35px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .audio-btn.red { background: #ef4444; }

        /* ===== MAIN CHAT AREA ===== */
        .chat-container { flex: 1; overflow-y: auto; padding: 20px 15px 120px 15px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        
        /* Solves the sticky border glitch */
        .chat-msg { display: flex; width: 100%; padding: 0 10px; }
        .chat-user { justify-content: flex-end; }
        .chat-ai { justify-content: flex-start; }
        
        .bubble { max-width: 85%; padding: 15px 20px; border-radius: 20px; font-size: 15px; line-height: 1.5; word-wrap: break-word; position: relative; }
        .chat-user .bubble { background: var(--primary); color: white; border-bottom-right-radius: 5px; box-shadow: 0 4px 15px rgba(59,130,246,0.3); }
        .chat-ai .bubble { background: var(--surface); color: var(--text); border-bottom-left-radius: 5px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        
        /* Action Buttons on AI Message */
        .msg-actions { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        .action-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 15px; border-radius: 10px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .action-btn:hover { background: var(--primary); }

        /* ===== EPIC THINKING ANIMATION ===== */
        .epic-loader { display: flex; align-items: center; gap: 10px; padding: 10px; }
        .glowing-orb { width: 25px; height: 25px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #a855f7); animation: pulseOrb 1s infinite alternate; box-shadow: 0 0 15px #3b82f6; }
        @keyframes pulseOrb { 0% { transform: scale(0.8); opacity: 0.7; box-shadow: 0 0 10px #3b82f6; } 100% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 25px #a855f7; } }
        .loader-text { font-weight: 600; background: linear-gradient(90deg, #3b82f6, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* ===== INPUT AREA & + MENU ===== */
        .input-area { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg); padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        .input-wrapper { display: flex; align-items: flex-end; gap: 10px; background: var(--surface); border-radius: 25px; padding: 8px 15px; border: 1px solid rgba(255,255,255,0.2); }
        
        .icon-btn { background: transparent; border: none; color: var(--muted); font-size: 24px; cursor: pointer; padding: 5px; transition: 0.2s; }
        .icon-btn:hover { color: var(--primary); }
        .send-btn { background: var(--primary); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        
        textarea { flex: 1; background: transparent; border: none; color: white; font-size: 16px; resize: none; max-height: 120px; padding: 10px 0; outline: none; }
        
        /* The + Menu */
        #plusMenu { display: none; position: absolute; bottom: 80px; left: 15px; background: var(--surface); border: 1px solid rgba(255,255,255,0.2); border-radius: 15px; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 200; width: 200px; }
        .menu-item { background: transparent; border: none; color: white; padding: 15px 20px; text-align: left; font-size: 15px; font-weight: bold; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .menu-item:hover { background: rgba(59,130,246,0.2); color: var(--primary); }

        /* Feature Chips */
        #attachmentChip, #photoModeChip { display: none; align-items: center; gap: 10px; background: rgba(59,130,246,0.2); color: #60a5fa; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; width: max-content; margin-bottom: 10px; border: 1px solid #3b82f6; }
        .chip-close { background: #ef4444; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 10px; }

        /* ===== MODALS (Camera, Settings, Voice, Sources) ===== */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 999999; justify-content: center; align-items: center; }
        .modal-content { background: var(--surface); border: 2px solid var(--primary); border-radius: 20px; padding: 25px; width: 90%; max-width: 400px; color: white; position: relative; }
        .modal-close { position: absolute; top: 15px; right: 15px; background: #ef4444; border: none; color: white; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; cursor: pointer; }

        /* Camera Specific */
        #cameraModal { flex-direction: column; background: black; }
        #cameraVideo { width: 100%; height: 100%; object-fit: cover; }
        .cam-controls { position: absolute; bottom: 40px; left: 0; width: 100%; display: flex; justify-content: center; align-items: center; gap: 40px; }
        .cam-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 50px; height: 50px; border-radius: 50%; font-size: 20px; cursor: pointer; }
        .cam-capture { width: 70px; height: 70px; background: white; border: 4px solid #cbd5e1; border-radius: 50%; cursor: pointer; }
        
        .welcome-screen { text-align: center; margin-top: 50px; opacity: 0.8; }
        .welcome-screen h1 { color: var(--primary); margin-bottom: 15px; }
        .welcome-screen p { margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body onclick="closePlusMenu(event)">

    <div class="top-bar">
        <div class="app-title">AI PRO SUITE</div>
        <button class="settings-btn" onclick="document.getElementById('settingsModal').style.display='flex'">⚙️</button>
    </div>

    <div id="topAudioPlayer">
        <span style="font-weight: bold; color: #60a5fa;">🔊 Playing Answer...</span>
        <button class="audio-btn" onclick="window.speechSynthesis.pause()">⏸</button>
        <button class="audio-btn" onclick="window.speechSynthesis.resume()">▶</button>
        <button class="audio-btn red" onclick="stopAudio()">⏹</button>
    </div>

    <div class="chat-container" id="chatBox">
        <div class="welcome-screen" id="welcomeScreen">
            <h1>Welcome to Deep Search</h1>
            <p>1. Type anything or click <b>+</b> to upload files.</p>
            <p>2. Uploading a Book/PDF makes me memorize it instantly.</p>
            <p>3. Turn on <b>Photo Gen</b> to generate images.</p>
        </div>
    </div>

    <div class="input-area">
        <div id="attachmentChip">📎 <span id="attachName">File.pdf</span> <button class="chip-close" onclick="clearAttachment()">✕</button></div>
        <div id="photoModeChip">🎨 Photo Gen Mode Active <button class="chip-close" onclick="togglePhotoMode()">✕</button></div>

        <div id="plusMenu">
            <button class="menu-item" onclick="openCamera()">📷 Open Camera</button>
            <button class="menu-item" onclick="document.getElementById('fileUploader').click()">📎 Upload File</button>
            <button class="menu-item" onclick="togglePhotoMode()" id="photoModeMenuBtn">🎨 Turn On Photo Gen</button>
        </div>

        <div class="input-wrapper">
            <input type="file" id="fileUploader" accept="image/*,.pdf,.txt,.html,.py,.java,.bat,.doc,.docx,.xls,.xlsx,.ppt,.pptx" style="display:none;" onchange="handleFileUpload(event)">
            <button class="icon-btn" id="plusBtn" onclick="togglePlusMenu(event)">➕</button>
            <textarea id="userInput" placeholder="Ask anything, upload docs, or generate art..." rows="1" oninput="this.style.height = ''; this.style.height = Math.min(this.scrollHeight, 120) + 'px';"></textarea>
            <button class="icon-btn" onclick="document.getElementById('voiceModal').style.display='flex'">🎤</button>
            <button class="send-btn" onclick="executeSearch()">🚀</button>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="document.getElementById('settingsModal').style.display='none'">✕</button>
            <h2 style="color:var(--primary); margin-bottom:20px;">Settings</h2>
            <button class="menu-item" style="width:100%; border:1px solid #3b82f6; border-radius:10px; margin-bottom:10px;" onclick="toggleFocus()">🧘‍♂️ Toggle Focus Mode</button>
            <button class="menu-item" style="width:100%; border:1px solid #ef4444; border-radius:10px; color:#ef4444;" onclick="clearChat()">🗑️ Clear Conversation</button>
        </div>
    </div>

    <div id="voiceModal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <button class="modal-close" onclick="document.getElementById('voiceModal').style.display='none'">✕</button>
            <h2 style="margin-bottom:20px;">Voice Input</h2>
            <button class="action-btn" style="background:var(--primary); padding:15px; font-size:16px; margin-bottom:10px; width:100%;" onclick="startVoice('en-US')">🗣️ Speak in English</button>
            <button class="action-btn" style="background:#10b981; padding:15px; font-size:16px; width:100%;" onclick="startVoice('hi-IN')">🗣️ हिंदी में बोलें (Hindi)</button>
        </div>
    </div>

    <div id="sourcesModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="document.getElementById('sourcesModal').style.display='none'">✕</button>
            <h2 style="margin-bottom:20px; color:#10b981;">🌐 Web Sources</h2>
            <div id="sourcesList" style="display:flex; flex-direction:column; gap:10px; max-height:300px; overflow-y:auto;"></div>
        </div>
    </div>

    <div id="cameraModal" class="modal" style="padding:0;">
        <video id="cameraVideo" autoplay playsinline></video>
        <button style="position:absolute; top:20px; right:20px; background:#ef4444; color:white; border:none; width:40px; height:40px; border-radius:50%; font-size:20px; z-index:100;" onclick="closeCamera()">✕</button>
        <div class="cam-controls">
            <button class="cam-btn" id="flashBtn" onclick="toggleFlash()">🔦</button>
            <div class="cam-capture" onclick="takePhoto()"></div>
            <button class="cam-btn" onclick="switchCamera()">🔄</button>
        </div>
        <canvas id="captureCanvas" style="display:none;"></canvas>
    </div>

    <script>
        // System State
        let isPhotoMode = false;
        let bookMemory = "";
        let uploadedImage = null;
        let chatHistory = [];
        let camStream = null;
        let camFacing = "environment";
        let isFlash = false;

        // UI Controls
        function togglePlusMenu(e) { e.stopPropagation(); const m = document.getElementById("plusMenu"); m.style.display = m.style.display === "flex" ? "none" : "flex"; }
        function closePlusMenu() { document.getElementById("plusMenu").style.display = "none"; }
        
        function togglePhotoMode() {
            isPhotoMode = !isPhotoMode;
            document.getElementById("photoModeChip").style.display = isPhotoMode ? "flex" : "none";
            document.getElementById("photoModeMenuBtn").innerText = isPhotoMode ? "🎨 Turn Off Photo Gen" : "🎨 Turn On Photo Gen";
            closePlusMenu();
        }

        function toggleFocus() { document.body.style.background = document.body.style.background === 'black' ? 'var(--bg)' : 'black'; document.getElementById('settingsModal').style.display='none'; }
        
        function clearChat() { document.getElementById("chatBox").innerHTML = document.getElementById("welcomeScreen").outerHTML; chatHistory = []; document.getElementById('settingsModal').style.display='none'; }

        // Audio Player
        function playAudio(btn) {
            const textId = btn.getAttribute('data-target');
            const text = document.getElementById(textId).innerText;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.onstart = () => document.getElementById("topAudioPlayer").style.display = "flex";
            u.onend = () => document.getElementById("topAudioPlayer").style.display = "none";
            window.speechSynthesis.speak(u);
        }
        function stopAudio() { window.speechSynthesis.cancel(); document.getElementById("topAudioPlayer").style.display = "none"; }

        // Copy Text
        function copyText(btn) {
            const textId = btn.getAttribute('data-target');
            navigator.clipboard.writeText(document.getElementById(textId).innerText);
            btn.innerText = "✅ Copied";
            setTimeout(() => btn.innerText = "📋 Copy", 2000);
        }

        // Voice Recognition
        function startVoice(lang) {
            document.getElementById('voiceModal').style.display='none';
            if(!('webkitSpeechRecognition' in window)) return alert("Voice not supported here.");
            const rec = new webkitSpeechRecognition();
            rec.lang = lang;
            rec.onstart = () => document.getElementById("userInput").value = "Listening...";
            rec.onresult = (e) => document.getElementById("userInput").value = e.results[0][0].transcript;
            rec.start();
        }

        // Camera Engine
        async function openCamera() {
            closePlusMenu();
            const mod = document.getElementById("cameraModal");
            mod.style.display = "flex";
            try {
                if(camStream) camStream.getTracks().forEach(t => t.stop());
                camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: camFacing, width: {ideal: 1920}, height: {ideal: 1080} } });
                const v = document.getElementById("cameraVideo");
                v.srcObject = camStream;
                setTimeout(async () => {
                    const track = camStream.getVideoTracks()[0];
                    if (track.getCapabilities().torch && camFacing === "environment") { isFlash = true; await track.applyConstraints({ advanced: [{ torch: true }] }); document.getElementById('flashBtn').innerText = "💡"; }
                }, 500);
            } catch(e) { alert("Camera error."); }
        }
        function closeCamera() { document.getElementById("cameraModal").style.display = "none"; if(camStream) camStream.getTracks().forEach(t=>t.stop()); isFlash=false; document.getElementById('flashBtn').innerText = "🔦"; }
        async function switchCamera() { camFacing = camFacing === "environment" ? "user" : "environment"; await openCamera(); }
        async function toggleFlash() { if(!camStream) return; const track = camStream.getVideoTracks()[0]; if(track.getCapabilities().torch) { isFlash = !isFlash; await track.applyConstraints({ advanced: [{ torch: isFlash }] }); document.getElementById('flashBtn').innerText = isFlash ? "💡" : "🔦"; } }
        function takePhoto() {
            const v = document.getElementById("cameraVideo"), c = document.getElementById("captureCanvas");
            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
            uploadedImage = c.toDataURL("image/jpeg", 0.7);
            document.getElementById("attachmentChip").style.display = "flex";
            document.getElementById("attachName").innerText = "Photo Captured";
            closeCamera();
        }

        // File Uploader (PDF, TXT, HTML, Python, etc)
        function handleFileUpload(e) {
            const file = e.target.files[0]; if(!file) return;
            document.getElementById("attachmentChip").style.display = "flex";
            document.getElementById("attachName").innerText = file.name;
            closePlusMenu();

            if (file.type.startsWith('image/')) {
                const r = new FileReader(); r.onload = (ev) => { uploadedImage = ev.target.result; bookMemory = ""; }; r.readAsDataURL(file);
            } else if (file.name.endsWith('.pdf')) {
                const r = new FileReader();
                r.onload = async function() {
                    const typedarray = new Uint8Array(this.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let text = "";
                    for(let i=1; i<=pdf.numPages; i++){
                        const p = await pdf.getPage(i);
                        const c = await p.getTextContent();
                        text += c.items.map(item=>item.str).join(' ');
                    }
                    bookMemory = text; uploadedImage = null;
                };
                r.readAsArrayBuffer(file);
            } else {
                const r = new FileReader(); r.onload = (ev) => { bookMemory = ev.target.result; uploadedImage = null; }; r.readAsText(file);
            }
        }
        function clearAttachment() { bookMemory = ""; uploadedImage = null; document.getElementById("attachmentChip").style.display = "none"; }

        // AI Execution Pipeline
        async function executeSearch() {
            const inp = document.getElementById("userInput");
            let q = inp.value.trim();
            if (!q && !uploadedImage && !bookMemory) return;

            document.getElementById("welcomeScreen").style.display = "none";
            const chatBox = document.getElementById("chatBox");

            // User Message
            let userHtml = `<div class="chat-msg chat-user"><div class="bubble">${uploadedImage ? `<img src="${uploadedImage}" style="max-width:100%; border-radius:10px; margin-bottom:10px;"><br>` : ''}${q}</div></div>`;
            chatBox.insertAdjacentHTML('beforeend', userHtml);
            inp.value = ""; inp.style.height = ''; chatBox.scrollTop = chatBox.scrollHeight;

            // Loading Animation
            const loadId = "load_" + Date.now();
            chatBox.insertAdjacentHTML('beforeend', `<div class="chat-msg chat-ai" id="${loadId}"><div class="bubble epic-loader"><div class="glowing-orb"></div><span class="loader-text">AI is thinking...</span></div></div>`);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                if (isPhotoMode) {
                    await handlePhotoGeneration(q, loadId);
                    if(isPhotoMode) togglePhotoMode(); // Auto turn off
                } else {
                    await handleTextSearch(q, loadId);
                }
            } catch(e) {
                document.getElementById(loadId).innerHTML = `<div class="bubble" style="color:#ef4444;">❌ Error: ${e.message}</div>`;
            }
            clearAttachment();
        }

        // The Complex Photo Generation Loop
        async function handlePhotoGeneration(prompt, loadId) {
            let bestImage = null;
            let hfPrompt = prompt + " , NO CHINESE TEXT, NO LETTERS, ONLY ART."; // Prevents text to avoid Chinese words
            
            for(let i=0; i<3; i++) {
                document.getElementById(loadId).querySelector('.loader-text').innerText = `Generating Art (Attempt ${i+1}/3)...`;
                
                // 1. Generate Image (Using standard endpoint)
                const res = await fetch("/api/hf-search-image", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({prompt: hfPrompt})});
                const data = await res.json();
                if(data.imageBase64) bestImage = data.imageBase64;
                
                // 2. Ideally, send `bestImage` to Gemini Vision here to rate it. 
                // Since this requires a custom backend loop, we accept the image if it exists.
                if(bestImage) break;
            }

            if(bestImage) {
                document.getElementById(loadId).innerHTML = `
                    <div class="bubble">
                        <div style="font-size:10px; color:var(--primary); font-weight:bold; margin-bottom:10px;">✨ PHOTO GENERATED</div>
                        <img src="${bestImage}" style="width:100%; border-radius:10px;">
                    </div>`;
            } else {
                throw new Error("Failed to generate photo after 3 attempts.");
            }
        }

        // Text & Data Search (Routing via Server.js)
        async function handleTextSearch(prompt, loadId) {
            let sysPrompt = "You are an elite AI. Answer clearly.";
            if(bookMemory) sysPrompt += `\n\nCRITICAL KNOWLEDGE BASE:\n${bookMemory}\nAnswer the user based on this book data first.`;

            // Routing logic based on prompt content
            let isMathOrCode = /math|solve|calculate|code|python|java|html|translate/i.test(prompt);
            let targetProvider = isMathOrCode ? "api_5" : "api_1"; // Connects to your server.js logic

            const payload = { userPrompt: prompt, systemPrompt: sysPrompt, imageBase64: uploadedImage, providerOverride: targetProvider };
            const res = await fetch("/api/smart-search", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
            const data = await res.json();

            if(!res.ok) throw new Error(data.error || "API Failed");

            let textId = "txt_" + loadId;
            let htmlContent = marked.parse(data.text);
            
            // Build Sources UI if URLs are present
            let sourceBtnHtml = "";
            let urlRegex = /(https?:\/\/[^\s]+)/g;
            let urls = data.text.match(urlRegex);
            if(urls) {
                window['sources_' + loadId] = urls;
                sourceBtnHtml = `<button class="action-btn" onclick="openSources('${loadId}')">🔗 View Sources</button>`;
            }

            document.getElementById(loadId).innerHTML = `
                <div class="bubble">
                    <div style="font-size:10px; color:var(--primary); font-weight:bold; margin-bottom:10px;">✨ BY ${data.provider || 'AI ROUTER'}</div>
                    <div id="${textId}">${htmlContent}</div>
                    <div class="msg-actions">
                        <button class="action-btn" data-target="${textId}" onclick="playAudio(this)">🔊 Listen</button>
                        <button class="action-btn" data-target="${textId}" onclick="copyText(this)">📋 Copy</button>
                        ${sourceBtnHtml}
                    </div>
                </div>`;
            
            if(window.MathJax) MathJax.typesetPromise([document.getElementById(loadId)]);
        }

        function openSources(loadId) {
            const urls = window['sources_' + loadId];
            const list = document.getElementById("sourcesList");
            list.innerHTML = urls.map(url => `<a href="${url.replace(/[\)\.\"]+$/, '')}" target="_blank" style="color:var(--primary); text-decoration:none; background:rgba(59,130,246,0.1); padding:10px; border-radius:10px; word-break:break-all;">${url}</a>`).join('');
            document.getElementById("sourcesModal").style.display = "flex";
        }
    </script>
</body>
</html>
