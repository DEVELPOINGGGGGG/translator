    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    
    <script>
      MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
    </script>
    <script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>

    <style>
        /* JS ANIMATION UTILITIES ONLY */
        .ripple {
            position: absolute; border-radius: 50%; transform: scale(0);
            animation: ripple-anim 0.6s linear; background-color: rgba(255, 255, 255, 0.4); pointer-events: none;
        }
        @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }
        .btn-relative { position: relative; overflow: hidden; }
        
        .api-badge {
            position: absolute; top: 12px; right: 16px; font-size: 9px; color: #10b981; 
            font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            background: rgba(16, 185, 129, 0.1); padding: 4px 8px; border-radius: 10px;
            border: 1px solid rgba(16, 185, 129, 0.3); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideDownPlayer {
            0% { transform: translate(-50%, -50px); opacity: 0; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }

        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            50% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-mic {
            animation: pulse-red 1.5s infinite;
            background: rgba(239, 68, 68, 0.2) !important;
            border: 1px solid #ef4444 !important;
            color: white !important;
        }

        mjx-container[display="true"] {
            overflow-x: auto !important;
            overflow-y: hidden !important;
            max-width: 100% !important;
            padding-bottom: 8px !important; 
            padding-top: 5px !important;
        }
        mjx-container:not([display="true"]) {
            white-space: normal;
        }
    </style>
</head>
<body class="chat-page-layout">

    <div id="micLangModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:10002; justify-content:center; align-items:center; backdrop-filter:blur(5px);">

            <button class="btn-relative" onclick="createRipple(event); startVoiceRecognition('en-US')" style="width:100%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.2); color:var(--text-main); padding:12px; border-radius:12px; font-size:16px; font-weight:bold; margin-bottom:15px; cursor:pointer;">🇺🇸 English</button>

            <div class="closeBtn" style="position:absolute; top:-10px; right:-10px; width:28px; height:28px; font-size:12px; background:#e11d48; color:white; display:flex; justify-content:center; align-items:center; border-radius:50%;" onclick="clearPdfFile(event)">✕</div>

                    <button class="btn-relative" style="background:var(--input-bg); border:none; color:var(--text-main); cursor:pointer; display:flex; align-items:center; gap:12px; padding:12px 15px; border-radius:12px; font-size:15px; text-align:left; font-weight:600; width:100%;" onclick="createRipple(event); setTimeout(openStandaloneCamera, 200); toggleAttachmentMenu();">📸 Camera</button>

    <script>
        // --- 1. STATE VARIABLES, WEBHOOK & HISTORY ---
        const GOOGLE_SHEETS_WEBHOOK = "https://script.google.com/macros/s/AKfycbz1_gv9M2QYJcWkkUQMlDtpBXajrV0psXXc9q68LZLJkZ0b_rokKsz6fyKcYzJ8R6Dsnw/exec";
        
        let appHistory = [];
        try { appHistory = JSON.parse(localStorage.getItem('aiHistory') || '[]'); } catch(e) { appHistory = []; }
        let sessionCache = { search: null }; 

        let standaloneCapturedImage = null;
        let persistentPdfMemory = "";
        let sessionMessages = [];
        let isProcessing = false;
        
        let visionReqs = parseInt(localStorage.getItem('visionReqs') || '0');
        let textReqs = parseInt(localStorage.getItem('textReqs') || '0');
        let hasResetToday = false;

        // IMAGE CREATOR MODES & LIMITS
        let isImageGenMode = false;
        const DAILY_IMAGE_LIMIT = 20; // Increased to 20 since we are using a free api!

        // LANGUAGE TOGGLE
        let currentSearchLang = "Hindi";
        window.toggleSearchLanguage = function() {
            const langText = document.getElementById('langText');
            if (currentSearchLang === "Hindi") {
                currentSearchLang = "English";
                langText.innerText = "EN";
                if(typeof showStandaloneToast === 'function') showStandaloneToast("🌍 Language changed to English");
            } else {
                currentSearchLang = "Hindi";
                langText.innerText = "HI";
                if(typeof showStandaloneToast === 'function') showStandaloneToast("🌍 Language changed to Hindi");
            }
        };

        // Activate Image Mode (NO PUTER SIGN IN REQUIRED)
        window.activateImageCreatorMode = async function() {
            isImageGenMode = true;
            document.getElementById("searchInput").placeholder = "Describe the image to create (e.g. A futuristic city...)";
            showStandaloneToast("🎨 Image Creator Active! Type your prompt.");
            
            const chip = document.getElementById("pdfPreviewChip");
            chip.style.display = "flex";
            document.getElementById("pdfName").innerText = "Image Creator";
            chip.querySelector('div').innerText = "🎨";
        };

        // --- 2. DB LOGIC ---
        function saveHistorySafe() { try { localStorage.setItem('aiHistory', JSON.stringify(appHistory)); } catch(e) { appHistory.pop(); saveHistorySafe(); } }
        function persistHistoryOnChatClose(reason = "page-close") {
            try { saveHistorySafe(); } catch(e) {}
        }
        window.addEventListener('pagehide', persistHistoryOnChatClose);
        window.addEventListener('beforeunload', persistHistoryOnChatClose);
        
        function saveToHistory(type, q, a, img = null, provider = "AI") {
            let sessionId = sessionCache[type];
            let histItem = appHistory.find(i => i.id === sessionId);
            if (!histItem) {
                sessionId = Date.now(); sessionCache[type] = sessionId; 
                histItem = { id: sessionId, type: type, title: (q || "Search").substring(0, 25) + '...', interactions: [{ question: q, answer: a, image: img, provider: provider }], provider: provider, question: q, answer: a };
                appHistory.unshift(histItem);
            } else {
                histItem.interactions.push({ question: q, answer: a, image: img, provider: provider });
                histItem.question = q; histItem.answer = a; 
            }
            saveHistorySafe();
        }

        window.copyToClipboard = function(textId) { 
            navigator.clipboard.writeText(document.getElementById(textId).innerText).then(() => showStandaloneToast("✅ Copied to clipboard!")); 
        }

        window.downloadGeneratedImage = function(imgId) {
            let img = document.getElementById(imgId);
            if(!img) return;
            let a = document.createElement("a");
            a.href = img.src;
            a.download = `AI_Image_${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showStandaloneToast("✅ Image download started!");
        };

        // --- 3. ANIMATIONS & EFFECTS ---
        function createRipple(event) {
            const button = event.currentTarget;
            const circle = document.createElement("span");
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - button.getBoundingClientRect().left - radius}px`;
            circle.style.top = `${event.clientY - button.getBoundingClientRect().top - radius}px`;
            circle.classList.add("ripple");
            const ripple = button.getElementsByClassName("ripple")[0];
            if (ripple) ripple.remove();
            button.appendChild(circle);
        }

        function fireParticles(element) {
            const rect = element.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            for(let i=0; i<30; i++) {
                let p = document.createElement('div');
                p.style.position = 'fixed'; p.style.left = x+'px'; p.style.top = y+'px';
                p.style.width = Math.random() * 8 + 4 + 'px'; p.style.height = p.style.width;
                p.style.background = ['#38bdf8', '#c084fc', '#f472b6', '#34d399', '#facc15'][Math.floor(Math.random()*5)];
                p.style.borderRadius = '50%'; p.style.pointerEvents = 'none'; p.style.zIndex = 99999;
                document.body.appendChild(p);
                let angle = Math.random() * Math.PI * 2;
                let velocity = 2 + Math.random() * 8;
                let dx = Math.cos(angle) * velocity; let dy = Math.sin(angle) * velocity;
                let opacity = 1;
                function animateParticle() {
                    let currentX = parseFloat(p.style.left); let currentY = parseFloat(p.style.top);
                    p.style.left = (currentX + dx) + 'px'; p.style.top = (currentY + dy) + 'px';
                    opacity -= 0.02; p.style.opacity = opacity; dy += 0.2; 
                    if(opacity > 0) requestAnimationFrame(animateParticle); else p.remove();
                }
                requestAnimationFrame(animateParticle);
            }
        }

        function typeWriterEffect(element, text) {
            element.innerHTML = ""; let i = 0;
            const maxDurationMs = 10000; let tickRate = 20; 
            let totalTicksAllowed = maxDurationMs / tickRate; let charsPerTick = 1;
            if (text.length > totalTicksAllowed) { charsPerTick = Math.ceil(text.length / totalTicksAllowed); } else if (text.length < 150) { tickRate = 35; }
            let timer = setInterval(() => {
                if (i < text.length) {
                    let chunk = text.substr(i, charsPerTick);
                    for(let c of chunk) {
                        if(c === '\n') { element.appendChild(document.createElement('br')); } else { element.appendChild(document.createTextNode(c)); }
                    }
                    i += charsPerTick;
                } else { 
                    clearInterval(timer);
                    if (window.MathJax) { MathJax.typesetPromise([element]).catch(e => console.log(e)); }
                }
            }, tickRate);
        }

        // --- 4. SPEECH RECOGNITION ---
        let speechRecog = null; let isRecording = false;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            speechRecog = new SpeechRecognition(); speechRecog.continuous = false; speechRecog.interimResults = true;
            speechRecog.onstart = () => { isRecording = true; const mic = document.getElementById("micBtn"); if (mic) mic.classList.add("recording-mic"); };
            speechRecog.onresult = (e) => {
                let transcript = ""; for (let i = 0; i < e.results.length; i++) { transcript += e.results[i][0].transcript; }
                const inp = document.getElementById("searchInput"); if (inp) inp.value = transcript;
            };
            speechRecog.onerror = () => { stopVoiceRecognition(); };
            speechRecog.onend = () => { stopVoiceRecognition(); };
        }
        window.openMicModal = function() { if (!speechRecog) return showStandaloneToast("⚠️ Voice recognition not supported."); if (isRecording) { stopVoiceRecognition(); } else { document.getElementById("micLangModal").style.display = "flex"; } }
        window.closeMicModal = function() { document.getElementById("micLangModal").style.display = "none"; }
        window.startVoiceRecognition = function(lang) { closeMicModal(); if (speechRecog) { speechRecog.lang = lang; const inp = document.getElementById("searchInput"); if(inp && !inp.value) inp.value = "Listening..."; speechRecog.start(); } }
        window.stopVoiceRecognition = function() { isRecording = false; if (speechRecog) speechRecog.stop(); const mic = document.getElementById("micBtn"); if (mic) mic.classList.remove("recording-mic"); const inp = document.getElementById("searchInput"); if (inp && inp.value === "Listening...") inp.value = ""; }

        // --- 5. SMART TTS PLAYER ENGINE ---
        let ttsSentences = []; let currentSentenceIndex = 0; let isBracketReadingEnabled = true; let isCancelingForToggle = false;
        window.startTts = function(elementId) {
            const el = document.getElementById(elementId); if (!el) return;
            let fullText = el.innerText || el.textContent;
            ttsSentences = fullText.match(/[^.!?।\n]+[.!?।\n]*/g) || [fullText];
            currentSentenceIndex = 0;
            document.getElementById("ttsPlayer").style.display = "flex";
            document.getElementById("ttsPlayPauseBtn").innerText = "⏸️";
            window.speechSynthesis.cancel(); setTimeout(playNextSentence, 50);
        };
        function playNextSentence() {
            if (currentSentenceIndex >= ttsSentences.length) { document.getElementById("ttsPlayPauseBtn").innerText = "▶️"; return; }
            let originalSentence = ttsSentences[currentSentenceIndex];
            if (!originalSentence || !originalSentence.trim()) { currentSentenceIndex++; playNextSentence(); return; }

            let processedText = originalSentence;
            if (isBracketReadingEnabled) {
                processedText = processedText.replace(/-/g, " ghatav ").replace(/\+/g, " jor ").replace(/%/g, " pratishat ").replace(/\(/g, " bracket ").replace(/\)/g, " bracket ").replace(/\{/g, " madhyam kosthak ").replace(/\}/g, " madhyam kosthak ").replace(/\[/g, " bara kosthak ").replace(/\]/g, " bara kosthak ");
            } else { processedText = processedText.replace(/\([^)]*\)/g, " ").replace(/\[[^\]]*\]/g, " ").replace(/\{[^}]*\}/g, " "); }
            processedText = processedText.replace(/[\*#]/g, "");

            let ttsUtterance = new SpeechSynthesisUtterance(processedText);
            ttsUtterance.lang = 'hi-IN'; ttsUtterance.rate = 0.9;
            let voices = window.speechSynthesis.getVoices();
            let hindiVoice = voices.find(v => v.name.includes('Google') && v.lang.includes('hi')) || voices.find(v => v.lang.includes('hi')) || voices[0];
            if (hindiVoice) ttsUtterance.voice = hindiVoice;
            ttsUtterance.onend = () => { if (isCancelingForToggle) return; currentSentenceIndex++; playNextSentence(); };
            ttsUtterance.onerror = (e) => { if (isCancelingForToggle) return; if(e.error !== 'canceled') document.getElementById("ttsPlayPauseBtn").innerText = "▶️"; };
            window.speechSynthesis.speak(ttsUtterance); document.getElementById("ttsPlayPauseBtn").innerText = "⏸️";
        }
        window.toggleTts = function() {
            if (window.speechSynthesis.paused) { window.speechSynthesis.resume(); document.getElementById("ttsPlayPauseBtn").innerText = "⏸️"; } else if (window.speechSynthesis.speaking) { window.speechSynthesis.pause(); document.getElementById("ttsPlayPauseBtn").innerText = "▶️"; } else { if(currentSentenceIndex >= ttsSentences.length) currentSentenceIndex = 0; playNextSentence(); }
        };
        window.toggleBracketReading = function() {
            isBracketReadingEnabled = !isBracketReadingEnabled; const btn = document.getElementById("ttsBracketBtn");
            if (isBracketReadingEnabled) { btn.innerText = "[x] Read Brackets"; btn.style.background = "rgba(56,189,248,0.2)"; btn.style.borderColor = "#38bdf8"; } else { btn.innerText = "[ ] Skip Brackets"; btn.style.background = "rgba(255,255,255,0.1)"; btn.style.borderColor = "rgba(255,255,255,0.2)"; }
            if (window.speechSynthesis.speaking || window.speechSynthesis.paused) { isCancelingForToggle = true; window.speechSynthesis.cancel(); setTimeout(() => { isCancelingForToggle = false; playNextSentence(); }, 100); }
        };
        window.closeTts = function() { window.speechSynthesis.cancel(); document.getElementById("ttsPlayer").style.display = "none"; ttsSentences = []; currentSentenceIndex = 0; };

        // --- 7. INITIALIZATION & TRACKER ---
        document.addEventListener("DOMContentLoaded", () => {
            const chatContainer = document.getElementById("searchChatHistory");
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="chat-msg chat-ai">
                    <div class="bubble">
                        👋 <b>Welcome to Deep Search!</b><br><br>
                        1. <b>➕ Button:</b> Attach a PDF, Camera, or Generate an Image!<br>
                        2. <b>Model:</b> Choose Gemini, Groq, or Cloudflare.<br>
                        3. <b>Search:</b> Type any question; I will answer it.<br>
                        <br><i style="color: var(--muted); font-size: 13px;">Note: I will remember your PDF and conversation during our chat!</i>
                    </div>
                </div>
            `);

            const inp = document.getElementById("searchInput");
            inp.addEventListener("keypress", function(e) { if(e.key === "Enter" && !e.shiftKey) { e.preventDefault(); runStandaloneSearch(); } });
            startApiTracker();
        });

        function toggleSidebar() { const sidebar = document.getElementById("sidebar"); const overlay = document.getElementById("overlay"); const active = !sidebar.classList.contains("active"); sidebar.classList.toggle("active", active); overlay.classList.toggle("active", active); document.body.classList.toggle("sidebar-open", active); }
        function toggleAttachmentMenu() { const menu = document.getElementById('attachmentMenu'); menu.style.display = menu.style.display === 'none' ? 'flex' : 'none'; }
        function scrollToBottom() { const c = document.getElementById("searchChatHistory"); if (!c) return; requestAnimationFrame(() => c.scrollTo({ top: c.scrollHeight, behavior: "auto" })); setTimeout(() => c.scrollTo({ top: c.scrollHeight, behavior: "auto" }), 80); }
        
        function clearSearchChat() {
            if(confirm("Are you sure you want to clear this chat and memory?")) {
                document.getElementById("searchChatHistory").innerHTML = `<div class="chat-msg chat-ai"><div class="bubble">Chat and memory cleared. How can I help you next?</div></div>`;
                persistHistoryOnChatClose('manual-clear'); clearSearchImage(); clearPdfFile(); persistentPdfMemory = ""; sessionMessages = []; sessionCache['search'] = null; closeTts();
            }
        }

        function showStandaloneToast(msg) {
            let t = document.createElement('div'); t.innerText = msg;
            t.style.cssText = "position:fixed; bottom:120px; left:50%; transform:translateX(-50%); background: var(--gemini-grad); color:black; padding:12px 25px; border-radius:30px; box-shadow:0 10px 25px rgba(0,242,254,0.4); z-index:10000; font-weight:800; font-size: 14px; text-align:center; animation: slideUp 0.3s ease-out;";
            document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
        }

        function updateTrackerDisplay() { document.getElementById('apiTotal').innerText = visionReqs + textReqs; document.getElementById('apiVision').innerText = visionReqs; document.getElementById('apiText').innerText = textReqs; }
        function trackAPI(type) { if(type === 'v') { visionReqs++; localStorage.setItem('visionReqs', visionReqs); } else { textReqs++; localStorage.setItem('textReqs', textReqs); } updateTrackerDisplay(); }

        function startApiTracker() {
            updateTrackerDisplay();
            setInterval(() => {
                const now = new Date(); const laTime = new Date(now.toLocaleString("en-US", { timeZone: "America/Los_Angeles" })); const nextMidnight = new Date(laTime); nextMidnight.setHours(24, 0, 0, 0);
                let diffMs = nextMidnight - laTime; let h = Math.floor(diffMs / (1000 * 60 * 60)), m = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60)), s = Math.floor((diffMs % (1000 * 60)) / 1000);
                if (h === 24) { h = 0; m = 0; s = 0; } const pad = (num) => num.toString().padStart(2, '0');
                if (laTime.getHours() === 0 && laTime.getMinutes() === 0 && !hasResetToday) { 
                    visionReqs = 0; textReqs = 0; 
                    localStorage.setItem('visionReqs', '0'); localStorage.setItem('textReqs', '0'); 
                    localStorage.setItem('imgGenReqs', '0'); 
                    hasResetToday = true; updateTrackerDisplay(); 
                } else if (laTime.getHours() !== 0) { hasResetToday = false; }
                const t = document.getElementById('apiTimer'); if(t) t.innerText = `${pad(h)}h ${pad(m)}m ${pad(s)}s`;
            }, 1000);
        }

        // --- 8. PERSISTENT PDF & CLEARANCE ---
        async function handlePdfUpload(event) {
            const file = event.target.files[0]; if (!file) return;
            if (file.type !== "application/pdf") return showStandaloneToast("⚠️ Only PDF files are supported!");
            isImageGenMode = false; // Override Image mode
            showStandaloneToast("📄 Reading PDF..."); const fileReader = new FileReader();
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                try {
                    const pdf = await pdfjsLib.getDocument(typedarray).promise; let fullText = `DOCUMENT NAME: ${file.name}\n`;
                    for (let i = 1; i <= pdf.numPages; i++) { const page = await pdf.getPage(i); const textContent = await page.getTextContent(); fullText += `\n--- Page ${i} ---\n` + textContent.items.map(item => item.str).join(' '); }
                    persistentPdfMemory = fullText; const chip = document.getElementById("pdfPreviewChip");
                    chip.style.display = "flex"; document.getElementById("pdfName").innerText = file.name;
                    chip.querySelector('div').innerText = "📄";
                    showStandaloneToast(`✅ PDF Attached!`);
                } catch(e) { showStandaloneToast("❌ Error reading PDF."); }
            }; fileReader.readAsArrayBuffer(file);
        }
        
        window.clearPdfFile = function(e) { 
            if(e) e.stopPropagation(); 
            persistentPdfMemory = ""; 
            isImageGenMode = false;
            document.getElementById("pdfUploadInput").value = ""; 
            const chip = document.getElementById("pdfPreviewChip");
            chip.style.display = "none"; 
            document.getElementById("searchInput").placeholder = "Search web, ask a question...";
            chip.querySelector('div').innerText = "📄";
        };

        // --- 9. PRO CAMERA ENGINE ---
        let standaloneStream = null; let standaloneFacingMode = "environment"; let isStandaloneFlashOn = false;
        async function startCameraTrack() {
            if (standaloneStream) { standaloneStream.getTracks().forEach(t => t.stop()); }
            try {
                standaloneStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: standaloneFacingMode, width: {ideal: 1920}, height: {ideal: 1080} } });
                document.getElementById("standaloneVideo").srcObject = standaloneStream;
                setTimeout(async () => { if (standaloneFacingMode === "environment") { const track = standaloneStream.getVideoTracks()[0]; try { const cap = track.getCapabilities(); if (cap.torch) { isStandaloneFlashOn = true; await track.applyConstraints({ advanced: [{ torch: true }] }); updateFlashUI(); } } catch(err) {} } }, 500);
            } catch(e) { showStandaloneToast("⚠️ Camera Error."); }
        }
        async function openStandaloneCamera() { isImageGenMode = false; document.getElementById("standaloneCameraModal").classList.add("active"); await startCameraTrack(); }
        function closeStandaloneCamera() { document.getElementById("standaloneCameraModal").classList.remove("active"); if (standaloneStream) { const track = standaloneStream.getVideoTracks()[0]; try { if (track && track.getCapabilities().torch) track.applyConstraints({ advanced: [{ torch: false }] }); } catch(err) {} standaloneStream.getTracks().forEach(t => t.stop()); standaloneStream = null; } isStandaloneFlashOn = false; updateFlashUI(); }
        async function switchStandaloneCamera() { standaloneFacingMode = standaloneFacingMode === "environment" ? "user" : "environment"; await startCameraTrack(); }
        async function toggleStandaloneFlash() { if (!standaloneStream) return; const track = standaloneStream.getVideoTracks()[0]; try { if (track.getCapabilities().torch) { isStandaloneFlashOn = !isStandaloneFlashOn; await track.applyConstraints({ advanced: [{ torch: isStandaloneFlashOn }] }); updateFlashUI(); } } catch(err){} }
        function updateFlashUI() { const btn = document.getElementById("standaloneFlashBtn"); if (btn) { btn.innerText = isStandaloneFlashOn ? "💡" : "🔦"; btn.style.background = isStandaloneFlashOn ? "rgba(239, 68, 68, 0.8)" : "rgba(255,255,255,0.15)"; } }
        function captureStandalonePhoto() {
            const v = document.getElementById("standaloneVideo"); const c = document.getElementById("standaloneCanvas");
            let w = v.videoWidth, h = v.videoHeight; if(w > 1500) { h *= 1500/w; w = 1500; } c.width = w; c.height = h; c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
            standaloneCapturedImage = c.toDataURL("image/jpeg", 0.7); const chip = document.getElementById("mathPreviewChip"); chip.style.display = "block"; chip.style.backgroundImage = `url(${standaloneCapturedImage})`; closeStandaloneCamera();
        }
        function clearSearchImage(e) { if(e) e.stopPropagation(); standaloneCapturedImage = null; document.getElementById("mathPreviewChip").style.display = "none"; }

        // --- 10. CORE SEARCH & IMAGE GEN LOGIC ---
        async function runStandaloneSearch() {
            const inp = document.getElementById("searchInput"); const q = inp.value.trim(); 
            if(!q && !standaloneCapturedImage && !persistentPdfMemory) return; if(isProcessing) return; isProcessing = true;
            const chatContainer = document.getElementById("searchChatHistory");
            const selectedModel = document.getElementById("modelSelector").value;

            // ==========================================
            // 🎨 SECURE HUGGING FACE IMAGE GENERATOR 🎨
            // ==========================================
            if (isImageGenMode) {
                let imgGenReqs = parseInt(localStorage.getItem('imgGenReqs') || '0');
                if (imgGenReqs >= DAILY_IMAGE_LIMIT) {
                    showStandaloneToast("❌ LIMIT REACHED! Wait until tomorrow.");
                    isProcessing = false;
                    return;
                }

                chatContainer.insertAdjacentHTML('beforeend', `<div class="chat-msg chat-user"><div class="bubble">🎨 <b>Generate Image:</b><br>${q}</div></div>`);
                inp.value = ""; scrollToBottom();

                const loadId = "load_" + Date.now();
                chatContainer.insertAdjacentHTML('beforeend', `<div class="chat-msg chat-ai" id="${loadId}"><div class="bubble" style="display:flex; align-items:center; gap:12px;"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div><span style="color:var(--muted); font-size:14px; font-weight:600;">Enhancing prompt & Creating via Secure Backend...</span></div></div>`);
                scrollToBottom();

                try {
                    // STEP 1: Enhance prompt using Gemini
                    let sysPrompt = "You are a master AI Prompt Engineer. Rewrite this user idea into a highly detailed, cinematic, and beautifully descriptive prompt for an AI Image Generator. Reply ONLY with the English prompt. NO quotes, NO conversational filler. Idea: " + q;
                    
                    const response = await fetch("/api/gemini-text", { 
                        method: "POST", 
                        headers: { "Content-Type": "application/json" }, 
                        body: JSON.stringify({ systemPrompt: sysPrompt, userPrompt: q, providerOverride: "gemini" }) 
                    });
                    const data = await response.json();
                    let enhancedPrompt = data.text ? data.text.replace(/['"]/g, '').trim() : q;

                    // STEP 2: Ask YOUR secure backend to generate the image
                    const genResponse = await fetch("/api/generate-image", { 
                        method: "POST", 
                        headers: { "Content-Type": "application/json" }, 
                        body: JSON.stringify({ prompt: enhancedPrompt }) 
                    });
                    
                    const genData = await genResponse.json();
                    if (!genResponse.ok) throw new Error(genData.error || "Image Generation Failed");
                    
                    let base64Image = genData.imageBase64;

                    imgGenReqs++;
                    localStorage.setItem('imgGenReqs', imgGenReqs);

                    let finalHtml = `
                        <div class="api-badge" style="background:rgba(16,185,129,0.1); border-color:#10b981; color:#10b981;">✨ SECURE AI GENERATOR</div>
                        <div style="margin-top:20px; font-size:13px; color:var(--text-main); font-weight:600;">Enhanced Prompt:</div>
                        <div style="font-size:12px; color:var(--text-muted); font-style:italic; margin-bottom:10px;">"${enhancedPrompt}"</div>
                        
                        <div style="position:relative; display:inline-block; margin-top:10px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.3);" id="container_${loadId}">
                            <button onclick="document.getElementById('container_${loadId}').style.display='none'" style="position:absolute; top:-12px; right:-12px; background:#e11d48; color:white; border:2px solid var(--bg-surface); border-radius:50%; width:32px; height:32px; cursor:pointer; font-weight:bold; z-index:10; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,0.5);">✕</button>
                            <img src="${base64Image}" style="max-width:100%; border-radius:12px;" id="img_${loadId}">
                        </div>

                        <div style="margin-top:15px; border-top:1px solid var(--border-light); padding-top:12px; display:flex; gap: 10px;">
                            <button class="btn-relative" style="background:rgba(16,185,129,0.15); color:#10b981; border:1px solid rgba(16,185,129,0.4); padding:8px 20px; border-radius:20px; font-size:14px; cursor:pointer; font-weight:bold; flex: 1;" onclick="createRipple(event); downloadGeneratedImage('img_${loadId}')">📥 Download Image</button>
                        </div>
                    `;

                    document.getElementById(loadId).querySelector('.bubble').innerHTML = finalHtml;
                    saveToHistory('search', `Generate Image: ${q}`, finalHtml, null, "Secure Backend API");

                    clearPdfFile(); 
                } catch (error) { 
                    document.getElementById(loadId).querySelector('.bubble').innerHTML = `<span style="color: #ef4444;">❌ Error: ${error.message}</span>`; 
                } finally { isProcessing = false; }
                
                return; 
            }
            // ==========================================

            let displayQ = q || "Analyze this document."; let imgHtml = standaloneCapturedImage ? `<img src="${standaloneCapturedImage}" class="bubble-img">` : '';
            chatContainer.insertAdjacentHTML('beforeend', `<div class="chat-msg chat-user"><div class="bubble">${imgHtml}<div>${displayQ.replace(/\n/g, '<br>')}</div></div></div>`);
            inp.value = ""; scrollToBottom(); 

            const loadId = "load_" + Date.now();
            chatContainer.insertAdjacentHTML('beforeend', `<div class="chat-msg chat-ai" id="${loadId}"><div class="bubble" style="display:flex; align-items:center; gap:12px;"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div><span style="color:var(--muted); font-size:14px; font-weight:600;">AI is thinking...</span></div></div>`);
            scrollToBottom();

            let memoryContextString = "";
            if (sessionMessages.length > 0) {
                memoryContextString = "--- PREVIOUS CHAT HISTORY ---\n";
                let recent = sessionMessages.slice(-6); recent.forEach(msg => { memoryContextString += `User: ${msg.q}\nAI: ${msg.a}\n\n`; });
                memoryContextString += "--- CURRENT QUESTION ---\n";
            }

            let sysPrompt = `You are an expert AI Assistant and Guide. 
            CRITICAL RULES:
            1. YOU MUST ANSWER ENTIRELY IN ${currentSearchLang.toUpperCase()}. DO NOT USE OTHER LANGUAGES.
            2. If the user provides a document and asks "how to fill it", DO NOT say the document lacks instructions. 
            3. Use your general internet knowledge combined with the provided document context to explain EXACTLY how to fulfill the user's request step-by-step.
            4. If the user asks a MATH question or you detect math/physics formulas, YOU MUST solve it step-by-step and use standard LaTeX formatting (e.g. $E=mc^2$ or $$\\frac{a}{b}$$).
            5. ALWAYS remember the user's previous context from the Chat History.`;

            let finalPrompt = memoryContextString + `User Question: ${q || 'Please help me with this document.'}\n\n`;
            if (persistentPdfMemory) finalPrompt += `[BACKGROUND DOCUMENT CONTEXT]:\n${persistentPdfMemory}`;

            try {
                let endpoint = standaloneCapturedImage ? "/api/gemini-vision" : "/api/gemini-text";
                let bodyData = standaloneCapturedImage ? { imageBase64: standaloneCapturedImage, userPrompt: `${sysPrompt}\n\n${finalPrompt}`, providerOverride: selectedModel } : { systemPrompt: sysPrompt, userPrompt: finalPrompt, providerOverride: selectedModel };

                const response = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(bodyData) });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Server Error");

                let cleanAns = data.text.replace(/[\*&#_]/g, ''); let apiProvider = data.provider || selectedModel.toUpperCase(); 
                
                trackAPI(standaloneCapturedImage ? 'v' : 't');
                sessionMessages.push({ q: q || "[Image/PDF Upload]", a: cleanAns });
                saveToHistory('search', q || "[Document/Image Analysis]", cleanAns, standaloneCapturedImage, apiProvider);
                
                clearSearchImage(); document.getElementById("pdfPreviewChip").style.display = "none";
                
                const finalBubble = document.getElementById(loadId).querySelector('.bubble');
                
                finalBubble.innerHTML = `
                    <div class="api-badge">✨ BY ${apiProvider}</div>
                    <div id="text_${loadId}" style="margin-top:10px; line-height: 1.6;"></div>
                    <div style="margin-top:15px; border-top:1px solid var(--border-light); padding-top:12px; display:flex; gap: 10px;">
                        <button class="btn-relative" style="background:rgba(56,189,248,0.15); color:#38bdf8; border:1px solid rgba(56,189,248,0.4); padding:8px 20px; border-radius:20px; font-size:14px; cursor:pointer; font-weight:bold; flex: 1;" onclick="createRipple(event); startTts('text_${loadId}')">🔊 Listen</button>
                        <button class="btn-relative" style="background:rgba(255,255,255,0.05); color:var(--text-main); border:1px solid var(--border-light); padding:8px 20px; border-radius:20px; font-size:14px; cursor:pointer; font-weight:bold; flex: 1;" onclick="createRipple(event); copyToClipboard('text_${loadId}')">📋 Copy</button>
                    </div>
                `;
                
                fireParticles(finalBubble); typeWriterEffect(document.getElementById(`text_${loadId}`), cleanAns);

            } catch (error) { document.getElementById(loadId).querySelector('.bubble').innerHTML = `<span style="color: #ef4444;">❌ Error: ${error.message}</span>`; } finally { isProcessing = false; }
        }
    </script>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const restoreId = urlParams.get('restore');
        if (!restoreId) return;

        setTimeout(() => {
            let container = document.querySelector('.chat-scroll-area') || 
                            document.getElementById('searchChatHistory');
                            
            if (!container) return;

            const forceInjectData = (historyData) => {
                let item = historyData.find(i => i.id == restoreId);
                if (!item) return;

                if (item.interactions && item.interactions.length > 0 && container.classList.contains('chat-scroll-area')) {
                    container.innerHTML = ''; 
                    
                    item.interactions.forEach((inter, index) => {
                        let imgHtml = inter.image ? `<img src="${inter.image}" class="bubble-img" style="max-width:100%; border-radius:16px; margin-bottom:15px; border: 2px solid var(--border-light); box-shadow: var(--glass-shadow);">` : '';
                        let textId = `restored_text_${index}`;
                        
                        container.insertAdjacentHTML('beforeend', `
                            <div class="chat-msg chat-user" style="animation: slideInUp 0.5s ease-out;">
                                <div class="bubble" style="background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border-bottom-right-radius: 6px; box-shadow: 0 8px 25px var(--primary-glow);">
                                    ${imgHtml}
                                    <div>${inter.question.replace(/\n/g, '<br>')}</div>
                                </div>
                            </div>
                            <div class="chat-msg chat-ai" style="animation: bounceInBubble 0.6s ease-out;">
                                <div class="bubble" style="background: var(--bg-surface); border: 1px solid var(--border-light); border-bottom-left-radius: 6px; box-shadow: var(--glass-shadow); display: flex; flex-direction: column;">
                                    
                                    <div id="${textId}" style="margin-top:0; width:100%; overflow-x:auto;">${inter.answer}</div>
                                    
                                </div>
                            </div>
                        `);
                    });
                    
                    setTimeout(() => { container.scrollTop = container.scrollHeight; }, 100);
                    if (typeof showStandaloneToast === 'function') showStandaloneToast("🔄 Search Restored Successfully!");
                } 

                if (window.MathJax) { MathJax.typesetPromise([container]).catch(e => console.log(e)); }
            };

            if (typeof localforage !== 'undefined') {
                localforage.getItem('aiHistory').then(data => {
                    if (data && data.length > 0) forceInjectData(data);
                    else forceInjectData(JSON.parse(localStorage.getItem('aiHistory') || '[]'));
                }).catch(() => forceInjectData(JSON.parse(localStorage.getItem('aiHistory') || '[]')));
            } else {
                forceInjectData(JSON.parse(localStorage.getItem('aiHistory') || '[]'));
            }
            
        }, 800); 
    });
</script>
<script src="ui-controls.js" defer></script>
