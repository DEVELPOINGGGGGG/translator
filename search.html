<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Search & AI Creator</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    
    <script>
        MathJax = { 
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root { --app-font-scale: 1; }
        body { font-size: calc(15px * var(--app-font-scale)); }
        
        .chat-time { font-size: 10px; color: var(--text-muted); margin-top: 5px; text-align: right; opacity: 0.7; }

        /* --- TRUE FOCUS MODE --- */
        body.focus-mode .topbar { display: none !important; }
        body.focus-mode .chat-input-area { display: none !important; }
        body.focus-mode #searchChatHistory { padding-bottom: 50px !important; margin-top: 20px !important; height: 100vh; overflow-y: auto; }
        
        /* Focus Mode Exit Button */
        #exitFocusBtn { display: none; position: fixed; top: 20px; right: 20px; z-index: 100000; background: #ef4444; color: white; border: 2px solid white; border-radius: 50%; width: 45px; height: 45px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        body.focus-mode #exitFocusBtn { display: flex; justify-content: center; align-items: center; }

        /* Settings Modal */
        #settingsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 100000; justify-content: center; align-items: center; }
        .settings-content { background: var(--bg-surface); border: 2px solid var(--primary); border-radius: 20px; padding: 20px; width: 90%; max-width: 400px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); animation: popIn 0.3s ease; }
        .setting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; font-size: 14px; color: var(--text-main); font-weight: 600; }
        .setting-select, .setting-input { background: var(--input-bg); border: 1px solid var(--border-light); color: var(--text-main); padding: 8px; border-radius: 8px; outline: none; font-size: 13px; width: 140px; }
        
        .font-btns { display: flex; gap: 5px; }
        .font-btn { background: var(--input-bg); border: 1px solid var(--border-light); color: var(--text-main); padding: 6px; border-radius: 6px; font-size: 11px; cursor: pointer; }
        .font-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .toggle-switch { position: relative; width: 34px; height: 18px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* Floating Photo Creator */
        #photoCreatorModal { display: none; position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%); background: var(--bg-surface); padding: 15px; border-radius: 16px; border: 2px solid #a855f7; z-index: 1000; box-shadow: 0 15px 40px rgba(0,0,0,0.6); width: 90%; max-width: 350px; animation: slideUp 0.3s ease; }

        /* Thinking Animation */
        .ai-thinking-pulse { display: flex; align-items: center; gap: 10px; }
        .pulse-orb { width: 15px; height: 15px; border-radius: 50%; background: linear-gradient(135deg, var(--secondary), var(--primary)); animation: pulseGlow 1.5s infinite; }
        @keyframes pulseGlow { 0% { transform: scale(0.9); box-shadow: 0 0 5px var(--primary); } 50% { transform: scale(1.1); box-shadow: 0 0 20px var(--primary); } 100% { transform: scale(0.9); box-shadow: 0 0 5px var(--primary); } }

        /* TTS Word Highlight */
        .tts-highlight { color: #3b82f6 !important; font-weight: bold; background: rgba(59, 130, 246, 0.2); border-radius: 4px; padding: 0 2px; transition: background 0.2s; }
        
        /* AI Signature & Code Boxes */
        .ai-signature { font-size: 10px; color: var(--primary); text-transform: uppercase; font-weight: 800; margin-bottom: 8px; letter-spacing: 0.5px; opacity: 0.9; display: flex; align-items: center; gap: 5px; }
        .code-box { background:#0d1117; color:#c9d1d9; border-radius:8px; margin:15px 0; border:1px solid #30363d; overflow:hidden; font-family:monospace; }
        .code-header { background:#161b22; padding:8px 15px; display:flex; justify-content:flex-end; border-bottom:1px solid #30363d; }
        .code-body { padding:15px; overflow-x:auto; font-size:13px; white-space:pre-wrap; }
        .copy-btn { background:#21262d; border:1px solid #30363d; color:#c9d1d9; padding:5px 12px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:11px; }
    </style>
</head>
<body class="chat-page-layout">

    <button id="exitFocusBtn" onclick="toggleFocusMode()" title="Exit Focus Mode">✕</button>

    <div id="settingsModal">
        <div class="settings-content">
            <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
                <h3 style="margin:0; color:var(--primary);">⚙️ Settings & Brain</h3>
                <button onclick="document.getElementById('settingsModal').style.display='none'" style="background:#ef4444; color:white; border:none; width:25px; height:25px; border-radius:50%; cursor:pointer; font-weight:bold;">✕</button>
            </div>
            
            <div class="setting-row">
                <span>🤖 AI Model:</span>
                <select class="setting-select" id="modelSelector">
                    <option value="gemini">✨ Gemini</option>
                    <option value="groq">⚡ Groq</option>
                </select>
            </div>

            <div class="setting-row">
                <span>🌍 Language:</span>
                <select class="setting-select" id="appLang">
                    <option value="en-US" selected>English (Default)</option>
                    <option value="hi-IN">Hindi</option>
                    <option value="es-ES">Spanish</option>
                    <option value="fr-FR">French</option>
                    <option value="de-DE">German</option>
                </select>
            </div>
            
            <div class="setting-row">
                <span>🔠 Font Size:</span>
                <div class="font-btns">
                    <button class="font-btn" onclick="setFont(0.85, this)">Small</button>
                    <button class="font-btn active" onclick="setFont(1, this)">Normal</button>
                    <button class="font-btn" onclick="setFont(1.15, this)">Large</button>
                    <button class="font-btn" onclick="setFont(1.3, this)">XL</button>
                    <button class="font-btn" onclick="setFont(1.5, this)">Max</button>
                </div>
            </div>

            <div class="setting-row">
                <span>🎭 AI Tone:</span>
                <select class="setting-select" id="aiTone">
                    <option value="Standard">Standard</option>
                    <option value="Professional">Professional</option>
                    <option value="Casual">Casual</option>
                </select>
            </div>

            <div class="setting-row">
                <span>🌐 Web Data:</span>
                <label class="toggle-switch"><input type="checkbox" id="webPriority"><span class="slider"></span></label>
            </div>
            
            <div style="margin-top:20px; font-size:12px; color:var(--text-muted); font-weight:bold;">🧠 AI Memory (Brain)</div>
            <textarea id="aiBrainDisplay" readonly style="width:100%; height:60px; background:var(--input-bg); border:1px solid var(--border-light); border-radius:8px; color:var(--text-muted); font-size:11px; padding:8px; margin-top:5px; resize:none;" placeholder="Facts AI has learned about you will appear here..."></textarea>
            <button onclick="clearBrain()" style="width:100%; background:rgba(239, 68, 68, 0.1); color:#ef4444; border:1px solid #ef4444; padding:8px; border-radius:8px; margin-top:5px; cursor:pointer; font-weight:bold; font-size:12px;">Wipe Memory</button>
        </div>
    </div>

    <div id="ttsPlayer" style="display:none; position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--bg-surface); border:1px solid var(--primary); border-radius:30px; padding:10px 20px; box-shadow:0 10px 30px rgba(0,0,0,0.8); z-index:10001; align-items:center; gap:15px; backdrop-filter:blur(10px);">
        <div style="color:var(--primary); font-size:22px;">🎧</div>
        <button id="ttsPlayPauseBtn" onclick="toggleTts()" style="background:none; border:none; color:var(--text-main); font-size:24px; cursor:pointer; width:35px; height:35px;">⏸️</button>
        <button onclick="closeTts()" style="background:#e11d48; border:none; color:white; width:30px; height:30px; border-radius:50%; cursor:pointer; font-weight:bold;">✕</button>
    </div>

    <div id="photoCreatorModal">
        <button style="position:absolute; top:-10px; right:-10px; background:#ef4444; color:white; border:none; border-radius:50%; width:26px; height:26px; cursor:pointer; font-weight:bold; box-shadow:0 4px 10px rgba(0,0,0,0.5);" onclick="document.getElementById('photoCreatorModal').style.display='none'">✕</button>
        <h4 style="margin:0 0 10px 0; color:#a855f7; display:flex; align-items:center; gap:8px;">🎨 Photo Creator</h4>
        <textarea id="photoPromptInput" placeholder="Describe the image you want to create (Use quotes for text)..." style="width:100%; height:70px; background:var(--input-bg); border:1px solid var(--border-light); color:var(--text-main); border-radius:8px; padding:10px; font-size:13px; resize:none; outline:none;"></textarea>
        <button onclick="runFloatingImageCreator()" style="width:100%; margin-top:10px; background:linear-gradient(135deg, #a855f7, #06b6d4); color:white; border:none; padding:12px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:14px; box-shadow: 0 5px 15px rgba(6, 182, 212, 0.4);">🚀 Generate</button>
    </div>

    <div id="fullscreenViewer" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(10px); z-index:99999; justify-content:center; align-items:center; flex-direction:column;">
        <button onclick="document.getElementById('fullscreenViewer').style.display='none'" style="position:absolute; top:30px; right:30px; background:#e11d48; color:white; border:2px solid white; width:45px; height:45px; border-radius:50%; font-size:20px; cursor:pointer;">✕</button>
        <img id="fsImage" style="max-width:90%; max-height:75%; border-radius:16px; object-fit:contain; box-shadow: 0 10px 40px rgba(0,0,0,0.8);">
        <button id="fsDownloadBtn" style="margin-top:25px; background:linear-gradient(135deg, #10b981, #059669); color:white; border:none; padding:15px 40px; border-radius:30px; font-weight:800; cursor:pointer; font-size:18px;" onclick="downloadFullscreenImage()">📥 Download Original</button>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
      <button class="sidebar-close-btn" onclick="toggleSidebar()">✖ Close Menu</button>
      <button onclick="window.location.href='index.html'">🏠 Dashboard</button>
      <button onclick="window.location.href='search.html'" class="active">🔎 Deep Search</button>
      <button onclick="window.location.href='create.html'">🎨 Image Creator</button>
      <button onclick="window.location.href='maths.html'">🧮 Math Solver</button>
      <button onclick="window.location.href='code.html'">💻 Code Assistant</button>
      <button onclick="window.location.href='translator.html'">🌍 Translator</button>
      <button onclick="window.location.href='qa.html'">📄 Document Q&A</button>
      <button onclick="window.location.href='youtube.html'">📺 YouTube AI</button>
      <button onclick="window.location.href='tutor.html'">🧠 AI Tutor</button>
      <button onclick="window.location.href='quiz.html'">📝 Quiz Maker</button>
      <button onclick="window.location.href='essay.html'">✍️ Essay Writer</button>
      <button onclick="window.location.href='history.html'">🕒 History</button>
    </div>

    <div class="topbar" style="transition: transform 0.4s ease;">
        <div class="menuBtn" onclick="toggleSidebar()">☰</div>
        <div class="appTitle" style="font-size: 18px;">Deep AI</div>
        
        <div style="margin-left: auto; display: flex; align-items: center; gap: 15px;">
            <button onclick="toggleFocusMode()" title="Focus Mode" style="background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-main);">🧘‍♂️</button>
            <div class="menuBtn" style="font-size: 20px;" onclick="clearSearchChat();" title="Clear All">🗑️</div>
            <button onclick="document.getElementById('settingsModal').style.display='flex'; updateBrainDisplay();" title="Settings" style="background:none; border:none; font-size:22px; cursor:pointer; color:var(--primary); animation: spinSlow 10s linear infinite;">⚙️</button>
        </div>
    </div>

    <div id="searchChatHistory" class="chat-scroll-area" style="margin-top: 75px; padding-bottom: 180px; transition: margin 0.4s ease, padding 0.4s ease;"></div>

    <div class="chat-input-area" style="background: var(--bg-surface); padding: 15px; border-top:1px solid var(--border-light); box-shadow: 0 -10px 30px rgba(0,0,0,0.1); transition: opacity 0.3s ease;">
        
        <button id="viewPhotosBtn" onclick="toggleMultiImage()" style="display:none; background:linear-gradient(135deg, var(--secondary), var(--primary)); color:white; border:none; padding:6px 12px; border-radius:12px; font-size:11px; font-weight:bold; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); margin-bottom: 10px;">🖼️ View Photos (0)</button>

        <div id="multiImageManager" style="display:none; padding:10px; margin-bottom:10px; background:var(--input-bg); border:1px solid var(--border-light); border-radius:12px; overflow-x:auto;">
            <div id="multiImageList" style="display:flex; gap:10px;"></div>
        </div>

        <div id="pdfPreviewChip" style="display:none; align-items:center; background:var(--input-bg); padding:8px 12px; border-radius:12px; margin-bottom:10px; font-size:12px; color:var(--primary); border:1px solid var(--primary);">
            📄 <span id="pdfName" style="margin:0 10px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">doc.pdf</span>
            <button onclick="clearPdfFile()" style="background:none; border:none; color:red; cursor:pointer; font-weight:bold; font-size:14px;">✕</button>
        </div>

        <div class="chat-input-wrapper" style="display:flex; align-items:flex-end; gap:10px; background:var(--input-bg); border:1px solid var(--border-light); border-radius:24px; padding:6px; box-shadow:var(--glass-shadow);">
            
            <div style="position:relative;">
                <button class="chat-action-btn" onclick="document.getElementById('attachmentMenu').style.display = document.getElementById('attachmentMenu').style.display === 'flex' ? 'none' : 'flex';" style="width:45px; height:45px; font-size:20px; background:transparent; border:none; cursor:pointer;">➕</button>
                
                <div id="attachmentMenu" style="display:none; position:absolute; bottom:60px; left:0; background:var(--bg-surface); border:1px solid var(--border-light); border-radius:16px; padding:10px; box-shadow:0 10px 30px rgba(0,0,0,0.6); flex-direction:column; gap:8px; z-index:100; min-width:150px;">
                    <button onclick="document.getElementById('imageUploadInput').click(); this.parentElement.style.display='none';" style="background:var(--input-bg); border:none; padding:12px; border-radius:10px; cursor:pointer; text-align:left; color:var(--text-main); font-weight:600;">🖼️ Add Photo</button>
                    <button onclick="document.getElementById('pdfUploadInput').click(); this.parentElement.style.display='none';" style="background:var(--input-bg); border:none; padding:12px; border-radius:10px; cursor:pointer; text-align:left; color:var(--text-main); font-weight:600;">📄 Add PDF</button>
                    <button onclick="document.getElementById('photoCreatorModal').style.display='block'; this.parentElement.style.display='none';" style="background:linear-gradient(135deg, #a855f7, #06b6d4); color:white; border:none; padding:12px; border-radius:10px; cursor:pointer; text-align:left; font-weight:600;">🎨 Create Photo</button>
                </div>
            </div>
            
            <input type="file" id="pdfUploadInput" accept="application/pdf" style="display:none;" onchange="handlePdfUpload(event)">
            <input type="file" id="imageUploadInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
            
            <textarea id="searchInput" placeholder="Ask anything or solve math..." style="flex:1; background:transparent; border:none; padding:12px 5px; font-size:15px; min-height:45px; color:var(--text-main); outline:none; resize:none;"></textarea>
            
            <button class="chat-action-btn send" id="sendSearchBtn" onclick="runStandaloneSearch()" style="width:50px; height:50px; font-size:22px; border-radius:50%; background:linear-gradient(135deg, var(--secondary), var(--primary)); color:white; border:none; cursor:pointer; box-shadow: 0 5px 15px var(--primary-glow);">🚀</button>
        </div>
    </div>

    <script>
        // --- BASE STATE & PERSISTENT BRAIN ---
        let appHistory = [];
        let sessionMessages = [];
        let isProcessing = false;
        let activeAbortController = null;
        let persistentPdfMemory = "";
        let uploadedImages = []; 
        let aiBrain = []; 

        function saveHistorySafe() {
            if (typeof localforage !== 'undefined') {
                localforage.setItem('aiHistory', appHistory).catch(err => console.log("DB Error:", err));
            }
            try { localStorage.setItem('aiHistory', JSON.stringify(appHistory)); } catch(e) {}
        }

        try { appHistory = JSON.parse(localStorage.getItem('aiHistory') || '[]'); } catch(e) { appHistory = []; }
        try { aiBrain = JSON.parse(localStorage.getItem('aiBrain') || '[]'); } catch(e) { aiBrain = []; }

        document.addEventListener("DOMContentLoaded", () => {
            if (sessionMessages.length === 0 && !new URLSearchParams(window.location.search).get('restore')) {
                showWelcomeMessage();
            }
        });

        window.addEventListener('pagehide', () => saveHistorySafe());
        window.addEventListener('beforeunload', () => saveHistorySafe());

        function showWelcomeMessage() {
            const chatContainer = document.getElementById("searchChatHistory");
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="chat-msg chat-ai" style="animation: slideInUp 0.5s ease;">
                    <div class="bubble" style="background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(139,92,246,0.1)); border: 1px solid var(--primary);">
                        <div class="ai-signature">✨ BY DEEP AI (SYSTEM)</div>
                        <b style="color:var(--primary); font-size:18px;">👋 Welcome to Deep AI!</b><br><br>
                        • <b>Ask anything</b> or upload photos/PDFs using the ➕ button.<br>
                        • <b>Math Solver & LaTeX:</b> Ask me math equations, I will solve them step-by-step with perfect fraction formatting.<br>
                        • <b>Focus Mode:</b> Click 🧘‍♂️ to hide all buttons/text boxes and just read.<br>
                        • <b>Code Boxes:</b> If I write code, it will be in a black box with a Copy button.<br>
                    </div>
                </div>`);
        }

        function updateBrainDisplay() { document.getElementById("aiBrainDisplay").value = aiBrain.join('\n'); }
        function clearBrain() { if(confirm("Erase AI's memory of you?")) { aiBrain = []; localStorage.removeItem('aiBrain'); updateBrainDisplay(); showToast("🧠 Memory Wiped."); } }

        function setFont(scale, btn) {
            document.documentElement.style.setProperty('--app-font-scale', scale);
            document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function toggleSidebar() { document.getElementById("sidebar").classList.toggle("active"); document.getElementById("overlay").classList.toggle("active"); }
        function toggleFocusMode() { 
            document.body.classList.toggle("focus-mode"); 
            showToast(document.body.classList.contains("focus-mode") ? "🧘‍♂️ Focus Mode ON - UI Hidden" : "🧘‍♂️ Focus Mode OFF"); 
        }
        function showToast(msg) { let t = document.createElement('div'); t.innerText = msg; t.style.cssText = "position:fixed; bottom:140px; left:50%; transform:translateX(-50%); background:var(--primary); color:white; padding:10px 20px; border-radius:20px; z-index:10000; font-weight:bold; font-size:12px; animation: slideUp 0.3s ease;"; document.body.appendChild(t); setTimeout(() => t.remove(), 2500); }
        function safeScroll() { const c = document.getElementById("searchChatHistory"); c.scrollTop = c.scrollHeight; }
        function clearSearchChat() { if(confirm("Clear this chat?")) { document.getElementById("searchChatHistory").innerHTML = ''; sessionMessages = []; persistentPdfMemory = ""; uploadedImages = []; updateImageUI(); clearPdfFile(); } }

        let currentFullscreenBase64 = null;
        window.openFullscreenImage = function(imgId) {
            const imgEl = document.getElementById(imgId); if(!imgEl) return;
            currentFullscreenBase64 = imgEl.src; document.getElementById('fsImage').src = currentFullscreenBase64;
            document.getElementById('fullscreenViewer').style.display = 'flex';
        }
        window.downloadFullscreenImage = function() {
            if(!currentFullscreenBase64) return;
            let a = document.createElement("a"); a.href = currentFullscreenBase64; a.download = `DeepAI_Artwork_${Date.now()}.png`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); showToast("✅ Download Complete!");
        }

        let currentUtterance = null;
        let ttsWordElements = [];

        function wrapTextNodesForTTS(element) {
            let wordId = 0;
            ttsWordElements = [];
            function traverse(node) {
                if(node.nodeType === 3 && node.nodeValue.trim().length > 0) {
                    let words = node.nodeValue.split(/(\s+)/);
                    let frag = document.createDocumentFragment();
                    words.forEach(w => {
                        if(w.trim().length > 0) {
                            let span = document.createElement('span'); span.className = 'tts-word'; span.id = 'tts_w_' + wordId; span.innerText = w; ttsWordElements.push(span); wordId++; frag.appendChild(span);
                        } else { frag.appendChild(document.createTextNode(w)); }
                    });
                    node.parentNode.replaceChild(frag, node);
                } else if(node.nodeType === 1 && node.className !== 'code-box' && !node.classList.contains('MathJax')) {
                    Array.from(node.childNodes).forEach(traverse);
                }
            }
            traverse(element);
        }

        function unwrapTextNodesForTTS(element) {
            element.querySelectorAll('.tts-word').forEach(span => { let text = document.createTextNode(span.innerText); span.parentNode.replaceChild(text, span); });
            element.normalize(); 
        }

        window.startTts = function(textId) {
            const textEl = document.getElementById(textId); if(!textEl) return;
            window.speechSynthesis.cancel();
            unwrapTextNodesForTTS(textEl);
            let pureText = textEl.innerText; 
            wrapTextNodesForTTS(textEl); 
            currentUtterance = new SpeechSynthesisUtterance(pureText);
            currentUtterance.lang = document.getElementById("appLang").value || "hi-IN"; 
            
            currentUtterance.onboundary = (e) => {
                if(e.name === 'word') {
                    ttsWordElements.forEach(el => el.classList.remove('tts-highlight'));
                    let passedText = pureText.substring(0, e.charIndex);
                    let wordIndex = passedText.trim().split(/\s+/).length - 1;
                    if(ttsWordElements[wordIndex]) ttsWordElements[wordIndex].classList.add('tts-highlight');
                }
            };
            currentUtterance.onend = () => { closeTts(); unwrapTextNodesForTTS(textEl); };
            currentUtterance.onerror = () => { closeTts(); unwrapTextNodesForTTS(textEl); };

            window.speechSynthesis.speak(currentUtterance);
            document.getElementById("ttsPlayer").style.display = "flex"; document.getElementById("ttsPlayPauseBtn").innerText = "⏸️";
        };

        window.toggleTts = function() {
            if(window.speechSynthesis.paused) { window.speechSynthesis.resume(); document.getElementById("ttsPlayPauseBtn").innerText = "⏸️"; } 
            else if(window.speechSynthesis.speaking) { window.speechSynthesis.pause(); document.getElementById("ttsPlayPauseBtn").innerText = "▶️"; }
        };

        window.closeTts = function() { window.speechSynthesis.cancel(); document.getElementById("ttsPlayer").style.display = "none"; };

        function processMath(text) {
            return text.replace(/(\d+)\/(\d+)/g, '\\frac{$1}{$2}');
        }

        function formatCodeBlocks(text) {
            return text.replace(/```([\s\S]*?)```/g, function(match, code) {
                let safeCode = code.replace(/</g, '&lt;').replace(/>/g, '&gt;').trim();
                let lines = safeCode.split('\n');
                if(lines[0] && !lines[0].includes(' ') && lines.length > 1) lines.shift(); 
                safeCode = lines.join('\n');
                
                return `<div class="code-box">
                    <div class="code-header">
                        <button class="copy-btn" onclick="navigator.clipboard.writeText(this.parentElement.nextElementSibling.innerText); this.innerText='Copied!'; setTimeout(()=>this.innerText='Copy Code',2000);">Copy Code</button>
                    </div>
                    <div class="code-body">${safeCode}</div>
                </div>`;
            });
        }

        function toggleMultiImage() { const m = document.getElementById("multiImageManager"); m.style.display = m.style.display === "none" ? "block" : "none"; }

        function updateImageUI() {
            const list = document.getElementById("multiImageList"); const btn = document.getElementById("viewPhotosBtn"); const manager = document.getElementById("multiImageManager");
            if (uploadedImages.length > 0) {
                btn.style.display = "block"; btn.innerText = `🖼️ View Photos (${uploadedImages.length})`; list.innerHTML = "";
                uploadedImages.forEach((imgSrc, index) => {
                    list.innerHTML += `<div style="position:relative; display:inline-block;"><button onclick="removeUploadedImage(${index})" style="position:absolute; top:-5px; right:-5px; background:red; color:white; border:none; border-radius:50%; width:20px; height:20px; cursor:pointer; z-index:10;">✕</button><img src="${imgSrc}" style="width:70px; height:70px; object-fit:cover; border-radius:10px; border:2px solid var(--border-light);"></div>`;
                });
            } else { btn.style.display = "none"; manager.style.display = "none"; }
        }

        function removeUploadedImage(index) { uploadedImages.splice(index, 1); updateImageUI(); }
        function handleImageUpload(e) { const f = e.target.files[0]; if(!f) return; if(uploadedImages.length >= 5) return showToast("❌ Max 5 images allowed!"); const r = new FileReader(); r.onload = () => { uploadedImages.push(r.result); updateImageUI(); showToast(`🖼️ Image added (${uploadedImages.length}/5)`); }; r.readAsDataURL(f); e.target.value = ""; }
        function handlePdfUpload(e) { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = async function() { const typedarray = new Uint8Array(this.result); const pdf = await pdfjsLib.getDocument(typedarray).promise; let text = ""; for(let i=1; i<=pdf.numPages; i++){ const page = await pdf.getPage(i); const content = await page.getTextContent(); text += content.items.map(i=>i.str).join(' '); } persistentPdfMemory = text; document.getElementById('pdfPreviewChip').style.display='flex'; document.getElementById('pdfName').innerText = f.name; showToast("📄 PDF Read!"); }; r.readAsArrayBuffer(f); e.target.value = ""; }
        function clearPdfFile() { persistentPdfMemory = ""; document.getElementById('pdfPreviewChip').style.display='none'; document.getElementById('pdfUploadInput').value = ""; }

        // ============================================================
        // 🚀 SECURE BACKEND IMAGE GENERATOR (NO CORS/GRADIO ERRORS) 🚀
        // ============================================================
        async function runFloatingImageCreator() {
            const q = document.getElementById("photoPromptInput").value.trim();
            if(!q) return showToast("Please describe the image first.");
            
            document.getElementById("photoCreatorModal").style.display = 'none'; 
            document.getElementById("photoPromptInput").value = "";
            
            const chatContainer = document.getElementById("searchChatHistory"); 
            const loadId = "load_" + Date.now();
            
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="chat-msg chat-user"><div class="bubble">🎨 <b>Create Image:</b><br>${q}</div></div>
                <div class="chat-msg chat-ai" id="${loadId}">
                    <div class="bubble">
                        <div class="ai-signature">✨ BY FLUX (SECURE BACKEND API)</div>
                        <div class="ai-thinking-pulse"><div class="pulse-orb"></div><span style="color:var(--text-muted); font-size:13px; font-weight:bold;">AI is painting securely...</span></div>
                    </div>
                </div>`);
            safeScroll();

            try {
                // Calls your brand new server.js endpoint!
                const response = await fetch("/api/hf-search-image", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: q })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Server failed to generate image.");
                }

                if (result.imageBase64) {
                    document.getElementById(loadId).querySelector('.bubble').innerHTML = `
                        <div class="ai-signature">✨ BY FLUX (SECURE BACKEND API)</div>
                        <div style="border-radius:12px; overflow:hidden;" onclick="openFullscreenImage('img_${loadId}')" title="Click to expand">
                            <img src="${result.imageBase64}" style="max-width:100%; display:block; cursor:pointer;" id="img_${loadId}" alt="Generated Image" onload="safeScroll()">
                        </div>`;
                    saveHistorySafe();
                } else {
                    throw new Error("Invalid image format received from server.");
                }
            } catch (error) {
                console.error("Backend Error:", error);
                document.getElementById(loadId).querySelector('.bubble').innerHTML = `<span style="color:red;">❌ Image Generation Failed: ${error.message}</span>`;
            }
        }

        // ============================================================
        // 🚀 MAIN TEXT / VISION CHAT ENGINE 🚀
        // ============================================================
        async function runStandaloneSearch() {
            const inp = document.getElementById("searchInput"); let q = inp.value.trim(); 
            if(!q && uploadedImages.length === 0 && !persistentPdfMemory) return; 
            if(isProcessing) { activeAbortController.abort(); isProcessing = false; document.getElementById("sendSearchBtn").innerHTML = "🚀"; return; }
            
            isProcessing = true; activeAbortController = new AbortController(); document.getElementById("sendSearchBtn").innerHTML = "🛑";
            
            const chatContainer = document.getElementById("searchChatHistory");
            const model = document.getElementById("modelSelector").value;
            const lang = document.getElementById("appLang").options[document.getElementById("appLang").selectedIndex].text;
            const tone = document.getElementById("aiTone").value;
            const webFocus = document.getElementById("webPriority").checked ? "PRIORITIZE LIVE WEB DATA." : "";

            let userImgHtml = ''; uploadedImages.forEach(img => { userImgHtml += `<img src="${img}" style="max-height:80px; border-radius:8px; margin-right:5px; margin-bottom:5px; display:inline-block; border:1px solid var(--border-light);">`; });
            let currentImagesToSave = [...uploadedImages];
            
            let imageToUseForApi = uploadedImages.length > 0 ? uploadedImages[0] : null;
            if (!imageToUseForApi && (q.toLowerCase().includes('image') || q.toLowerCase().includes('photo'))) {
                for(let i=sessionMessages.length-1; i>=0; i--) { if(sessionMessages[i].imgs && sessionMessages[i].imgs.length > 0) { imageToUseForApi = sessionMessages[i].imgs[0]; break; } }
            }

            chatContainer.insertAdjacentHTML('beforeend', `<div class="chat-msg chat-user" style="animation: slideInUp 0.3s;"><div class="bubble">${userImgHtml ? userImgHtml+'<br>':''}${q.replace(/\n/g, '<br>')}</div></div>`);
            inp.value = ""; safeScroll();

            let displayModel = model === 'gemini' ? 'GEMINI 1.5' : 'GROQ FAST API';
            let displayApi = imageToUseForApi ? 'VISION API' : 'TEXT API';

            const loadId = "load_" + Date.now();
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="chat-msg chat-ai" id="${loadId}">
                    <div class="bubble">
                        <div class="ai-signature">✨ BY ${displayModel} (${displayApi})</div>
                        <div class="ai-thinking-pulse"><div class="pulse-orb"></div><span style="color:var(--text-muted); font-size:13px; font-weight:bold;">AI is thinking...</span></div>
                    </div>
                </div>`);
            safeScroll();

            let brainContext = aiBrain.length > 0 ? `USER PROFILE FACTS: ${aiBrain.join('. ')}.` : '';
            let brainInstruction = `If the user tells you a specific fact about themselves or explicitly says "remember that [fact]", output the exact tag [MEMORY_SAVE: fact] at the VERY END of your response.`;
            let mathInstruction = `IMPORTANT: If the user asks a math calculation or equation, act as an expert Math Solver. Provide step-by-step solutions and ALWAYS use LaTeX formatting for mathematical expressions, equations, and fractions (e.g., use \\frac{num}{den} or $$x^2$$).`;

            let sysInstructions = `You are a highly intelligent AI. ${mathInstruction} ${brainInstruction} ${brainContext} YOU MUST ANSWER ENTIRELY IN ${lang}. ${webFocus} Tone: ${tone}.`;
            let contextStr = sessionMessages.slice(-5).map(m => `User: ${m.q}\nAI: ${m.a}`).join('\n'); 
            let finalPrompt = `${contextStr}\n\nCurrent Request: ${q}\n\n${persistentPdfMemory ? 'Context Document:\n'+persistentPdfMemory : ''}`;

            try {
                let endpoint = imageToUseForApi ? "/api/gemini-vision" : "/api/gemini-text";
                let body = imageToUseForApi ? { imageBase64: imageToUseForApi, userPrompt: sysInstructions + "\n" + finalPrompt, providerOverride: model } : { systemPrompt: sysInstructions, userPrompt: finalPrompt, providerOverride: model };
                
                const response = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: activeAbortController.signal });
                const data = await response.json();
                
                let cleanAns = data.text;
                
                let memoryMatch = cleanAns.match(/\[MEMORY_SAVE:(.*?)\]/i);
                if(memoryMatch) {
                    let newFact = memoryMatch[1].trim(); aiBrain.push(newFact); localStorage.setItem('aiBrain', JSON.stringify(aiBrain));
                    cleanAns = cleanAns.replace(memoryMatch[0], '').trim(); showToast("🧠 AI memorized a new fact!");
                }

                // Process Math Fractions and Format Code Blocks
                let processedMathAns = processMath(cleanAns);
                let formattedAns = formatCodeBlocks(processedMathAns).replace(/\n/g, '<br>');
                
                sessionMessages.push({ q: q, a: cleanAns, imgs: currentImagesToSave });
                appHistory.unshift({ id: Date.now(), type: 'search', title: q.substring(0, 20), interactions: [{ question: q, answer: cleanAns, image: currentImagesToSave[0] }] });
                saveHistorySafe();

                document.getElementById(loadId).querySelector('.bubble').innerHTML = `
                    <div class="ai-signature">✨ BY ${displayModel} (${displayApi})</div>
                    <div id="text_${loadId}" style="font-size:15px; line-height:1.7;">${formattedAns}</div>
                    <div style="margin-top:15px; border-top:1px solid var(--border-light); padding-top:12px; display:flex; gap: 10px;">
                        <button onclick="startTts('text_${loadId}')" style="background:var(--input-bg); border:1px solid var(--border-light); color:var(--text-main); border-radius:8px; padding:6px 15px; font-size:12px; cursor:pointer; font-weight:bold;">🔊 Play Voice</button>
                    </div>`;
                
                if (window.MathJax) { MathJax.typesetClear([document.getElementById(loadId)]); MathJax.typesetPromise([document.getElementById(loadId)]); }

            } catch (err) {
                if(err.name !== 'AbortError') document.getElementById(loadId).querySelector('.bubble').innerHTML = `<span style="color:red;">❌ Error: ${err.message}</span>`;
            } finally {
                isProcessing = false; document.getElementById("sendSearchBtn").innerHTML = "🚀"; uploadedImages = []; updateImageUI(); safeScroll();
            }
        }

        // --- SESSION RESTORE ---
        document.addEventListener("DOMContentLoaded", () => {
            const restoreId = new URLSearchParams(window.location.search).get('restore');
            if (!restoreId) return;

            setTimeout(() => {
                let item = appHistory.find(i => i.id == restoreId);
                if (!item || !item.interactions) return;

                sessionMessages = item.interactions.map(inter => ({ q: inter.question, a: inter.answer, imgs: inter.image ? [inter.image] : [] }));
                showToast("🧠 Session Restored!");

                const container = document.getElementById('searchChatHistory'); container.innerHTML = ''; 
                item.interactions.forEach((inter, index) => {
                    let imgHtml = inter.image ? `<img src="${inter.image}" class="bubble-img" style="max-height:80px; border-radius:8px; margin-bottom:5px; border:1px solid var(--border-light);">` : '';
                    let textId = `restored_text_${index}`;
                    
                    container.insertAdjacentHTML('beforeend', `
                        <div class="chat-msg chat-user"><div class="bubble">${imgHtml}<div>${inter.question.replace(/\n/g, '<br>')}</div></div></div>
                        <div class="chat-msg chat-ai">
                            <div class="bubble">
                                <div class="ai-signature">✨ BY AI (HISTORY API)</div>
                                <div id="${textId}">${formatCodeBlocks(processMath(inter.answer)).replace(/\n/g, '<br>')}</div>
                                <div style="margin-top:15px; border-top:1px solid var(--border-light); padding-top:12px; display:flex; gap: 10px;">
                                    <button onclick="startTts('${textId}')" style="background:var(--input-bg); border:1px solid var(--border-light); color:var(--text-main); border-radius:8px; padding:6px 15px; font-size:12px; cursor:pointer; font-weight:bold;">🔊 Play Voice</button>
                                </div>
                            </div>
                        </div>`);
                });
                safeScroll();
                if (window.MathJax) { MathJax.typesetPromise([container]); }
            }, 500); 
        });
    </script>
</body>
</html>
