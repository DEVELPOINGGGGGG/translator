<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Search</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
        /* JS ANIMATION UTILITIES ONLY (No layout styles) */
        .ripple {
            position: absolute; border-radius: 50%; transform: scale(0);
            animation: ripple-anim 0.6s linear; background-color: rgba(255, 255, 255, 0.4); pointer-events: none;
        }
        @keyframes ripple-anim {
            to { transform: scale(4); opacity: 0; }
        }
        .btn-relative { position: relative; overflow: hidden; }
        
        .api-badge {
            position: absolute; top: 12px; right: 16px; font-size: 9px; color: #c084fc; 
            font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            background: rgba(192, 132, 252, 0.1); padding: 4px 8px; border-radius: 10px;
            border: 1px solid rgba(192, 132, 252, 0.3); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body class="chat-page-layout">

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <button onclick="window.location.href='index.html'">🏠 Dashboard</button>
        <button onclick="window.location.href='search.html'" style="border-left: 5px solid #c084fc; background: rgba(255,255,255,0.08); color: #e9d5ff; padding-left: 40px;">🔍 Deep Search</button>
        <button onclick="window.location.href='maths.html'">🧮 Math Solver</button>
        <button onclick="window.location.href='image.html'">📸 Image Chat</button>
        <button onclick="window.location.href='translator.html'">🌍 Translator</button>
        <button onclick="window.location.href='qa.html'">📄 Document Q&A</button>
        <button onclick="window.location.href='history.html'">🕰️ History</button>
    </div>

    <div class="topbar">
        <div class="menuBtn" onclick="toggleSidebar()">☰</div>
        <div class="appTitle">Deep Search</div>
        <div class="menuBtn btn-relative" style="margin-left: auto; font-size: 20px; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; border-radius: 50%;" onclick="createRipple(event); clearSearchChat();" title="Clear Chat">🗑️</div>
    </div>

    <div class="apiTracker">
        <div>⏱️ PT: <span id="apiTimer" class="api-val timer">--:--:--</span></div>
        <div style="color: #f59e0b;">📊 Tot: <span id="apiTotal" class="api-val" style="color: #f59e0b;">0</span></div>
        <div>🖼️ <span id="apiVision" class="api-val vision">0</span></div>
        <div>📝 <span id="apiText" class="api-val text">0</span></div>
    </div>

    <div id="searchChatHistory" class="chat-scroll-area" style="margin-top: 105px; padding-bottom: 120px;">
        </div>

    <div class="chat-input-area">
        
        <div class="image-preview-chip" id="mathPreviewChip" style="display:none; position:absolute; top:-85px; left:20px; box-shadow: 0 10px 20px rgba(0,0,0,0.5);">
            <div class="closeBtn" style="position:absolute; top:-10px; right:-10px; width:28px; height:28px; font-size:12px;" onclick="clearSearchImage(event)">✕</div>
        </div>
        
        <div class="image-preview-chip" id="pdfPreviewChip" style="display:none; position:absolute; top:-85px; left:100px; background:var(--glass-panel); border-color:#38bdf8; flex-direction:column; align-items:center; justify-content:center; box-shadow: 0 10px 20px rgba(0,0,0,0.5);">
            <div style="font-size:24px; margin-bottom:2px;">📄</div>
            <div id="pdfName" style="font-size:10px; color:white; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:100%; text-align:center; padding: 0 4px;">doc.pdf</div>
            <div class="closeBtn" style="position:absolute; top:-10px; right:-10px; width:28px; height:28px; font-size:12px; background:#e11d48;" onclick="clearPdfFile(event)">✕</div>
        </div>

        <div class="chat-input-wrapper">
            <div style="position:relative;">
                <button class="chat-action-btn btn-relative" id="attachBtn" onclick="createRipple(event); toggleAttachmentMenu();" title="Attach File">➕</button>
                
                <div id="attachmentMenu" style="display:none; position:absolute; bottom:60px; left:0; background:rgba(15,23,42,0.95); border:1px solid rgba(255,255,255,0.1); backdrop-filter:blur(15px); border-radius:20px; padding:10px; box-shadow:0 10px 30px rgba(0,0,0,0.6); flex-direction:column; gap:8px; z-index:100; min-width:160px; animation:slideUp 0.2s ease-out;">
                    <button class="btn-relative" style="background:rgba(255,255,255,0.05); border:none; color:#f8fafc; cursor:pointer; display:flex; align-items:center; gap:12px; padding:12px 15px; border-radius:12px; font-size:15px; text-align:left; font-weight:600; width:100%;" onclick="createRipple(event); setTimeout(()=>document.getElementById('pdfUploadInput').click(), 200); toggleAttachmentMenu();">📄 Upload PDF</button>
                    <button class="btn-relative" style="background:rgba(255,255,255,0.05); border:none; color:#f8fafc; cursor:pointer; display:flex; align-items:center; gap:12px; padding:12px 15px; border-radius:12px; font-size:15px; text-align:left; font-weight:600; width:100%;" onclick="createRipple(event); setTimeout(openStandaloneCamera, 200); toggleAttachmentMenu();">📸 Camera</button>
                </div>
            </div>
            
            <input type="file" id="pdfUploadInput" accept="application/pdf" style="display: none;" onchange="handlePdfUpload(event)">
            
            <textarea id="searchInput" placeholder="Search web, upload PDF, or use Camera..." rows="1"></textarea>
            
            <button class="chat-action-btn send btn-relative" id="sendSearchBtn" onclick="createRipple(event); runStandaloneSearch();" title="Send">🚀</button>
        </div>
    </div>

    <div id="standaloneCameraModal" class="cameraModal">
        <button onclick="closeStandaloneCamera()" class="closeBtn btn-relative" style="position:absolute; top:30px; left:20px; z-index:1000;">✕</button>

        <video id="standaloneVideo" autoplay playsinline style="flex:1; width:100%; height:100%; object-fit:cover;"></video>
        <canvas id="standaloneCanvas" style="display:none;"></canvas>

        <div class="cameraControls">
            <button class="closeBtn btn-relative" id="standaloneFlashBtn" onclick="createRipple(event); toggleStandaloneFlash();" style="width:60px; height:60px; font-size:24px;">🔦</button>
            <div class="cameraCircle btn-relative" onclick="createRipple(event); captureStandalonePhoto();" title="Capture"></div>
            <button class="closeBtn btn-relative" onclick="createRipple(event); switchStandaloneCamera();" style="width:60px; height:60px; font-size:24px;">🔄</button>
        </div>
    </div>


    <script>
        // --- 1. STATE VARIABLES & WEBHOOK ---
        const GOOGLE_SHEETS_WEBHOOK = "https://script.google.com/macros/s/AKfycbz1_gv9M2QYJcWkkUQMlDtpBXajrV0psXXc9q68LZLJkZ0b_rokKsz6fyKcYzJ8R6Dsnw/exec";
        
        let standaloneCapturedImage = null;
        let persistentPdfMemory = "";
        let isProcessing = false;
        
        let visionReqs = parseInt(localStorage.getItem('visionReqs') || '0');
        let textReqs = parseInt(localStorage.getItem('textReqs') || '0');
        let hasResetToday = false;

        // --- 2. JS ANIMATION FACTORY ---
        function createRipple(event) {
            const button = event.currentTarget;
            const circle = document.createElement("span");
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - button.getBoundingClientRect().left - radius}px`;
            circle.style.top = `${event.clientY - button.getBoundingClientRect().top - radius}px`;
            circle.classList.add("ripple");
            const ripple = button.getElementsByClassName("ripple")[0];
            if (ripple) ripple.remove();
            button.appendChild(circle);
        }

        function fireParticles(element) {
            const rect = element.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            
            for(let i=0; i<30; i++) {
                let p = document.createElement('div');
                p.style.position = 'fixed'; p.style.left = x+'px'; p.style.top = y+'px';
                p.style.width = Math.random() * 8 + 4 + 'px'; p.style.height = p.style.width;
                p.style.background = ['#38bdf8', '#c084fc', '#f472b6', '#34d399', '#facc15'][Math.floor(Math.random()*5)];
                p.style.borderRadius = '50%'; p.style.pointerEvents = 'none'; p.style.zIndex = 99999;
                document.body.appendChild(p);
                
                let angle = Math.random() * Math.PI * 2;
                let velocity = 2 + Math.random() * 8;
                let dx = Math.cos(angle) * velocity;
                let dy = Math.sin(angle) * velocity;
                let opacity = 1;
                
                function animateParticle() {
                    let currentX = parseFloat(p.style.left); let currentY = parseFloat(p.style.top);
                    p.style.left = (currentX + dx) + 'px'; p.style.top = (currentY + dy) + 'px';
                    opacity -= 0.02; p.style.opacity = opacity;
                    dy += 0.2; // gravity effect
                    if(opacity > 0) requestAnimationFrame(animateParticle); else p.remove();
                }
                requestAnimationFrame(animateParticle);
            }
        }

        // SMART TYPEWRITER ENGINE (NO AUTO-SCROLL, 10 SECONDS MAX)
        function typeWriterEffect(element, text) {
            element.innerHTML = "";
            let i = 0;
            
            // Calculate Speed: Maximum 10 seconds total time
            const maxDurationMs = 10000; 
            let tickRate = 20; // Default fast tick (20ms)
            let totalTicksAllowed = maxDurationMs / tickRate;
            
            let charsPerTick = 1;
            
            if (text.length > totalTicksAllowed) {
                // If it's a huge text, print chunks so it finishes in exactly 10s
                charsPerTick = Math.ceil(text.length / totalTicksAllowed);
            } else if (text.length < 150) {
                // Medium speed for short sentences so it doesn't just flash instantly
                tickRate = 35; 
            }
            
            let timer = setInterval(() => {
                if (i < text.length) {
                    let chunk = text.substr(i, charsPerTick);
                    for(let c of chunk) {
                        if(c === '\n') { element.appendChild(document.createElement('br')); }
                        else { element.appendChild(document.createTextNode(c)); }
                    }
                    i += charsPerTick;
                    // AUTO-SCROLL HAS BEEN COMPLETELY REMOVED HERE
                } else {
                    clearInterval(timer);
                }
            }, tickRate);
        }

        // --- 3. BACKGROUND WEBHOOK LOGGING ---
        function syncToSheets(question, answer, provider) {
            fetch(GOOGLE_SHEETS_WEBHOOK, {
                method: "POST", mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ 
                    action: "log", type: "search", 
                    question: question, 
                    answer: answer.replace(/<[^>]*>?/gm, ''), 
                    provider: provider || "Gemini" 
                })
            }).catch(e => console.log("Google Sheets sync failed."));
        }

        // --- 4. INITIALIZATION ---
        document.addEventListener("DOMContentLoaded", () => {
            const chatContainer = document.getElementById("searchChatHistory");
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="chat-msg chat-ai">
                    <div class="bubble">
                        👋 <b>Welcome to Deep Search!</b><br><br>
                        1. <b>➕ Button:</b> Attach a PDF or use the Camera.<br>
                        2. <b>Search:</b> Type any question; I will use your file + Internet to answer it.<br>
                        <br><i style="color: var(--muted); font-size: 13px;">Note: I will remember your PDF during our chat!</i>
                    </div>
                </div>
            `);

            const inp = document.getElementById("searchInput");
            inp.addEventListener("keypress", function(e) {
                if(e.key === "Enter" && !e.shiftKey) { e.preventDefault(); runStandaloneSearch(); }
            });
            startApiTracker();
        });

        function toggleSidebar() { document.getElementById("sidebar").classList.toggle("active"); document.getElementById("overlay").classList.toggle("active"); }
        function toggleAttachmentMenu() { const menu = document.getElementById('attachmentMenu'); menu.style.display = menu.style.display === 'none' ? 'flex' : 'none'; }
        
        function scrollToBottom() { 
            const c = document.getElementById("searchChatHistory"); 
            c.scrollTop = c.scrollHeight; 
        }
        
        function clearSearchChat() {
            if(confirm("Are you sure you want to clear this chat?")) {
                document.getElementById("searchChatHistory").innerHTML = `<div class="chat-msg chat-ai"><div class="bubble">Chat cleared. How can I help you next?</div></div>`;
                clearSearchImage(); clearPdfFile(); persistentPdfMemory = "";
            }
        }

        function showStandaloneToast(msg) {
            let t = document.createElement('div'); t.innerText = msg;
            t.style.cssText = "position:fixed; bottom:120px; left:50%; transform:translateX(-50%); background: var(--gemini-grad); color:black; padding:12px 25px; border-radius:30px; box-shadow:0 10px 25px rgba(0,242,254,0.4); z-index:10000; font-weight:800; font-size: 14px; text-align:center; animation: slideUp 0.3s ease-out;";
            document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
        }

        function updateTrackerDisplay() {
            document.getElementById('apiTotal').innerText = visionReqs + textReqs;
            document.getElementById('apiVision').innerText = visionReqs;
            document.getElementById('apiText').innerText = textReqs;
        }

        function trackAPI(type) {
            if(type === 'v') { visionReqs++; localStorage.setItem('visionReqs', visionReqs); }
            else { textReqs++; localStorage.setItem('textReqs', textReqs); }
            updateTrackerDisplay();
        }

        function startApiTracker() {
            updateTrackerDisplay();
            setInterval(() => {
                const now = new Date();
                const laTime = new Date(now.toLocaleString("en-US", { timeZone: "America/Los_Angeles" }));
                const nextMidnight = new Date(laTime); nextMidnight.setHours(24, 0, 0, 0);
                let diffMs = nextMidnight - laTime;
                let h = Math.floor(diffMs / (1000 * 60 * 60)), m = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60)), s = Math.floor((diffMs % (1000 * 60)) / 1000);
                if (h === 24) { h = 0; m = 0; s = 0; }
                const pad = (num) => num.toString().padStart(2, '0');
                if (laTime.getHours() === 0 && laTime.getMinutes() === 0 && !hasResetToday) { 
                    visionReqs = 0; textReqs = 0; localStorage.setItem('visionReqs', '0'); localStorage.setItem('textReqs', '0'); hasResetToday = true; updateTrackerDisplay();
                } else if (laTime.getHours() !== 0) { hasResetToday = false; }
                const t = document.getElementById('apiTimer'); if(t) t.innerText = `${pad(h)}h ${pad(m)}m ${pad(s)}s`;
            }, 1000);
        }

        // --- 5. PERSISTENT PDF MEMORY ---
        async function handlePdfUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.type !== "application/pdf") return showStandaloneToast("⚠️ Only PDF files are supported!");
            
            showStandaloneToast("📄 Reading PDF...");
            const fileReader = new FileReader();
            
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                try {
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let fullText = `DOCUMENT NAME: ${file.name}\n`;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        fullText += `\n--- Page ${i} ---\n` + textContent.items.map(item => item.str).join(' ');
                    }
                    persistentPdfMemory = fullText;
                    
                    const chip = document.getElementById("pdfPreviewChip");
                    chip.style.display = "flex"; document.getElementById("pdfName").innerText = file.name;
                    showStandaloneToast(`✅ PDF Attached!`);
                } catch(e) { showStandaloneToast("❌ Error reading PDF."); }
            };
            fileReader.readAsArrayBuffer(file);
        }

        function clearPdfFile(e) {
            if(e) e.stopPropagation(); persistentPdfMemory = "";
            document.getElementById("pdfUploadInput").value = "";
            document.getElementById("pdfPreviewChip").style.display = "none";
        }

        // --- 6. PRO CAMERA ENGINE ---
        let standaloneStream = null; let standaloneFacingMode = "environment"; let isStandaloneFlashOn = false;

        async function startCameraTrack() {
            if (standaloneStream) { standaloneStream.getTracks().forEach(t => t.stop()); }
            try {
                standaloneStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: standaloneFacingMode, width: {ideal: 1920}, height: {ideal: 1080} } });
                document.getElementById("standaloneVideo").srcObject = standaloneStream;
                setTimeout(async () => {
                    if (standaloneFacingMode === "environment") {
                        const track = standaloneStream.getVideoTracks()[0];
                        try { const cap = track.getCapabilities(); if (cap.torch) { isStandaloneFlashOn = true; await track.applyConstraints({ advanced: [{ torch: true }] }); updateFlashUI(); } } catch(err) {}
                    }
                }, 500);
            } catch(e) { showStandaloneToast("⚠️ Camera Error."); }
        }

        async function openStandaloneCamera() { document.getElementById("standaloneCameraModal").classList.add("active"); await startCameraTrack(); }
        function closeStandaloneCamera() {
            document.getElementById("standaloneCameraModal").classList.remove("active");
            if (standaloneStream) { const track = standaloneStream.getVideoTracks()[0]; try { if (track && track.getCapabilities().torch) track.applyConstraints({ advanced: [{ torch: false }] }); } catch(err) {} standaloneStream.getTracks().forEach(t => t.stop()); standaloneStream = null; }
            isStandaloneFlashOn = false; updateFlashUI();
        }

        async function switchStandaloneCamera() { standaloneFacingMode = standaloneFacingMode === "environment" ? "user" : "environment"; await startCameraTrack(); }
        async function toggleStandaloneFlash() {
            if (!standaloneStream) return; const track = standaloneStream.getVideoTracks()[0];
            try { if (track.getCapabilities().torch) { isStandaloneFlashOn = !isStandaloneFlashOn; await track.applyConstraints({ advanced: [{ torch: isStandaloneFlashOn }] }); updateFlashUI(); } } catch(err){}
        }

        function updateFlashUI() {
            const btn = document.getElementById("standaloneFlashBtn");
            if (btn) { btn.innerText = isStandaloneFlashOn ? "💡" : "🔦"; btn.style.background = isStandaloneFlashOn ? "rgba(239, 68, 68, 0.8)" : "rgba(255,255,255,0.15)"; }
        }

        function captureStandalonePhoto() {
            const v = document.getElementById("standaloneVideo"); const c = document.getElementById("standaloneCanvas");
            let w = v.videoWidth, h = v.videoHeight; if(w > 1500) { h *= 1500/w; w = 1500; }
            c.width = w; c.height = h; c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
            standaloneCapturedImage = c.toDataURL("image/jpeg", 0.7);
            const chip = document.getElementById("mathPreviewChip"); chip.style.display = "block"; chip.style.backgroundImage = `url(${standaloneCapturedImage})`;
            closeStandaloneCamera();
        }

        function clearSearchImage(e) { if(e) e.stopPropagation(); standaloneCapturedImage = null; document.getElementById("mathPreviewChip").style.display = "none"; }

        // --- 7. CORE SEARCH LOGIC & API CALLS ---
        async function runStandaloneSearch() {
            const inp = document.getElementById("searchInput");
            const q = inp.value.trim(); 
            
            if(!q && !standaloneCapturedImage && !persistentPdfMemory) return;
            if(isProcessing) return; isProcessing = true;

            const chatContainer = document.getElementById("searchChatHistory");
            
            // User Bubble
            let displayQ = q || "Analyze this document.";
            let imgHtml = standaloneCapturedImage ? `<img src="${standaloneCapturedImage}" class="bubble-img">` : '';
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="chat-msg chat-user">
                    <div class="bubble">
                        ${imgHtml}
                        <div>${displayQ.replace(/\n/g, '<br>')}</div>
                    </div>
                </div>
            `);
            
            inp.value = ""; 
            scrollToBottom(); // Scroll once when user sends message

            // Loading Bubble
            const loadId = "load_" + Date.now();
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="chat-msg chat-ai" id="${loadId}">
                    <div class="bubble" style="display:flex; align-items:center; gap:12px;">
                        <div class="typing-indicator">
                            <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
                        </div>
                        <span style="color:var(--muted); font-size:14px; font-weight:600;">AI is thinking...</span>
                    </div>
                </div>
            `);
            scrollToBottom(); // Scroll once when loading appears

            let sysPrompt = `You are an expert AI Assistant and Guide. 
            CRITICAL RULES:
            1. YOU MUST ANSWER ENTIRELY IN HINDI (DEVANAGARI SCRIPT ONLY). DO NOT USE ENGLISH.
            2. If the user provides a document and asks "how to fill it", DO NOT say the document lacks instructions. 
            3. Use your general internet knowledge combined with the provided document context to explain EXACTLY how to fulfill the user's request step-by-step.`;

            let finalPrompt = `User Question: ${q || 'Please help me with this document.'}\n\n`;
            if (persistentPdfMemory) finalPrompt += `[BACKGROUND DOCUMENT CONTEXT]:\n${persistentPdfMemory}`;

            try {
                let endpoint = standaloneCapturedImage ? "/api/gemini-vision" : "/api/gemini-text";
                let bodyData = standaloneCapturedImage ? 
                    { imageBase64: standaloneCapturedImage, userPrompt: `${sysPrompt}\n\n${finalPrompt}` } : 
                    { systemPrompt: sysPrompt, userPrompt: finalPrompt };

                const response = await fetch(endpoint, {
                    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(bodyData)
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Server Error");

                let cleanAns = data.text.replace(/[\*&#_]/g, '');
                let apiProvider = data.provider || "Gemini Core API"; 
                
                trackAPI(standaloneCapturedImage ? 'v' : 't');
                syncToSheets(q || "PDF/Image Search", cleanAns, apiProvider);
                
                // Clear the UI attachments
                clearSearchImage(); 
                document.getElementById("pdfPreviewChip").style.display = "none";
                
                // Inject the final bubble structure (without scrolling)
                const finalBubble = document.getElementById(loadId).querySelector('.bubble');
                finalBubble.innerHTML = `
                    <div class="api-badge">✨ BY ${apiProvider}</div>
                    <div id="text_${loadId}" style="margin-top:10px; line-height: 1.6;"></div>
                `;
                
                // Fire animations!
                fireParticles(finalBubble);
                typeWriterEffect(document.getElementById(`text_${loadId}`), cleanAns);

            } catch (error) {
                document.getElementById(loadId).querySelector('.bubble').innerHTML = `<span style="color: #ef4444;">❌ Error: ${error.message}</span>`;
            } finally {
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
