<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Suite - Text Translator</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="topbar">
  <div class="menuBtn" onclick="toggleSidebar()">☰</div>
  <div class="appTitle">AI Pro Suite</div>
</div>
<div class="apiTracker">
    <div>⏱️ Reset: <span id="apiTimer" class="api-val timer">60s</span></div>
    <div>🖼️ Vis: <span id="apiVision" class="api-val vision">0</span>/20</div>
    <div>📝 Txt: <span id="apiText" class="api-val text">0</span>/20</div>
</div>

<div id="ttsPlayer">
  <div class="ttsIndicator">🔊 Reading</div>
  <button class="ttsBtn" id="ttsPlayBtn">⏸️</button>
  <button class="ttsBtn" id="ttsStopBtn">⏹️</button>
  <button class="ttsBtn" id="ttsCloseBtn">✖️</button>
</div>

<div class="sidebar" id="sidebar">
  <button onclick="window.location.href='index.html'">🏠 Dashboard</button>
  <button onclick="window.location.href='maths.html'">🧮 Math Solver (Gemini)</button>
  <button onclick="window.location.href='search.html'">🔎 Deep Search (Groq)</button>
  <button onclick="window.location.href='translator.html'" style="border-left: 4px solid #3b82f6; color: #60a5fa; background: #111827;">🎙️ Text Translator</button>
  <button onclick="window.location.href='image.html'">🖼️ Image Translator</button>
  <button onclick="window.location.href='qa.html'">📚 Document Q&A</button>
  <button onclick="window.location.href='history.html'">🕒 History & Downloads</button>
</div>

<div class="page active" id="translatorPage">
  
  <div class="card" style="background:linear-gradient(135deg,#f59e0b,#d97706); border:none; text-align:center;">
    <h1 style="font-size: 24px;">🎙️ Voice & Text Translator</h1>
    <p style="font-size: 14px; opacity: 0.9;">Speak or type to instantly translate.</p>
  </div>

  <div class="card">
    <div class="voiceHeader">
      <div><div class="cardTitle">Input Text</div></div>
      <button class="micBtn" id="micBtn" onclick="toggleRecording()">🎤</button>
    </div>
    
    <select id="voiceSourceLang" style="margin-bottom: 10px;">
      <option value="hi-IN">Speak in: Hindi</option>
      <option value="en-US">Speak in: English</option>
    </select>
    
    <textarea class="standard" id="inputText" placeholder="Speak into the mic or type your text here..."></textarea>
    
    <div class="cardTitle" style="margin-top: 15px;">Translate Into:</div>
    <select id="targetLang">
      <option>Hindi</option>
      <option>English</option>
      <option>French</option>
      <option>Spanish</option>
      <option>German</option>
      <option>Japanese</option>
    </select>
    
    <button class="btn blue" onclick="runTranslation()">🌍 Convert</button>
    
    <div class="cardTitle" style="margin-top: 20px;">Translation Output:</div>
    <div class="status" id="translatedTextStatus" style="display:none; margin-bottom:10px;"></div>
    
    <div class="outputBox" id="translatedText" style="min-height: 100px;">Translation will appear here...</div>
    
    <button class="btn green" id="speakTransBtn" style="display:none; margin-top: 15px;" onclick="speakText('translatedText')">🔊 Speak Translation</button>
  </div>

</div>

<script src="ui-controls.js" defer></script>
<script src="main.js" defer></script>

</body>
</html>
