<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Suite - Dashboard</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="topbar">
  <div class="menuBtn" onclick="toggleSidebar()">☰</div>
  <div class="appTitle">AI Pro Suite</div>
</div>

<div class="sidebar" id="sidebar">
  <button class="sidebar-close-btn" onclick="toggleSidebar()">✖ Close Menu</button>
  <button onclick="window.location.href='index.html'">🏠 Dashboard</button>
  <button onclick="window.location.href='maths.html'">🧮 Math Solver (Gemini)</button>
  <button onclick="window.location.href='search.html'">🔎 Deep Search (Groq)</button>
  <button onclick="window.location.href='youtube.html'">▶️ YouTube Search</button>
  <button onclick="window.location.href='quiz.html'">📝 Take a Quiz!</button>
  <button onclick="window.location.href='translator.html'">🎙️ Text Translator</button>
  <button onclick="window.location.href='image.html'">🖼️ Image Translator</button>
  <button onclick="window.location.href='create.html'">🎨 Image Creator</button>
  <button onclick="window.location.href='qa.html'">📚 Document Q&A</button>
  <button onclick="window.location.href='history.html'">🕒 History & Downloads</button>

</div>

<div class="page active" id="homePage" style="top: 70px;">
  <div style="text-align: center; margin-bottom: 30px; margin-top: 20px;">
    <h1 style="font-size: 28px; background: linear-gradient(90deg, #3b82f6, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Welcome to AI Pro Suite</h1>
    <p style="color: var(--muted); margin-top: 10px;">Select a tool below to get started</p>
  </div>

  <div class="card" style="margin-bottom: 25px; border-top: 3px solid #3b82f6;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <div>
            <div class="cardTitle" style="margin: 0;">📊 Live API Usage</div>
            <div id="apiResetTimer" style="font-size: 13px; color: #f59e0b; font-weight: 600; margin-top: 4px; letter-spacing: 0.5px;">
                ⏳ Quota Reset: Calculating...
            </div>
        </div>
        <button class="actionBtnSmall blue" onclick="fetchApiUsage()" title="Refresh Stats">🔄</button>
    </div>
    
    <div id="apiUsageContainer" style="display: flex; flex-wrap: wrap; gap: 10px;">
        <div style="color: var(--muted); font-size: 14px;">Loading server stats...</div>
    </div>
  </div>

  <div class="dashboard-grid">
    <div class="dash-card" onclick="window.location.href='maths.html'">
      <div class="dash-icon">🧮</div>
      <div class="dash-title">Math Solver</div>
    </div>
    <div class="dash-card" onclick="window.location.href='search.html'">
      <div class="dash-icon">🔎</div>
      <div class="dash-title">Deep Search</div>
    </div>
    <div class="dash-card" onclick="window.location.href='youtube.html'">
      <div class="dash-icon">▶️</div>
      <div class="dash-title">YouTube Search</div>
    </div>
          <div class="dash-card" onclick="window.location.href='quiz.html'">
      <div class="dash-icon">📝</div>
      <div class="dash-title">Take a Quiz!</div>
    </div>
    <div class="dash-card" onclick="window.location.href='translator.html'">
      <div class="dash-icon">🎙️</div>
      <div class="dash-title">Text & Voice</div>
    </div>
    <div class="dash-card" onclick="window.location.href='image.html'">
      <div class="dash-icon">🖼️</div>
      <div class="dash-title">Image Translate</div>
    </div>
    <div class="dash-card" onclick="window.location.href='create.html'">
      <div class="dash-icon">🎨</div>
      <div class="dash-title">Image Creator</div>
    </div>
    <div class="dash-card" onclick="window.location.href='qa.html'">
      <div class="dash-icon">📚</div>
      <div class="dash-title">Document Q&A</div>
    </div>
    <div class="dash-card" onclick="window.location.href='history.html'">
      <div class="dash-icon">🕒</div>
      <div class="dash-title">History</div>
    </div>
  </div>
</div>

<script>
    // Simple logic to open and close the side menu
    function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const active = !sidebar.classList.contains("active");
        sidebar.classList.toggle("active", active);
        overlay.classList.toggle("active", active);
        document.body.classList.toggle("sidebar-open", active);
    }
    
    document.getElementById("overlay").onclick = () => { 
        document.getElementById("sidebar").classList.remove("active"); 
        document.getElementById("overlay").classList.remove("active");
        document.body.classList.remove("sidebar-open");
    };

    // --- 🛑 TIMER LOGIC FOR GOOGLE API RESET 🛑 ---
// --- 🛑 TIMER LOGIC FOR GOOGLE API RESET (PACIFIC TIME) 🛑 ---
    function updateResetTimer() {
        const now = new Date();
        const laTimeStr = now.toLocaleString("en-US", { timeZone: "America/Los_Angeles" });
        const laTime = new Date(laTimeStr);
        
        const nextMidnight = new Date(laTime);
        nextMidnight.setHours(24, 0, 0, 0); 
        
        const diffMs = nextMidnight - laTime;
        
        const h = Math.floor(diffMs / (1000 * 60 * 60));
        const m = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diffMs % (1000 * 60)) / 1000);
        
        const pad = (num) => num.toString().padStart(2, '0');
        
        const timerElement = document.getElementById("apiResetTimer");
        if (timerElement) {
            timerElement.innerText = `⏳ Quota resets in: ${pad(h)}h ${pad(m)}m ${pad(s)}s`;
        }
    }
    
    updateResetTimer();
    setInterval(updateResetTimer, 1000);
    // ----------------------------------------------

    // Fetch and render API usage
    async function fetchApiUsage() {
        const container = document.getElementById("apiUsageContainer");
        if (!container) return;
        
        container.innerHTML = '<div class="spinner"></div> <span style="font-size:14px; color:var(--muted);">Syncing with server...</span>';
        
        try {
            const res = await fetch('/api/usage');
            const data = await res.json();
            
            if (Object.keys(data).length === 0) {
                container.innerHTML = '<div style="color: var(--muted); font-size: 14px; width: 100%; text-align: center; padding: 10px;">No API requests made yet since last server restart.</div>';
                return;
            }

            container.innerHTML = Object.entries(data).map(([apiName, count]) => `
                <div style="background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 16px; flex: 1; min-width: 110px; text-align: center; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);">
                    <div style="font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;">${apiName}</div>
                    <div style="font-size: 24px; font-weight: 800; color: #60a5fa;">${count} <span style="font-size:10px; color:#64748b; font-weight:500;">reqs</span></div>
                </div>
            `).join('');
            
        } catch(e) {
            container.innerHTML = '<div style="color: var(--red); font-size: 14px;">⚠️ Failed to connect to server.</div>';
        }
    }
    
    document.addEventListener("DOMContentLoaded", fetchApiUsage);
</script>

<script src="ui-controls.js" defer></script>
</body>
</html>
